<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
<title>bengbengbeng · 绷绷绷单词</title>
<meta name="description" content="大学四级 / 托福 / SAT 单词，按艾宾浩斯记忆曲线安排复习，标注音标与词典真人发音。" />
<meta name="theme-color" content="#F2F4F9" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="apple-touch-icon" href="./apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="绷绷绷单词" />
<style>
/* bengbengbeng · 绷绷绷单词 */
:root {
  --paper: #FFFFFF;
  --ink: #1F2530;
  --ink-2: #3C4553;
  --sub: #5B6472;      /* 对比度 5.98:1 */
  --faint: #6B7585;    /* 4.66:1 */
  --rule: #D9E2F1;
  --bg: #F2F4F9;
  --surface: #FFFFFF;
  --surface-2: #F7F9FC;
  --line: #E8ECF4;
  --brand: #4C5FD5;
  --brand-dark: #3A4BB8;
  --brand-soft: #EDEFFD;
  --brand-grad: linear-gradient(135deg, #5B6BE0 0%, #4051C4 100%);
  --green: #1E9C63;
  --green-soft: #E6F6EE;
  --red: #D8453C;
  --red-soft: #FDEDEC;
  --amber: #EF9A21;
  --amber-soft: #FEF3E2;
  --r-lg: 20px;
  --r-md: 14px;
  --r-sm: 10px;
  --shadow-1: 0 1px 2px rgba(31, 37, 48, .05), 0 6px 16px -12px rgba(31, 37, 48, .22);
  --shadow-2: 0 12px 34px -20px rgba(31, 37, 48, .55);
  --shadow-brand: 0 10px 22px -12px rgba(76, 95, 213, .65);
  --spring: cubic-bezier(.34, 1.4, .64, 1);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Songti SC", serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --app-w: 540px;
  --tabbar-h: 64px;
}

:root[data-theme="dark"] {
  --paper: #1C212B;
  --ink: #E7EAF1;
  --ink-2: #C6CCDA;
  --sub: #A7B2C4;      /* 7.53:1 */
  --faint: #96A0B1;    /* 6.11:1 */
  --rule: #333C4E;
  --bg: #12151C;
  --surface: #1C212B;
  --surface-2: #232936;
  --line: #2B3341;
  --brand: #8595F0;
  --brand-dark: #6E7FE4;
  --brand-soft: #232A44;
  --brand-grad: linear-gradient(135deg, #5866CC 0%, #414FAE 100%);
  --green: #5FC492;
  --green-soft: #1C2E28;
  --red: #EC7A72;
  --red-soft: #37262A;
  --amber: #E8A64A;
  --amber-soft: #33291A;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 20px -16px rgba(0, 0, 0, .8);
  --shadow-2: 0 14px 36px -22px rgba(0, 0, 0, .9);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--ui);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(760px 420px at 12% -10%, rgba(91, 107, 224, .10), transparent 62%),
    radial-gradient(620px 380px at 92% 6%, rgba(30, 156, 99, .07), transparent 60%);
  pointer-events: none;
  z-index: 0;
}

button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
input, select { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }

.app {
  position: relative;
  z-index: 1;
  max-width: var(--app-w);
  margin: 0 auto;
  padding: 0 18px calc(var(--tabbar-h) + 26px);
  min-height: 100%;
}

/* ---------- 顶栏 ---------- */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 20px 2px 10px;
}

.brand { display: flex; align-items: baseline; gap: 9px; }
.brand b {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -.4px;
  background: var(--brand-grad);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.brand span { font-size: 11.5px; color: var(--faint); letter-spacing: 1.4px; text-transform: uppercase; }

.icon-btn {
  width: 38px; height: 38px;
  display: grid; place-items: center;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  color: var(--sub);
  box-shadow: var(--shadow-1);
  transition: transform .18s var(--spring), color .18s;
}
.icon-btn:hover { color: var(--brand); transform: translateY(-1px); }
.icon-btn:active { transform: scale(.94); }

.streak {
  display: inline-flex; align-items: center; gap: 6px;
  height: 38px; padding: 0 13px 0 11px;
  border-radius: 12px;
  background: var(--amber-soft);
  color: #B2700F;
  font-size: 13px; font-weight: 600;
  border: 1px solid rgba(239, 154, 33, .28);
}
:root[data-theme="dark"] .streak { color: var(--amber); }

/* ---------- 通用卡片 ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-1);
  padding: 18px;
  margin-bottom: 14px;
}
.card.tight { padding: 15px 16px; }

.sec-title {
  display: flex; align-items: center; justify-content: space-between;
  margin: 22px 2px 10px;
}
.sec-title h2 {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .2px;
  color: var(--sub);
}
.sec-title .link { font-size: 12.5px; color: var(--brand); font-weight: 600; }

.pill {
  display: inline-flex; align-items: center; gap: 5px;
  height: 24px; padding: 0 9px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  font-size: 11.5px; color: var(--sub); font-weight: 600;
  white-space: nowrap;
}
.pill.brand { background: var(--brand-soft); border-color: transparent; color: var(--brand); }
.pill.green { background: var(--green-soft); border-color: transparent; color: var(--green); }
.pill.red { background: var(--red-soft); border-color: transparent; color: var(--red); }

/* ---------- 今日任务 ---------- */
.greet { padding: 2px 2px 16px; }
.greet h1 {
  margin: 0 0 6px;
  font-family: var(--serif);
  font-size: 27px;
  line-height: 1.28;
  font-weight: 600;
  letter-spacing: -.5px;
}
.greet h1 em {
  font-style: normal;
  color: var(--brand);
  position: relative;
  display: inline-block;
}
.greet p { margin: 0; color: var(--sub); font-size: 13.5px; }

.task { position: relative; overflow: hidden; }
.task::after {
  content: "";
  position: absolute; width: 200px; height: 200px; right: -70px; top: -90px;
  background: radial-gradient(circle, rgba(76, 95, 213, .13), transparent 68%);
  pointer-events: none;
}

.task-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.task-head strong { font-size: 14.5px; font-weight: 650; letter-spacing: .1px; }

.task-metrics { display: flex; gap: 26px; margin-bottom: 16px; }
.metric .num {
  font-family: var(--serif);
  font-size: 30px;
  font-weight: 600;
  letter-spacing: -1px;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.metric .num small { font-size: 14px; color: var(--faint); font-weight: 500; margin-left: 2px; }
.metric .lb { font-size: 11.5px; color: var(--sub); letter-spacing: .4px; }
.metric.due .num { color: var(--amber); }

.bar {
  height: 6px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  overflow: hidden;
  margin-bottom: 16px;
}
.bar i {
  display: block; height: 100%;
  border-radius: 999px;
  background: var(--brand-grad);
  transition: width .6s var(--spring);
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 48px; padding: 0 20px;
  border-radius: 14px;
  font-size: 15px; font-weight: 620;
  letter-spacing: .2px;
  transition: transform .16s var(--spring), box-shadow .2s, background .2s;
}
.btn-primary {
  width: 100%;
  color: #fff;
  background: var(--brand-grad);
  box-shadow: var(--shadow-brand);
}
.btn-primary:hover { transform: translateY(-1.5px); box-shadow: 0 16px 26px -14px rgba(76, 95, 213, .8); }
.btn-primary:active { transform: scale(.985); }
.btn-primary.ghost { background: var(--surface); color: var(--brand); border: 1px solid var(--rule); box-shadow: none; }
.btn-primary[disabled] { opacity: .45; box-shadow: none; cursor: default; transform: none; }

.btn-row { display: flex; gap: 10px; }
.btn-row .btn { flex: 1; }

/* ---------- 曲线 ---------- */
.curve-card { padding: 16px 16px 10px; }
.curve-legend { display: flex; gap: 14px; margin-top: 4px; font-size: 11.5px; color: var(--sub); }
.curve-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
.curve-legend .grow { margin-left: auto; font-variant-numeric: tabular-nums; }
.curve-cap { margin-top: 7px; font-size: 11.5px; line-height: 1.55; color: var(--faint); font-variant-numeric: tabular-nums; }
.curve-cap b { color: var(--sub); font-weight: 600; }
.seg-mini.sm { padding: 2px; border-radius: 9px; }
.seg-mini.sm button { height: 24px; min-width: 30px; padding: 0 9px; font-size: 11.5px; }
.curve-none { padding: 22px 0; text-align: center; font-size: 12.5px; color: var(--faint); }

/* 随手记：课间/碎片时间，自己选几个词 */
.quick-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
.quick-head b { font-size: 13.5px; color: var(--ink); }
.quick-head span { font-size: 11.5px; color: var(--faint); }
.quick-chips { display: flex; gap: 8px; }
.quick-chips button {
  flex: 1; min-width: 0; padding: 10px 4px 9px; border-radius: 13px;
  background: var(--surface-2); border: 1px solid var(--line);
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  transition: transform .12s var(--spring), background .15s;
}
.quick-chips button:active { transform: scale(.97); }
.quick-chips button b { font-family: var(--serif); font-size: 16px; font-weight: 600; color: var(--brand); line-height: 1.1; }
.quick-chips button small { font-size: 10.5px; color: var(--faint); font-weight: 500; }

/* 今日任务：临时改本次数量（只影响这一次，不动每日目标） */
.count-row { display: flex; align-items: center; gap: 7px; margin-top: 11px; }
.count-row > span { font-size: 11.5px; color: var(--faint); margin-right: 1px; }
.count-chip {
  flex: 1; min-width: 0; height: 30px; border-radius: 9px;
  background: var(--surface-2); border: 1px solid var(--line);
  font-size: 12px; font-weight: 600; color: var(--sub);
  transition: transform .12s var(--spring), color .15s, border-color .15s;
}
.count-chip:hover { color: var(--brand); border-color: var(--brand); }
.count-chip:active { transform: scale(.95); }

/* 还没背过词：不画空图，给一句鼓励 + 三个小台阶 */
.curve-empty { padding: 18px 16px 16px; }
.curve-empty .ce-top { display: flex; align-items: center; gap: 11px; margin-bottom: 14px; }
.curve-empty .ce-emoji {
  width: 40px; height: 40px; border-radius: 13px; flex: none;
  background: var(--brand-soft); display: grid; place-items: center; font-size: 20px;
}
.curve-empty .ce-t { font-size: 15px; font-weight: 650; color: var(--ink); letter-spacing: .2px; }
.curve-empty .ce-s { font-size: 12px; color: var(--sub); line-height: 1.6; margin-top: 2px; }
.curve-empty .ce-steps { display: flex; gap: 8px; margin-bottom: 14px; }
.curve-empty .ce-step {
  flex: 1 1 0; min-width: 0;
  background: var(--surface-2); border-radius: 11px; padding: 9px 6px; text-align: center;
}
.curve-empty .ce-step b { display: block; font-size: 11.5px; color: var(--brand); font-weight: 650; }
.curve-empty .ce-step span { display: block; font-size: 10.5px; color: var(--faint); margin-top: 1px; }

/* ---------- 词库进度 ---------- */
.lib-row {
  display: flex; align-items: center; gap: 12px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
}
.lib-row:last-child { border-bottom: 0; padding-bottom: 2px; }
.lib-row:first-child { padding-top: 2px; }
.lib-mark {
  width: 38px; height: 38px; border-radius: 11px;
  display: grid; place-items: center;
  font-family: var(--serif); font-size: 13px; font-weight: 700;
  background: var(--brand-soft); color: var(--brand);
  flex: none;
}
.lib-mark.t { background: var(--green-soft); color: var(--green); }
.lib-mark.s { background: var(--amber-soft); color: #B2700F; }
.lib-mark.i { background: #E9F0FB; color: #3358A8; }
:root[data-theme="dark"] .lib-mark.i { background: #1E2A44; color: #8FB0F0; }
.lib-info { flex: 1; min-width: 0; }
.lib-info .n { font-size: 13.5px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
.lib-info .n small { font-weight: 500; color: var(--faint); font-size: 11.5px; }
.lib-info .p { height: 4px; border-radius: 999px; background: var(--surface-2); margin-top: 7px; overflow: hidden; }
.lib-info .p i { display: block; height: 100%; border-radius: 999px; background: var(--brand); opacity: .8; }
.lib-pct { font-size: 12px; color: var(--sub); font-variant-numeric: tabular-nums; }

/* ---------- 学习卡 ---------- */
.study-wrap { padding-top: 12px; }
.study-top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.study-top .exit {
  width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
  color: var(--sub); background: var(--surface); border: 1px solid var(--line); flex: none;
}
.study-progress { flex: 1; height: 6px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.study-progress i { display: block; height: 100%; background: var(--brand-grad); border-radius: 999px; transition: width .35s var(--spring); }
.study-count { font-size: 12.5px; color: var(--sub); font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; }

.flash {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 24px;
  box-shadow: var(--shadow-2);
  padding: 30px 22px 24px;
  min-height: 420px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  transition: border-color .2s;
}
.flash.flipped { border-color: var(--brand-soft); }

.flash-tag { position: absolute; top: 14px; left: 16px; right: 14px; display: flex; gap: 6px; align-items: center; }

.star {
  margin-left: auto; width: 28px; height: 24px; flex: none;
  display: grid; place-items: center; border-radius: 8px;
  font-size: 16px; line-height: 1; color: var(--faint);
  transition: color .15s, transform .12s var(--spring);
}
.star.on { color: var(--amber); }
.star:active { transform: scale(.88); }

/* 生词本 / 错题本 */
.nb-tabs { display: flex; gap: 8px; margin: 2px 0 12px; }
.nb-tab {
  flex: 1; height: 38px; border-radius: 11px; display: flex;
  align-items: center; justify-content: center; gap: 6px;
  background: var(--surface-2); border: 1px solid var(--line);
  font-size: 13px; font-weight: 600; color: var(--sub);
}
.nb-tab.on { background: var(--surface); color: var(--brand); border-color: var(--brand); box-shadow: var(--shadow-1); }
.nb-tab i { font-style: normal; font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--brand-soft); color: var(--brand); }
.nb-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.nb-row:last-child { border-bottom: 0; }
.nb-w { font-family: var(--serif); font-size: 16px; flex: none; max-width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nb-w em { font-style: normal; font-family: var(--ui); font-size: 10px; color: var(--red); margin-left: 5px; }
.nb-d { flex: 1; min-width: 0; font-size: 11.5px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nb-x { flex: none; width: 26px; height: 26px; border-radius: 8px; color: var(--faint); font-size: 16px; line-height: 1; }
.nb-x:active { background: var(--red-soft); color: var(--red); }

.word {
  font-family: var(--serif);
  font-size: 42px;
  line-height: 1.15;
  font-weight: 600;
  letter-spacing: -.8px;
  margin: 26px 0 2px;
  word-break: break-word;
  animation: bounce-in .5s var(--spring);
}
@keyframes bounce-in {
  0% { opacity: 0; transform: translateY(14px) scale(.96); }
  60% { opacity: 1; }
  100% { opacity: 1; transform: none; }
}
.word.hide { filter: blur(9px); opacity: .28; user-select: none; }

.ipa {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  font-family: var(--mono);
  font-size: 14px;
  color: var(--sub);
  margin-bottom: 4px;
  flex-wrap: wrap;
}
.ipa .slash { color: var(--faint); }

.spk {
  width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--surface-2); border: 1px solid var(--line);
  color: var(--brand); flex: none;
  transition: transform .18s var(--spring), background .18s, color .18s;
}
.spk:hover { background: var(--brand-soft); }
.spk:active { transform: scale(.9); }
.spk.playing { background: var(--brand); color: #fff; border-color: transparent; animation: pulse .6s ease; }
@keyframes pulse { 50% { transform: scale(1.12); } }
.spk small { font-size: 9.5px; font-weight: 700; letter-spacing: .3px; }

.flash-body { width: 100%; margin-top: auto; }
.reveal-btn {
  margin: 26px auto 4px;
  height: 42px; padding: 0 20px;
  border-radius: 12px;
  border: 1px dashed var(--rule);
  color: var(--sub); font-size: 13.5px; font-weight: 600;
  background: var(--surface-2);
}
.reveal-btn:active { transform: scale(.97); }

.defs { text-align: left; margin: 20px 0 0; }
.defs .d {
  display: flex; gap: 8px;
  font-size: 15.5px; line-height: 1.62;
  color: var(--ink);
  padding: 3px 0;
}
.defs .d .pos {
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--brand);
  background: var(--brand-soft);
  border-radius: 6px;
  padding: 1px 5px;
  height: 19px;
  line-height: 17px;
  flex: none;
  margin-top: 3px;
}
.defs .d span { flex: 1; }

.en-def {
  text-align: left;
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--sub);
  border-left: 2px solid var(--rule);
  padding-left: 10px;
  margin: 12px 0 0;
}

.example {
  text-align: left;
  margin-top: 16px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
}
.example .en {
  font-family: var(--serif);
  font-size: 14.5px;
  line-height: 1.62;
  color: var(--ink-2);
}
.example .en b { color: var(--brand); font-weight: 600; background: var(--brand-soft); border-radius: 4px; padding: 0 2px; }
.example .cn { font-size: 12.5px; color: var(--sub); margin-top: 5px; }
.example .src { font-size: 10.5px; color: var(--faint); margin-top: 8px; letter-spacing: .3px; display: flex; align-items: center; gap: 5px; }

.rate { display: flex; gap: 10px; margin-top: 14px; }
.rate button {
  flex: 1;
  height: 54px;
  border-radius: 16px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-size: 14px;
  font-weight: 620;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  box-shadow: var(--shadow-1);
  transition: transform .16s var(--spring), border-color .2s, background .2s;
}
.rate button small { font-size: 10.5px; font-weight: 500; color: var(--faint); letter-spacing: .2px; }
.rate button:active { transform: scale(.96); }
.rate .again { color: var(--red); border-color: rgba(216, 69, 60, .22); background: linear-gradient(180deg, #fff, var(--red-soft)); }
.rate .hard { color: #B2700F; border-color: rgba(239, 154, 33, .25); background: linear-gradient(180deg, #fff, var(--amber-soft)); }
.rate .good { color: var(--green); border-color: rgba(30, 156, 99, .22); background: linear-gradient(180deg, #fff, var(--green-soft)); }
:root[data-theme="dark"] .rate .again,
:root[data-theme="dark"] .rate .hard,
:root[data-theme="dark"] .rate .good { background: var(--surface); }

.kbd-hint { text-align: center; font-size: 11.5px; color: var(--faint); margin-top: 12px; letter-spacing: .3px; }
.kbd-hint kbd {
  font-family: var(--mono); font-size: 10.5px;
  background: var(--surface); border: 1px solid var(--rule);
  border-bottom-width: 2px; border-radius: 5px;
  padding: 1px 5px; margin: 0 1px; color: var(--sub);
}

/* 听写模式 */
.spell-box { width: 100%; margin-top: 22px; }
.spell-input {
  width: 100%;
  height: 54px;
  border-radius: 14px;
  border: 1.5px solid var(--rule);
  background: var(--surface-2);
  text-align: center;
  font-family: var(--serif);
  font-size: 24px;
  letter-spacing: 1px;
  outline: none;
  transition: border-color .2s, background .2s;
}
.spell-input:focus { border-color: var(--brand); background: var(--surface); }
.spell-input.ok { border-color: var(--green); color: var(--green); background: var(--green-soft); }
.spell-input.bad { border-color: var(--red); color: var(--red); background: var(--red-soft); }
.spell-tip { font-size: 12px; color: var(--faint); margin-top: 9px; }

/* ---------- 已完成 ---------- */
.done-card { text-align: center; padding: 40px 22px 30px; }
.done-emoji { font-size: 40px; line-height: 1; margin-bottom: 14px; animation: bounce-in .6s var(--spring); }
.done-card h2 { font-family: var(--serif); font-size: 24px; margin: 0 0 6px; letter-spacing: -.4px; }
.done-card p { color: var(--sub); font-size: 13.5px; margin: 0 0 22px; }
.done-stats { display: flex; justify-content: center; gap: 30px; margin-bottom: 26px; }
.done-stats .num { font-family: var(--serif); font-size: 26px; font-weight: 600; }
.done-stats .lb { font-size: 11.5px; color: var(--faint); }

/* ---------- 底部导航 ---------- */
.tabbar[hidden] { display: none; }
.tabbar {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 0;
  width: 100%;
  max-width: var(--app-w);
  height: var(--tabbar-h);
  padding: 0 14px env(safe-area-inset-bottom);
  display: flex;
  align-items: center;
  justify-content: space-around;
  background: color-mix(in srgb, var(--surface) 86%, transparent);
  backdrop-filter: saturate(180%) blur(16px);
  -webkit-backdrop-filter: saturate(180%) blur(16px);
  border-top: 1px solid var(--line);
  z-index: 30;
}
.tab {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--faint);
  font-size: 10.5px;
  letter-spacing: .3px;
  padding: 6px 0;
  transition: color .18s;
}
.tab svg { width: 22px; height: 22px; }
.tab.on { color: var(--brand); }
.tab.on svg { transform: translateY(-1px); }
.tab svg { transition: transform .2s var(--spring); }

/* ---------- 词库浏览 ---------- */
.search {
  display: flex; align-items: center; gap: 9px;
  height: 44px; padding: 0 13px;
  border-radius: 13px;
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-1);
  margin-bottom: 12px;
}
.search input { flex: 1; border: 0; outline: none; background: none; font-size: 14px; }
.search input::placeholder { color: var(--faint); }

.segs {
  display: flex; gap: 4px; padding: 4px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-bottom: 14px;
}
.segs button {
  flex: 1; height: 32px; border-radius: 9px;
  font-size: 12.5px; font-weight: 600; color: var(--sub);
  transition: all .18s;
}
.segs button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }

.wlist { display: flex; flex-direction: column; }
.witem {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 13px;
  margin-bottom: 8px;
  text-align: left;
  transition: border-color .18s, transform .18s var(--spring);
}
.witem:hover { border-color: var(--rule); transform: translateY(-1px); }
.witem .w-main { flex: 1; min-width: 0; }
.witem .w-word { display: block; font-family: var(--serif); font-size: 16px; font-weight: 600; letter-spacing: -.2px; }
.witem .w-ipa { font-family: var(--mono); font-size: 11.5px; color: var(--faint); margin-left: 6px; }
.witem .w-cn { display: block; font-size: 12.5px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.dot.s0 { background: var(--line); box-shadow: inset 0 0 0 1px var(--rule); }
.dot.s1 { background: var(--amber); }
.dot.s2 { background: var(--brand); }
.dot.s3 { background: var(--green); }

.empty { text-align: center; color: var(--faint); font-size: 13px; padding: 40px 0; }

/* ---------- 统计 ---------- */
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
.stat-box {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 15px;
  padding: 14px 12px;
  box-shadow: var(--shadow-1);
}
.stat-box .num { font-family: var(--serif); font-size: 24px; font-weight: 600; letter-spacing: -.6px; line-height: 1.2; }
.stat-box .lb { font-size: 11px; color: var(--sub); margin-top: 2px; }

.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; overflow-x: auto; padding-bottom: 4px; }
.heat i { width: 12px; height: 12px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); }
.heat i.l1 { background: color-mix(in srgb, var(--brand) 24%, var(--surface)); border-color: transparent; }
.heat i.l2 { background: color-mix(in srgb, var(--brand) 45%, var(--surface)); border-color: transparent; }
.heat i.l3 { background: color-mix(in srgb, var(--brand) 70%, var(--surface)); border-color: transparent; }
.heat i.l4 { background: var(--brand); border-color: transparent; }

/* ---------- 设置 ---------- */
.row {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}
.row:last-child { border-bottom: 0; }
.row .r-lb { font-size: 14px; font-weight: 550; }
.row .r-sub { font-size: 11.5px; color: var(--faint); margin-top: 1px; }
.row select, .row input[type="date"] {
  height: 36px; padding: 0 10px;
  border-radius: 10px;
  border: 1px solid var(--rule);
  background: var(--surface-2);
  font-size: 13px; font-weight: 600;
  color: var(--ink);
  outline: none;
}
.seg-mini { display: flex; gap: 4px; padding: 3px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; }
.seg-mini button { height: 28px; min-width: 34px; padding: 0 9px; border-radius: 7px; font-size: 12px; font-weight: 600; color: var(--sub); }
.seg-mini button.on { background: var(--surface); color: var(--brand); box-shadow: var(--shadow-1); }

.switch {
  width: 44px; height: 26px; border-radius: 999px;
  background: var(--rule); position: relative;
  transition: background .2s;
  flex: none;
}
.switch i {
  position: absolute; top: 3px; left: 3px;
  width: 20px; height: 20px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .2);
  transition: transform .22s var(--spring);
}
.switch.on { background: var(--brand); }
.switch.on i { transform: translateX(18px); }

/* ---------- 单词详情浮层 ---------- */
.sheet-mask {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(20, 26, 36, .42);
  backdrop-filter: blur(3px);
  display: flex; align-items: flex-end; justify-content: center;
  animation: fade .2s ease;
}
@keyframes fade { from { opacity: 0; } }
.sheet {
  width: 100%; max-width: var(--app-w);
  background: var(--surface);
  border-radius: 24px 24px 0 0;
  padding: 10px 20px calc(24px + env(safe-area-inset-bottom));
  max-height: 86vh; overflow-y: auto;
  animation: rise .32s var(--spring);
  box-shadow: 0 -12px 40px -20px rgba(20, 26, 36, .5);
}
@keyframes rise { from { transform: translateY(100%); } }
.sheet .grab { width: 38px; height: 4px; border-radius: 99px; background: var(--rule); margin: 0 auto 14px; }
.sheet h3 { font-family: var(--serif); font-size: 30px; margin: 0 0 4px; letter-spacing: -.6px; }

.toast {
  position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + 20px);
  transform: translateX(-50%) translateY(10px);
  background: rgba(31, 37, 48, .92);
  color: #fff; font-size: 12.5px;
  padding: 9px 16px; border-radius: 999px;
  z-index: 90; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .25s var(--spring);
  white-space: nowrap;
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

@media (max-width: 400px) {
  .word { font-size: 36px; }
  .flash { padding: 24px 16px 18px; min-height: 380px; }
  .app { padding: 0 14px calc(var(--tabbar-h) + 22px); }
  .task-metrics { gap: 18px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ================= 词书 / List ================= */
.booktabs { display: flex; gap: 6px; margin-bottom: 10px; }
.booktabs button {
  flex: 1;
  padding: 9px 6px 8px;
  border-radius: 13px;
  background: var(--surface);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-1);
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  transition: all .18s var(--spring);
}
.booktabs button b { font-size: 12.5px; font-weight: 650; letter-spacing: .1px; }
.booktabs button small { font-size: 10px; color: var(--faint); }
.booktabs button.on {
  background: var(--brand-grad);
  border-color: transparent;
  box-shadow: var(--shadow-brand);
}
.booktabs button.on b { color: #fff; }
.booktabs button.on small { color: rgba(255, 255, 255, .72); }

.book-sub { font-size: 11.5px; color: var(--faint); margin: 0 2px 12px; }

.chips { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 12px; }
.chips button {
  flex: none;
  height: 30px; padding: 0 13px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
  font-size: 12.5px; font-weight: 600; color: var(--sub);
  transition: all .18s;
}
.chips button.on { background: var(--brand); border-color: transparent; color: #fff; box-shadow: var(--shadow-brand); }

.lgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lcard {
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 13px 13px 11px;
  box-shadow: var(--shadow-1);
  transition: transform .18s var(--spring), border-color .18s;
  min-height: 108px;
  display: flex; flex-direction: column;
}
.lcard:hover { transform: translateY(-2px); border-color: var(--rule); }
.lcard:active { transform: scale(.985); }
.lc-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 5px; }
.lc-name { font-size: 13px; font-weight: 650; line-height: 1.3; }
.lc-due {
  flex: none; font-size: 9.5px; font-weight: 700;
  color: #B2700F; background: var(--amber-soft);
  border-radius: 999px; padding: 2px 6px; margin-top: 1px;
}
:root[data-theme="dark"] .lc-due { color: var(--amber); }
.lc-count { font-size: 10.5px; color: var(--faint); margin-top: 5px; }
.lc-bar { height: 4px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; margin: auto 0 7px; }
.lc-bar i { display: block; height: 100%; background: var(--brand-grad); border-radius: 999px; }
.lc-foot { display: flex; align-items: center; justify-content: space-between; font-size: 10px; color: var(--faint); }
.lc-go { color: var(--brand); font-weight: 650; font-size: 11px; }

/* 继续上次 */
.link-card { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.link-card:hover { border-color: var(--rule); }
.lc-mark {
  width: 40px; height: 40px; border-radius: 12px; flex: none;
  display: grid; place-items: center;
  background: var(--brand-soft); color: var(--brand);
  font-size: 11px; font-weight: 700; font-family: var(--serif);
}
.lc-body { flex: 1; min-width: 0; }
.lc-t { font-size: 13.5px; font-weight: 650; }
.lc-s { font-size: 11px; color: var(--faint); margin-top: 1px; }

/* 复习安排 */
.rev-row { display: flex; align-items: center; gap: 16px; }
.rev-n { font-family: var(--serif); font-size: 22px; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; }
.rev-l { font-size: 10.5px; color: var(--faint); }
.rev-hint { font-size: 11px; color: var(--faint); margin-top: 11px; line-height: 1.6; border-top: 1px dashed var(--line); padding-top: 9px; }
.rev-hint b { color: var(--ink-2); }

/* 选词弹窗 */
.opt-group { margin: 16px 0 0; }
.opt-lb { font-size: 12.5px; font-weight: 650; margin-bottom: 8px; display: flex; align-items: baseline; justify-content: space-between; }
.opt-lb span { font-size: 11px; color: var(--faint); font-weight: 500; }
.opt-row { display: flex; gap: 7px; }
.opt {
  flex: 1; height: 40px;
  border-radius: 11px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  font-size: 13px; font-weight: 600; color: var(--sub);
  transition: all .16s;
}
.opt.wide { flex: 1; font-size: 12.5px; }
.opt.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand); }
.row-inline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sheet-note { text-align: center; font-size: 11px; color: var(--faint); margin-top: 12px; }
.sheet-sub { font-size: 12px; color: var(--faint); margin-top: 2px; }
.sheet-sec { font-size: 11.5px; font-weight: 700; color: var(--faint); letter-spacing: .4px; margin: 18px 0 8px; }

/* ================= 来源 / 词根 ================= */
.peek { display: flex; gap: 7px; margin-top: 10px; }
.peek-btn {
  display: inline-flex; align-items: center; gap: 5px;
  height: 27px; padding: 0 10px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  font-size: 11.5px; font-weight: 600; color: var(--sub);
  transition: all .16s;
}
.peek-btn:hover { color: var(--brand); border-color: var(--rule); }
.peek-btn.on { background: var(--brand-soft); border-color: transparent; color: var(--brand); }

/* 抽查答完后：释义 + 由来/词根 */
.qz-fb { margin-top: 14px; }
.qz-fb-def { font-size: 13px; line-height: 1.75; color: var(--ink-2); margin-bottom: 9px; }
.qz-fb .peek { margin: 0 0 8px; }
.qz-fb-ex { font-size: 12px; line-height: 1.7; color: var(--sub); margin: -2px 0 10px; }
.qz-fb-ex i { display: block; font-style: normal; color: var(--faint); font-size: 11.5px; }

/* 离线发音选择 */
.ap-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.ap-row:last-child { border-bottom: 0; }
.ap-t { flex: 1; min-width: 0; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ap-n { flex: none; font-size: 11px; color: var(--faint); }
/* 补释义 */
.fill-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.fill-w { font-family: var(--serif); font-size: 15px; width: 40%; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fill-i { flex: 1; }
/* 反馈 */
.fb-type { display: flex; gap: 7px; margin: 12px 0; }
.fb-type button {
  flex: 1; height: 34px; border-radius: 10px;
  background: var(--surface-2); border: 1px solid var(--line);
  font-size: 12.5px; font-weight: 600; color: var(--sub);
}
.fb-type button.on { background: var(--brand-soft); border-color: transparent; color: var(--brand); }
.fb-input {
  width: 100%; min-height: 96px; resize: vertical;
  padding: 11px 12px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface-2);
  color: var(--ink); font-size: 13px; line-height: 1.7;
}
.fb-input:focus { outline: none; border-color: var(--brand); }
.fb-out { min-height: 150px; font-family: var(--mono); font-size: 11px; line-height: 1.6; }
.fb-meta { font-size: 11px; color: var(--faint); line-height: 1.7; margin-top: 9px; }
.fb-entry { text-align: center; margin: 16px 0 0; }
.fb-entry button { font-size: 12px; color: var(--faint); text-decoration: underline; text-underline-offset: 3px; }

.panel {
  width: 100%;
  margin-top: 12px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 13px;
  text-align: left;
  animation: drop .24s var(--spring);
}
@keyframes drop { from { opacity: 0; transform: translateY(-6px); } }
.panel-h {
  font-size: 11px; font-weight: 700; color: var(--sub);
  letter-spacing: .3px; margin-bottom: 9px;
  display: flex; align-items: center; gap: 6px;
}
.panel-warn { font-weight: 500; color: var(--faint); }
.panel-note { font-size: 11px; color: var(--faint); margin-top: 8px; line-height: 1.6; }

.src-list { display: flex; flex-direction: column; gap: 6px; }
.src-item {
  display: flex; align-items: center; gap: 8px;
  width: 100%; text-align: left;
  padding: 7px 9px;
  border-radius: 9px;
  background: var(--surface);
  border: 1px solid var(--line);
  font-size: 11.5px;
  transition: all .16s;
}
.src-item.on { border-color: var(--brand); background: var(--brand-soft); }
.src-item.static { cursor: default; }
.src-book { flex: none; font-weight: 650; color: var(--ink-2); }
.src-list { font-size: 11px; color: var(--sub); }
.src-item .src-list { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.src-cur { flex: none; font-size: 10px; font-weight: 700; color: var(--brand); }
.src-go { flex: none; font-size: 10px; color: var(--faint); }

.rt-row { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
.rt {
  display: inline-flex; align-items: baseline; gap: 3px;
  padding: 4px 8px;
  border-radius: 8px;
  background: var(--surface);
  border: 1px solid var(--line);
  font-family: var(--mono);
  font-size: 12px; font-weight: 600;
  color: var(--ink-2);
}
.rt i { font-family: var(--ui); font-style: normal; font-size: 10px; color: var(--sub); font-weight: 500; }
.rt.pre { border-color: rgba(76, 95, 213, .35); color: var(--brand); }
.rt.root { border-color: rgba(30, 156, 99, .35); color: var(--green); }
.rt.suf { border-color: rgba(239, 154, 33, .4); color: #B2700F; }
:root[data-theme="dark"] .rt.suf { color: var(--amber); }
.rt.rest { border-style: dashed; color: var(--faint); }
.rt-plus { color: var(--faint); font-size: 11px; }

.mem {
  margin-top: 9px;
  font-size: 11.5px; line-height: 1.65; color: var(--ink-2);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 8px 10px;
}
.mem b {
  display: block; font-size: 10px; color: var(--brand);
  letter-spacing: .4px; margin-bottom: 2px;
}
.chips-inline { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.tagchip {
  display: inline-flex; align-items: baseline; gap: 5px;
  font-size: 11.5px; color: var(--ink-2);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 4px 8px;
  line-height: 1.5;
}
.tagchip i { font-style: normal; font-size: 9.5px; font-weight: 700; color: var(--faint); letter-spacing: .3px; }

/* 学习页小面包屑 */
.study-crumb {
  font-size: 10.5px; color: var(--faint);
  margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

/* 热力图小格 */
.hcell { width: 12px; height: 12px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); display: block; }
.hcell.l1 { background: color-mix(in srgb, var(--brand) 24%, var(--surface)); border-color: transparent; }
.hcell.l2 { background: color-mix(in srgb, var(--brand) 45%, var(--surface)); border-color: transparent; }
.hcell.l3 { background: color-mix(in srgb, var(--brand) 70%, var(--surface)); border-color: transparent; }
.hcell.l4 { background: var(--brand); border-color: transparent; }

/* note 用词书卡片小徽标 */
.lc-mark.t { background: var(--green-soft); color: var(--green); }

/* ================= 账号 / 同步 / 设置增强 ================= */
:root { --card-scale: 1; }

.exam-card { display: flex; align-items: center; gap: 14px; }
.exam-n { display: flex; flex-direction: column; align-items: center; flex: none; min-width: 54px; }
.exam-n b { font-family: var(--serif); font-size: 26px; line-height: 1; color: var(--brand); font-variant-numeric: tabular-nums; }
.exam-n span { font-size: 10px; color: var(--faint); margin-top: 3px; }
.exam-info { flex: 1; min-width: 0; }
.exam-lb { font-size: 12.5px; font-weight: 650; }
.exam-sub { font-size: 11px; color: var(--faint); margin-top: 2px; line-height: 1.5; }

.resume-card { display: flex; align-items: center; gap: 12px; cursor: pointer; border-color: var(--brand-soft); }
.resume-card:hover { border-color: var(--brand); }
.resume-ic {
  width: 34px; height: 34px; border-radius: 11px; flex: none;
  display: grid; place-items: center;
  background: var(--brand-grad); color: #fff; font-size: 11px;
  box-shadow: var(--shadow-brand);
}
.resume-go { font-size: 11.5px; font-weight: 650; color: var(--brand); flex: none; }

.task-note { font-size: 10.5px; color: var(--faint); text-align: center; margin-top: 9px; line-height: 1.5; }
.metric .lb em { font-style: normal; color: var(--faint); font-size: 9.5px; }

/* 账号条 */
.acct-strip { display: flex; align-items: center; gap: 11px; cursor: pointer; }
.acct-strip:hover { border-color: var(--brand); }
.acct-av {
  width: 38px; height: 38px; border-radius: 12px; flex: none;
  display: grid; place-items: center;
  background: var(--surface-2); color: var(--faint);
  border: 1px solid var(--line);
  font-size: 13px; font-weight: 700; font-family: var(--serif);
}
.acct-av.on { background: var(--brand-grad); color: #fff; border-color: transparent; box-shadow: var(--shadow-brand); }
.acct-av.big { width: 52px; height: 52px; border-radius: 16px; font-size: 18px; }

.acct-card { padding: 18px 18px 16px; }
.acct-row { display: flex; align-items: center; gap: 13px; }
.acct-name { font-size: 16.5px; font-weight: 680; letter-spacing: -.2px; }
.acct-sub { font-size: 11.5px; color: var(--faint); margin-top: 3px; line-height: 1.5; word-break: break-all; }
.acct-btns { display: flex; gap: 9px; margin-top: 14px; }
.acct-btns .btn { flex: 1; }
.acct-hint { font-size: 10.5px; color: var(--faint); text-align: center; margin-top: 11px; line-height: 1.6; }

/* 分享 / 转发 */
.share-card { margin-top: 10px; padding: 16px 16px 14px; }
.share-h { font-size: 13.5px; font-weight: 700; color: var(--ink); margin-bottom: 9px; }
.share-url {
  font-family: var(--mono); font-size: 11px; line-height: 1.6; color: var(--sub);
  background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm);
  padding: 9px 10px; word-break: break-all;
  -webkit-user-select: text; user-select: text;
}

.sync-line {
  display: flex; align-items: center; gap: 7px;
  font-size: 11.5px; color: var(--sub);
  margin-top: 13px; padding-top: 11px;
  border-top: 1px dashed var(--line);
}
.dot-sync { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--faint); }
.dot-sync.ok { background: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
.dot-sync.busy { background: var(--amber); animation: pulse 1.1s infinite; }
.dot-sync.err { background: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
@keyframes pulse { 50% { opacity: .35; } }

.mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 8px; }
.mini-grid > div { text-align: center; }
.mini-grid b { display: block; font-family: var(--serif); font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }
.mini-grid span { font-size: 10px; color: var(--faint); }

.rec-h { font-size: 11px; font-weight: 700; color: var(--faint); letter-spacing: .3px; margin-bottom: 8px; }
.rec-row {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 0; border-bottom: 1px solid var(--line);
  font-size: 11.5px;
}
.rec-row:last-child { border-bottom: 0; }
.rec-d { color: var(--faint); font-variant-numeric: tabular-nums; flex: none; width: 92px; }
.rec-n { flex: 1; color: var(--sub); }
.rec-a { color: var(--brand); font-weight: 650; font-variant-numeric: tabular-nums; }

/* 设置项补充 */
.row.col { flex-direction: column; align-items: stretch; gap: 0; }
.row.col .r-lb { margin-bottom: 2px; }
.row:last-child { border-bottom: 0; }
.date-row { display: flex; gap: 9px; align-items: center; }
.date-input {
  flex: 1; height: 40px; padding: 0 12px;
  border-radius: 11px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink);
  font-size: 13px;
  font-family: var(--ui);
  -webkit-appearance: none; appearance: none;
}
.date-input:focus { outline: none; border-color: var(--brand); background: var(--surface); }
.set-note { font-size: 11px; color: var(--faint); line-height: 1.6; margin-top: 9px; }
.set-note b { color: var(--brand); }
.set-note.warn { color: var(--red); }

/* 登录浮层 */
.login-sheet { padding-bottom: 26px; }
.login-brand { display: flex; align-items: baseline; gap: 8px; }
.login-brand b { font-family: var(--serif); font-size: 22px; letter-spacing: -.6px; }
.login-brand span { font-size: 11.5px; color: var(--faint); }
.field { margin-top: 14px; }
.lg-input {
  width: 100%; height: 48px; padding: 0 14px;
  border-radius: 13px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink);
  font-size: 15px;
  font-family: var(--ui);
  transition: border-color .18s, background .18s;
}
.lg-input:focus { outline: none; border-color: var(--brand); background: var(--surface); }
.lg-input.code { letter-spacing: 4px; font-family: var(--mono); font-size: 17px; }
.lg-input[readonly] { color: var(--sub); }
.lg-err { font-size: 11.5px; color: var(--red); min-height: 17px; margin-top: 8px; line-height: 1.5; }
.link-btn {
  display: block; width: 100%; margin-top: 10px;
  background: none; border: 0;
  font-size: 12px; color: var(--brand); font-weight: 600;
  padding: 6px 0;
}
.link-btn[disabled] { color: var(--faint); }

/* 评分第四档 */
.rate button.easy { border-color: rgba(76, 95, 213, .3); }
.rate button.easy small { color: var(--brand); }
.rate button small { font-size: 10px; font-weight: 500; color: var(--faint); }

/* 卡片字号倍率 */
.flash .word { font-size: calc(38px * var(--card-scale)); }
.flash .defs .d { font-size: calc(14.5px * var(--card-scale)); }
.flash .example .en { font-size: calc(13.5px * var(--card-scale)); }
.flash .en-def { font-size: calc(12.5px * var(--card-scale)); }

/* tabbar 角标 */
.tab { position: relative; }
.tab-badge {
  position: absolute; top: 6px; left: 50%; margin-left: 6px;
  min-width: 15px; height: 15px; padding: 0 4px;
  border-radius: 999px;
  background: var(--red); color: #fff;
  font-size: 9px; font-weight: 700; font-style: normal;
  display: grid; place-items: center;
  line-height: 1;
}

/* 窄屏下设置行不溢出：左侧文字可收缩，分段控件换行 */
.row > div:first-child { flex: 1; min-width: 0; }
.row .seg-mini { flex: none; max-width: 64%; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 400px) {
  .row .seg-mini { max-width: 58%; }
  .seg-mini button { min-width: 30px; padding: 0 7px; font-size: 11.5px; }
  .rate { gap: 7px; }
  .rate button { font-size: 13px; }
}

/* ================= 精学抽查 / 复习四选一 ================= */
.qz-card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 20px 18px 18px; box-shadow: var(--shadow-1); margin-top: 12px;
}
.qz-tag {
  display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .4px;
  color: var(--brand); background: var(--brand-soft);
  padding: 3px 9px; border-radius: 999px;
}
.qz-prompt {
  margin-top: 13px; font-family: var(--serif); font-size: 30px; font-weight: 700;
  line-height: 1.24; letter-spacing: -.3px; color: var(--ink); word-break: break-word;
}
.qz-prompt.cn {
  font-family: var(--ui); font-size: 17px; font-weight: 600; line-height: 1.6;
  letter-spacing: 0; color: var(--ink);
}
.qz-sub {
  margin-top: 9px; display: flex; align-items: center; gap: 10px;
  font-size: 12.5px; color: var(--sub);
}
.qz-blank {
  margin-top: 12px; font-family: var(--mono); font-size: 19px;
  letter-spacing: 3px; color: var(--faint);
}
.qz-note { margin-top: 9px; font-size: 12px; line-height: 1.6; color: var(--sub); }
.qz-opts { display: flex; flex-direction: column; gap: 9px; margin-top: 13px; }
.qz-opt {
  display: flex; gap: 9px; align-items: flex-start; width: 100%;
  text-align: left; font-size: 13.5px; line-height: 1.5; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-md); padding: 12px 13px;
  box-shadow: var(--shadow-1); transition: border-color .14s, background .14s;
}
.qz-opt b { flex: none; font-size: 11.5px; font-weight: 700; color: var(--faint); margin-top: 2px; }
.qz-opt.ok { border-color: var(--green); background: var(--green-soft); color: var(--green); }
.qz-opt.ok b { color: var(--green); }
.qz-opt.bad { border-color: var(--red); background: var(--red-soft); color: var(--red); }
.qz-opt.bad b { color: var(--red); }
.qz-opt.dim { opacity: .42; }
.qz-sum { margin-top: 4px; }
.qz-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 9px 0; border-bottom: 1px solid var(--line);
}
.qz-row:last-child { border-bottom: 0; }
.qz-row .qw { font-size: 14px; font-weight: 650; color: var(--ink); }
.qz-row .qm { font-size: 11.5px; color: var(--faint); margin-top: 2px; }
.qz-err {
  flex: none; font-size: 11px; font-weight: 700; color: var(--red);
  background: var(--red-soft); border-radius: 999px; padding: 3px 9px;
}

/* ================= 「由来」面板 / 复习范围弹层 ================= */
.rt u {
  text-decoration: none; font-style: normal; font-size: 9px; line-height: 1.6;
  color: var(--brand); background: var(--brand-soft);

.tagchip.link { cursor: pointer; }
.opt em { font-style: normal; font-size: 10.5px; color: var(--faint); margin-left: 3px; }

      state.words = sanitizeWords(d.words);

      state.sessions = Array.isArray(d.sessions) ? d.sessions.slice(-200) : [];
      state.lastList = d.lastList || null;
      state.lastSession = d.lastSession || null;
      state.pending = sanitizePending(d.pending);
      state.rev = 0;
      state.syncedRev = typeof d.syncedRev === 'number' ? d.syncedRev : 0;
      state.lastSync = d.lastSync || 0;
      state.longLast = Number(d.longLast) || 0;
      state.weak = d.weak && typeof d.weak === 'object' && Array.isArray(d.weak.w)
        ? { d: String(d.weak.d || ''), w: d.weak.w.filter((x) => typeof x === 'string').slice(0, 300) }
        : null;
      state.v = V;
    } catch (e) { }
  }

  function sanitizeWords(src) {
    const out = {};
    if (!src || typeof src !== 'object') return out;
    Object.keys(src).forEach((w) => {
      const c = src[w];
      if (!c || typeof c !== 'object') return;
      const num = (v, dflt) => (typeof v === 'number' && isFinite(v) ? v : dflt);
      out[w] = {
        st: Math.max(0, Math.min(3, Math.round(num(c.st, 0)))),
        e: Math.min(3.2, Math.max(1.3, num(c.e, 2.5))),
        i: Math.min(180, Math.max(0, num(c.i, 0))),
        d: Math.max(0, num(c.d, 0)),
        r: Math.max(0, Math.round(num(c.r, 0))),
        l: Math.max(0, Math.round(num(c.l, 0))),
        seen: Math.max(0, Math.round(num(c.seen, 0))),
        s: c.s ? 1 : 0,                                  // 收藏进生词本
        x: Math.min(99, Math.max(0, Math.round(num(c.x, 0)))),  // 答错次数，错题本用
        u: Math.max(0, num(c.u, 0)),
      };
    });
    return out;
  }

  function sanitizeLogs(src) {
    const out = {};
    if (!src || typeof src !== 'object') return out;
    Object.keys(src).forEach((k) => {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
      const l = src[k] || {};
      const n = Math.max(0, Math.round(Number(l.n) || 0));
      const r = Math.max(0, Math.round(Number(l.r) || 0));
      if (!n && !r) return;
      out[k] = {
        n: n, r: r,
        ok: Math.max(0, Math.round(Number(l.ok) || 0)),
        bad: Math.max(0, Math.round(Number(l.bad) || 0)),
      };
    });
    return out;
  }

  function sanitizePending(p) {
    if (!p || typeof p !== 'object' || !Array.isArray(p.queue) || !p.queue.length) return null;
    const queue = p.queue.filter((w) => typeof w === 'string');
    if (!queue.length) return null;
    return {
      queue: queue,
      i: Math.max(0, Math.min(queue.length - 1, Math.round(Number(p.i) || 0))),
      book: typeof p.book === 'string' ? p.book : 'sat',
      gi: typeof p.gi === 'number' ? p.gi : -1,
      title: typeof p.title === 'string' ? p.title : '',
      kind: typeof p.kind === 'string' ? p.kind : 'list',
      mode: typeof p.mode === 'string' ? p.mode : 'read',
      stat: p.stat && typeof p.stat === 'object' ? p.stat : null,
      t: Number(p.t) || Date.now(),
    };
  }

  // 只保留真正学过的卡片，避免把整套词库的空状态写进本地与云端
  function slimWords() {
    const out = {};
    const src = state.words;
    for (const w in src) {
      const c = src[w];
      if (c && (c.st > 0 || c.seen > 0 || c.s || c.x)) out[w] = c;
    }
    return out;
  }

  function payload() {
    return {
      v: V,
      settings: state.settings,
      words: slimWords(),
      logs: state.logs,
      sessions: state.sessions.slice(-200),
      lastList: state.lastList,
      lastSession: state.lastSession,
      pending: state.pending,
      rev: state.rev,
      syncedRev: state.syncedRev,
      lastSync: state.lastSync,
      longLast: state.longLast,
      weak: state.weak,
    };
  }

  let saveTimer = null;
  let storageWarned = false;

  // 到期队列的短期缓存，任何一次写入都要让它失效
  let dueAllCache = { t: 0, v: [] };

  function touch() {
    state.rev += 1;
    dueAllCache = { t: 0, v: [] };
  }

  function save() {
    if (saveTimer) return;
    saveTimer = setTimeout(() => { saveTimer = null; saveNow(); }, 350);
  }

  function saveNow() {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    try {
      localStorage.setItem(KEY, JSON.stringify(payload()));
      // 每天第一次保存时留一份快照：没有云，这就是唯一的安全网
      if (lastSnapDay !== dayKey()) {
        lastSnapDay = dayKey();
        makeSnapshot('auto');
      }
    } catch (e) {
      if (!storageWarned) {
        storageWarned = true;
        if (typeof window.__bbbStorageError === 'function') window.__bbbStorageError(e);
      }
    }
  }

  /* ---------- 本地快照 ---------- */
  const SNAP_KEY = 'bbb:snaps';
  const SNAP_KEEP = 4;
  let lastSnapDay = '';

  function readSnaps() {
    try {
      const raw = localStorage.getItem(SNAP_KEY);
      const d = raw ? JSON.parse(raw) : null;
      return d && Array.isArray(d.list) ? d : { v: 1, list: [] };
    } catch (e) { return { v: 1, list: [] }; }
  }

  function snapPayload(reason) {
    return {
      t: Date.now(),
      reason: reason || 'auto',
      n: Object.keys(state.words).length,
      data: {
        settings: state.settings,
        words: encode(slimWords()),
        logs: state.logs,
        sessions: state.sessions.slice(-40),
        lastList: state.lastList,
        lastSession: state.lastSession,
      },
    };
  }

  function writeSnaps(box) {
    try { localStorage.setItem(SNAP_KEY, JSON.stringify(box)); return true; }
    catch (e) { return false; }
  }

  // 存一份快照；同一天只留一份「自动」，手动/危险操作各留一份
  function makeSnapshot(reason) {
    const day = dayKey();
    const box = readSnaps();
    const list = box.list.slice();
    const hasAutoToday = list.some((x) => (x.reason === 'auto' || !x.reason) && dayKey(x.t) === day);
    // 空进度不值得占一份快照
    if (reason === 'auto' && !Object.keys(state.words).length) return list.length;
    if (!(reason === 'auto' && hasAutoToday)) list.push(snapPayload(reason));
    list.sort((a, b) => a.t - b.t);
    let out = list.slice(-SNAP_KEEP);
    while (out.length) {
      if (writeSnaps({ v: 1, list: out })) break;
      out = out.slice(1);                 // 配额不够就丢最旧的
    }
    return out.length;
  }

  function listSnapshots() {
    return readSnaps().list.map((x, i) => ({ i: i, t: x.t, reason: x.reason, n: x.n || 0 }));
  }

  function restoreSnapshot(i) {
    const box = readSnaps();
    const snap = box.list[i];
    if (!snap || !snap.data) return false;
    const d = snap.data;
    if (d.settings) {
      Object.keys(DEFAULTS).forEach((k) => {
        if (d.settings[k] !== undefined && d.settings[k] !== null) state.settings[k] = d.settings[k];
      });
    }
    state.words = decode(d.words);
    state.logs = d.logs || {};
    state.sessions = d.sessions || [];
    state.lastList = d.lastList || null;
    state.lastSession = d.lastSession || null;
    state.pending = null;
    dueAllCache = { t: 0, v: [] };
    touch();
    saveNow();
    return true;
  }

  // 页面隐藏/关闭时立即落盘，避免最后几次评分丢失
  function installFlush() {
    const flush = () => { if (saveTimer) saveNow(); };
    window.addEventListener('pagehide', flush);
    window.addEventListener('beforeunload', flush);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') flush();
    });
  }

  const dayKey = (ts) => {
    const d = new Date(ts || Date.now());
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  };

  function log(k) {
    const key = k || dayKey();
    if (!state.logs[key]) state.logs[key] = { n: 0, r: 0, ok: 0, bad: 0 };
    return state.logs[key];
  }

  /* ---------- 词书 ---------- */
  const BOOKS = () => window.BBB_BOOKS || [];
  const WORDS = () => window.BBB_WORDS || [];

  let wordIndex = null;       // word -> record
  function buildIndex() {
    wordIndex = new Map();
    const W = WORDS();
    for (let i = 0; i < W.length; i++) wordIndex.set(W[i][0], W[i]);
  }

  function book(code) {
    const bs = BOOKS();
    for (let i = 0; i < bs.length; i++) if (bs[i].code === (code || state.settings.book)) return bs[i];
    return bs[0];
  }

  function group(code, gi) {
    const b = book(code);
    return b && b.groups[gi];
  }

  function rec(idx) { return WORDS()[idx]; }

  function recOf(word) {
    if (!wordIndex) buildIndex();
    let r = wordIndex.get(word);
    // 自制词书会在运行中往词库里追加词条，索引是懒建的，这里补一次
    if (!r && wordIndex.size !== WORDS().length) {
      buildIndex();
      r = wordIndex.get(word);
    }
    return r || null;
  }

  // 每个词书展平后的索引数组，只算一次
  const flatCache = {};
  function bookWordIdx(code) {
    const c = code || state.settings.book;
    if (flatCache[c]) return flatCache[c];
    const b = book(c);
    const out = [];
    if (b) {
      for (let i = 0; i < b.groups.length; i++) {
        const w = b.groups[i].w;
        for (let k = 0; k < w.length; k++) out.push(w[k]);
      }
    }
    flatCache[c] = out;
    return out;
  }

  /* ---------- 记忆曲线 ---------- */
  const EASE_MIN = 1.3, EASE_MAX = 3.2, CAP = 180;

  function card(word) {
    let c = state.words[word];
    if (!c) {
      c = { st: 0, e: 2.5, i: 0, d: 0, r: 0, l: 0, seen: 0, u: 0 };
      state.words[word] = c;
    }
    return c;
  }

  function statusOf(c) {
    if (!c || c.st === 0) return 0;
    if (c.st === 3) return 3;
    if (c.st === 1) return 1;
    return 2;
  }

  function apply(c0, q, now) {
    const c = Object.assign({}, c0);
    now = now || Date.now();
    c.seen = (c.seen || 0) + 1;

    if (q === 0) {                       // 忘记 → 10 分钟后重现
      c.l = (c.l || 0) + 1;
      c.r = 0;
      c.e = Math.max(EASE_MIN, (c.e || 2.5) - 0.2);
      c.i = 0;
      c.st = 1;
      c.d = now + 10 * MIN;
    } else if (q === 1) {                // 模糊
      c.e = Math.max(EASE_MIN, (c.e || 2.5) - 0.15);
      c.r = (c.r || 0) + 1;
      c.i = c.i ? Math.min(CAP, Math.max(1, c.i * 1.25)) : 1;
      c.st = c.i >= 21 ? 3 : 2;
      c.d = now + Math.max(c.i, 1) * DAY;
    } else if (q === 2) {                // 认识 → 1 天 → 3 天 → ×ease
      c.e = Math.min(EASE_MAX, (c.e || 2.5) + (c.r ? 0.02 : 0.08));
      c.r = (c.r || 0) + 1;
      if (!c.i) c.i = 1;
      else if (c.r <= 2) c.i = c.i === 1 ? 3 : c.i * 2;
      else c.i = c.i * c.e;
      c.i = Math.min(CAP, Math.max(1, c.i));
      c.st = c.i >= 21 ? 3 : 2;
      c.d = now + c.i * DAY;
    } else {                             // 太简单
      c.e = Math.min(EASE_MAX, (c.e || 2.5) + 0.15);
      c.r = (c.r || 0) + 1;
      c.i = Math.min(CAP, Math.max(4, (c.i || 1) * c.e * 1.35));
      c.st = c.i >= 21 ? 3 : 2;
      c.d = now + c.i * DAY;
    }
    c.u = now;
    return c;
  }

  function grade(word, q) {
    const c = card(word);
    const wasNew = c.st === 0;
    const nc = apply(c, q, Date.now());
    Object.keys(nc).forEach((k) => { c[k] = nc[k]; });
    const lg = log();
    if (wasNew) lg.n += 1; else lg.r += 1;
    if (q >= 2) lg.ok += 1; else lg.bad += 1;
    touch();
    save();
    return { due: c.d, interval: c.i, ease: c.e, lapse: c.l };
  }

  function predict(word, q) {
    const base = state.words[word] || { st: 0, e: 2.5, i: 0, d: 0, r: 0, l: 0, seen: 0, u: 0 };
    const nc = apply(base, q, Date.now());
    if (nc.st === 1 && !nc.i) return '10 分钟后';
    return intervalLabel(nc.i);
  }

  function intervalLabel(days) {
    if (days < 1) return '10 分钟';
    if (days < 1.5) return '明天';
    if (days < 30) return Math.round(days) + ' 天后';
    const m = days / 30;
    if (m < 12) return Math.round(m) + ' 个月后';
    return (days / 365).toFixed(1) + ' 年后';
  }

  /* ---------- 队列 ---------- */
  function newWords(limit, code) {
    const out = [];
    const idxs = bookWordIdx(code || state.settings.book);
    const W = WORDS();
    for (let k = 0; k < idxs.length && out.length < limit; k++) {
      const w = W[idxs[k]][0];
      const c = state.words[w];
      if (!c || c.st === 0) out.push(w);
    }
    return out;
  }

  function dueWords(code) {
    const out = [];
    const idxs = bookWordIdx(code || state.settings.book);
    const W = WORDS();
    const now = Date.now();
    for (let k = 0; k < idxs.length; k++) {
      const w = W[idxs[k]][0];
      const c = state.words[w];
      if (c && c.st !== 0 && c.d <= now) out.push({ w: w, d: c.d });
    }
    out.sort((a, b) => a.d - b.d);
    return out.map((x) => x.w);
  }

  // 缓存 4 秒：首页会多次调用，卡片状态随时间变化
  function dueWordsAll() {
    const now = Date.now();
    if (now - dueAllCache.t < 4000) return dueAllCache.v;
    const W = WORDS();
    const out = [];
    for (let i = 0; i < W.length; i++) {
      const c = state.words[W[i][0]];
      if (c && c.st !== 0 && c.d <= now) out.push({ w: W[i][0], d: c.d });
    }
    out.sort((a, b) => a.d - b.d);
    const v = out.map((x) => x.w);
    dueAllCache = { t: now, v: v };
    return v;
  }

  function counts(code) {
    const idxs = bookWordIdx(code || state.settings.book);
    const W = WORDS();
    let learned = 0, due = 0, mature = 0;
    const now = Date.now();
    for (let k = 0; k < idxs.length; k++) {
      const c = state.words[W[idxs[k]][0]];
      if (!c || c.st === 0) continue;
      learned++;
      if (c.d <= now) due++;
      if (c.st === 3) mature++;
    }
    return { total: idxs.length, learned: learned, due: due, mature: mature };
  }

  function groupStats(code, gi) {
    const g = group(code, gi);
    if (!g) return { total: 0, learned: 0, due: 0, mature: 0 };
    const W = WORDS();
    let learned = 0, due = 0, mature = 0;
    const now = Date.now();
    for (let k = 0; k < g.w.length; k++) {
      const c = state.words[W[g.w[k]][0]];
      if (!c || c.st === 0) continue;
      learned++;
      if (c.d <= now) due++;
      if (c.st === 3) mature++;
    }
    return { total: g.w.length, learned: learned, due: due, mature: mature };
  }

  function todayCounts() {
    const lg = state.logs[dayKey()] || { n: 0, r: 0, ok: 0, bad: 0 };
    return { newDone: lg.n, reviewDone: lg.r, right: lg.ok, wrong: lg.bad };
  }

  // 今天没学则从昨天往前算，不再把「昨天」冒充成「今天连上」
  function streak() {
    let s = 0;
    const d = new Date();
    const has = (ts) => { const lg = state.logs[dayKey(ts)]; return !!(lg && (lg.n + lg.r) > 0); };
    if (!has(d.getTime())) d.setDate(d.getDate() - 1);
    for (let k = 0; k < 400; k++) {
      if (!has(d.getTime())) break;
      s++;
      d.setDate(d.getDate() - 1);
    }
    return s;
  }

  // 距考试天数 / 每天需要背多少才够
  function examInfo() {
    const ds = state.settings.examDate;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(ds || '')) return null;
    const target = new Date(ds + 'T00:00:00');
    if (isNaN(target.getTime())) return null;
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const days = Math.round((target - today) / DAY);
    if (days < 0) return { days: days, left: 0, perDay: 0, passed: true };
    const idxs = bookWordIdx();
    let left = 0;
    const W = WORDS();
    for (let k = 0; k < idxs.length; k++) {
      const c = state.words[W[idxs[k]][0]];
      if (!c || c.st !== 3) left++;
    }
    const perDay = days > 0 ? Math.ceil(left / days) : left;
    return { days: days, left: left, perDay: perDay, passed: false };
  }

  function reset() {
    state.words = {};
    state.logs = {};
    state.sessions = [];
    state.lastList = null;
    state.lastSession = null;
    state.pending = null;
    state.longLast = 0;
    state.weak = null;
    dueAllCache = { t: 0, v: [] };
    touch();
    lastSnapDay = dayKey();   // 清空后别把空状态存成当日快照
    saveNow();
  }

  /* ---------- 未完成会话 ---------- */
  function setPending(p) {
    state.pending = p ? sanitizePending(Object.assign({ t: Date.now() }, p)) : null;
    touch();
    save();
  }
  function clearPending() {
    if (!state.pending) return;
    state.pending = null;
    touch();
    save();
  }

  /* ---------- 云端同步：编码 / 合并 ---------- */
  const r1 = (v, n) => Math.round((Number(v) || 0) * Math.pow(10, n)) / Math.pow(10, n);

  // [st, e, i, d, r, l, seen, u] 比对象省掉一大半键名
  function encode(slim) {
    const out = {};
    const src = slim || slimWords();
    for (const w in src) {
      const c = src[w];
      out[w] = [c.st || 0, r1(c.e, 2), r1(c.i, 1), Math.round(c.d || 0), c.r || 0, c.l || 0, c.seen || 0, Math.round(c.u || 0), c.s || 0, c.x || 0];
    }
    return out;
  }

  function decode(map) {
    const out = {};
    if (!map || typeof map !== 'object') return out;
    for (const w in map) {
      const a = map[w];
      if (!Array.isArray(a) || a.length < 7) continue;
      out[w] = {
        st: Math.max(0, Math.min(3, Math.round(Number(a[0]) || 0))),
        e: Math.min(3.2, Math.max(1.3, Number(a[1]) || 2.5)),
        i: Math.min(180, Math.max(0, Number(a[2]) || 0)),
        d: Math.max(0, Number(a[3]) || 0),
        r: Math.max(0, Math.round(Number(a[4]) || 0)),
        l: Math.max(0, Math.round(Number(a[5]) || 0)),
        seen: Math.max(0, Math.round(Number(a[6]) || 0)),
        u: Math.max(0, Number(a[7]) || 0),
        s: a[8] ? 1 : 0,
        x: Math.min(99, Math.max(0, Math.round(Number(a[9]) || 0))),
      };
    }
    return out;
  }

  // 同一张卡两边都有：取「最后更新」更新的一条；旧数据没有 u 时退回比较复习次数
  function pickCard(a, b) {
    if (!a) return b || null;
    if (!b) return a;
    const ua = a.u || 0, ub = b.u || 0;
    if (ua || ub) return ua >= ub ? a : b;
    return (a.seen || 0) >= (b.seen || 0) ? a : b;
  }

  /**
   * 把远端快照并入本地。返回 { changed, words, logs, sessions }
   * 语义：逐条取更「新」的，绝不整体覆盖本地进度。
   */
  // 导入别人文件时，把设置夹回合理范围，避免被写成离谱的值
  function clampSettings(s) {
    const num = (v, lo, hi, dflt) => {
      const n = Number(v);
      if (!isFinite(n)) return dflt;
      return Math.min(hi, Math.max(lo, n));
    };
    s.dailyNew = Math.round(num(s.dailyNew, 5, 200, 20));
    s.dailyReview = Math.round(num(s.dailyReview, 0, 1000, 100));
    s.sessionSize = Math.round(num(s.sessionSize, 0, 200, 20));
    s.longEvery = Math.round(num(s.longEvery, 1, 365, 14));
    s.longSize = Math.round(num(s.longSize, 1, 100, 20));
    s.cardScale = num(s.cardScale, 0.8, 1.6, 1);
    if (['read', 'listen', 'spell'].indexOf(s.mode) < 0) s.mode = 'read';
    if (['us', 'uk'].indexOf(s.accent) < 0) s.accent = 'us';
    if (['off', 'after', 'always'].indexOf(s.autoAudio) < 0) s.autoAudio = 'after';
    if (['book', 'random'].indexOf(s.order) < 0) s.order = 'book';
    if (typeof s.examDate !== 'string' || (s.examDate && !/^\d{4}-\d{2}-\d{2}$/.test(s.examDate))) s.examDate = '';
    if (!BOOKS().some((b) => b.code === s.book)) s.book = (BOOKS()[0] || {}).code || 'sat';
    return s;
  }

  function mergeRemote(remote) {
    if (!remote || typeof remote !== 'object') return { changed: false };
    let changed = false, nWords = 0, nLogs = 0, nSess = 0;

    const rw = remote.words && !Array.isArray(remote.words) ? remote.words : null;
    if (rw) {
      const isPacked = Object.keys(rw).length && Array.isArray(rw[Object.keys(rw)[0]]);
      const incoming = isPacked ? decode(rw) : sanitizeWords(rw);
      Object.keys(incoming).forEach((w) => {
        const pick = pickCard(state.words[w], incoming[w]);
        if (pick !== state.words[w]) { state.words[w] = pick; nWords++; changed = true; }
      });
    }

    if (remote.logs && typeof remote.logs === 'object') {
      const rl = sanitizeLogs(remote.logs);
      Object.keys(rl).forEach((k) => {
        const l = state.logs[k];
        if (!l) { state.logs[k] = rl[k]; nLogs++; changed = true; return; }
        ['n', 'r', 'ok', 'bad'].forEach((f) => {
          if (rl[k][f] > (l[f] || 0)) { l[f] = rl[k][f]; changed = true; }
        });
      });
    }

    if (Array.isArray(remote.sessions)) {
      const seen = new Set(state.sessions.map((s) => s && s.t));
      remote.sessions.forEach((s) => {
        if (!s || typeof s !== 'object' || !s.t || seen.has(s.t)) return;
        state.sessions.push(s);
        seen.add(s.t);
        nSess++;
        changed = true;
      });
      state.sessions.sort((a, b) => (a.t || 0) - (b.t || 0));
      if (state.sessions.length > 200) state.sessions = state.sessions.slice(-200);
    }

    // 设置：云端优先，但外观（主题）是本机偏好，保留本地
    if (remote.settings && typeof remote.settings === 'object') {
      const keepTheme = state.settings.theme;
      Object.keys(DEFAULTS).forEach((k) => {
        const v = remote.settings[k];
        if (v === undefined || v === null) return;
        state.settings[k] = v;
      });
      state.settings.theme = keepTheme;
      clampSettings(state.settings);
    }

    if (!state.lastList && remote.lastList && typeof remote.lastList === 'object') {
      state.lastList = remote.lastList;
      changed = true;
    }
    if (remote.lastSession && typeof remote.lastSession === 'object') {
      const lt = (state.lastSession && state.lastSession.t) || 0;
      if ((remote.lastSession.t || 0) > lt) { state.lastSession = remote.lastSession; changed = true; }

    state.syncedRev = typeof rev === 'number' ? rev : state.rev;

    save();
  }

    return state.rev !== state.syncedRev;

  function ensureCard(w) {
    if (!state.words[w]) {
      state.words[w] = { st: 0, e: 2.5, i: 0, d: 0, r: 0, l: 0, seen: 0, s: 0, x: 0, u: 0 };

    if (!w || !recOf(w)) return false;
    const c = ensureCard(w);
    c.s = c.s ? 0 : 1;
    touch();
    save();
    return !!c.s;
  }

  function isStarred(w) {
    const c = state.words[w];
    return !!(c && c.s);
  }

  function markWrong(w) {
    if (!w || !recOf(w)) return;
    const c = ensureCard(w);
    c.x = Math.min(99, (c.x || 0) + 1);

    const k = dayKey();

    if (state.weak.w.indexOf(w) < 0 && state.weak.w.length < 300) state.weak.w.push(w);

  function todayWeak() {
    const k = dayKey();
    if (!state.weak || state.weak.d !== k) return [];

  }

  function starredWords() {
    const out = [];
    const W = WORDS();
    for (let i = 0; i < W.length; i++) {
      const c = state.words[W[i][0]];
      if (c && c.s) out.push(W[i][0]);
    }
    return out;
  }

  function wrongWords() {
    const out = [];
    const W = WORDS();
    for (let i = 0; i < W.length; i++) {
      const c = state.words[W[i][0]];
      if (c && c.x > 0) out.push({ w: W[i][0], x: c.x });
    }
    out.sort((a, b) => b.x - a.x);
    return out.map((o) => o.w);
  }

  /* ---------- 积压摊平 ---------- */
  // 到期词远超每日上限时，把多出来的均匀摊到未来几天，避免一打开就被劝退
  function spreadBacklog(days) {
    days = Math.max(2, Math.min(7, days || 3));
    const capV = Number(state.settings.dailyReview);
    const cap = capV > 0 ? capV : 1e9;
    const due = dueWordsAll();

    const rest = due.slice(cap);
    const now = Date.now();
    const per = Math.ceil(rest.length / days);
    rest.forEach((w, i) => {
      const c = state.words[w];
      if (!c) return;
      const day = Math.min(days, Math.floor(i / per) + 1);
      c.d = now + day * DAY + 9 * 60 * MIN;   // 摊到之后几天的早上 9 点
    });
    dueAllCache = { t: 0, v: [] };
    touch();
    saveNow();
    return rest.length;
  }

  /* ---------- 定期回顾旧词 ---------- */
  // 候选：已掌握、或者间隔已经拉到 21 天以上；还没到期的（到期走日常复习）
  function longCandidates() {
    const now = Date.now();
    const W = WORDS();
    const out = [];
    for (let i = 0; i < W.length; i++) {
      const w = W[i][0];
      const c = state.words[w];
      if (!c || c.st < 2) continue;
      if (c.st !== 3 && (c.i || 0) < 21) continue;
      if (c.d && c.d <= now) continue;
      out.push({ w: w, u: c.u || 0 });
    }
    out.sort((a, b) => a.u - b.u);   // 最久没看过的排前面
    return out.map((o) => o.w);
  }

  function longDue() {
    const st = state.settings;
    if (!st.longReview) return [];
    const every = Math.max(1, Number(st.longEvery) || 14) * DAY;
    const size = Math.max(1, Math.min(100, Number(st.longSize) || 20));
    const last = state.longLast || 0;
    // 从没用过：用满一个周期之后才开始提醒，别一上来就弹
    if (!last) {
      const born = Number(st.createdAt) || 0;
      if (born && Date.now() - born < every) return [];
    } else if (Date.now() - last < every) {
      return [];
    }
    return longCandidates().slice(0, size);
  }

  function markLongReview() {
    state.longLast = Date.now();
    touch();
    saveNow();
  }

  window.BBB = {
    V, DAY, MIN, state, load, save, saveNow, payload, dayKey, log, card, statusOf,
    grade, predict, apply, intervalLabel, touch, installFlush,
    book, group, rec, recOf, bookWordIdx, books: BOOKS, words: WORDS,
    newWords, dueWords, dueWordsAll, counts, groupStats, todayCounts, streak, examInfo, reset,
    setPending, clearPending,
    encode, decode, mergeRemote, markSynced, needsSync, slimWords,
    star, isStarred, starredWords, wrongWords, markWrong,
    longCandidates, longDue, markLongReview, clampSettings, todayWeak, spreadBacklog,
    makeSnapshot, listSnapshots, restoreSnapshot,
  };
})();

<script data-src="assets/audio.js">
/* bengbengbeng · 发音：有道词典真人录音优先，失败回退系统语音 */
(function () {
  'use strict';

  const cache = new Map();     // url -> Audio
  let current = null;
  let synthVoice = null;

  function pickVoice() {
    if (!('speechSynthesis' in window)) return;
    const vs = speechSynthesis.getVoices() || [];
    synthVoice = vs.find((v) => /en[-_]US/i.test(v.lang) && /Samantha|Alex|Google|Microsoft/i.test(v.name))
      || vs.find((v) => /en[-_]US/i.test(v.lang))
      || vs.find((v) => /^en/i.test(v.lang))
      || null;
  }
  if ('speechSynthesis' in window) {
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;
  }

  function url(word, accent) {
    // type=1 英音 / type=2 美音（有道词典录音）
    return 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(word) + '&type=' + (accent === 'uk' ? 1 : 2);
  }

  function speak(word, accent) {
    if (!('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(word);
      u.lang = accent === 'uk' ? 'en-GB' : 'en-US';
      u.rate = 0.92;
      if (synthVoice && accent !== 'uk') u.voice = synthVoice;
      speechSynthesis.speak(u);
    } catch (e) { /* ignore */ }
  }

  function trim() {
    if (cache.size <= 60) return;
    const keys = cache.keys();
    for (let i = 0; i < 20; i++) {
      const k = keys.next().value;
      if (k === undefined) break;
      const a = cache.get(k);
      if (a && a !== current) { try { a.src = ''; } catch (e) { } cache.delete(k); }
    }
  }

  function play(word, accent, btn) {
    accent = accent === 'uk' ? 'uk' : 'us';
    const u = url(word, accent);

    if (current) {
      try { current.pause(); } catch (e) { }
      current = null;
    }
    document.querySelectorAll('.spk.playing').forEach((n) => n.classList.remove('playing'));

    let a = cache.get(u);
    if (!a) {
      a = new Audio(u);
      a.preload = 'auto';
      cache.set(u, a);
      trim();
    }
    try { a.currentTime = 0; } catch (e) { }
    if (btn) btn.classList.add('playing');

    let fellBack = false;
    const fallback = () => {
      if (fellBack) return;
      fellBack = true;
      if (btn) btn.classList.remove('playing');
      speak(word, accent);
    };

    a.onended = () => {
      if (btn) btn.classList.remove('playing');
      if (current === a) current = null;
    };
    a.onerror = fallback;

    current = a;
    const p = a.play();
    if (p && p.catch) p.catch(fallback);
    // 兜底：1.2 秒还没有任何音频数据说明录音取不到，回退系统语音
    setTimeout(() => {
      if (current === a && a.readyState === 0 && a.paused) fallback();
      if (btn) btn.classList.remove('playing');
    }, 1200);
  }

  function prefetch(word, accent) {
    const u = url(word, accent);
    if (cache.has(u)) return;
    const a = new Audio();
    a.preload = 'auto';
    a.src = u;
    cache.set(u, a);
    if (cache.size > 80) {
      const first = cache.keys().next().value;
      if (first !== u) cache.delete(first);
    }
  }

  function speakSentence(text) {
    if (!('speechSynthesis' in window)) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.95;
      if (synthVoice) u.voice = synthVoice;
      speechSynthesis.speak(u);
    } catch (e) { }
  }

  window.BBBAudio = { play, prefetch, speak, speakSentence };
})();
