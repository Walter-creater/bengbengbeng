      const list = NB.tab === 'star' ? B.starredWords() : B.wrongWords();
      if (!list.length) return;
      const take = list.slice(0, 100);
      startReviewQuiz(take, { book: B.state.settings.book, title: NB.tab === 'star' ? '生词本' : '错题本' });
      return;
    }

    const qk = t.closest('[data-quick]');
    if (qk) { startQuick(parseInt(qk.getAttribute('data-quick'), 10)); return; }

    const cr = t.closest('[data-curve]');
    if (cr) { setCurveRange(parseInt(cr.getAttribute('data-curve'), 10)); return; }

    const opt = t.closest('[data-opt]');
    if (opt && S.quiz) { qzAnswer(parseInt(opt.getAttribute('data-opt'), 10)); return; }

    const peekW = t.closest('[data-peek]');
    if (peekW) { openWord(peekW.getAttribute('data-peek')); return; }

    const jump = t.closest('[data-jump]');
    if (jump) {
      const parts = jump.getAttribute('data-jump').split(':');
      PK.book = parts[0];
      PK.level = '全部';
      location.hash = '#/books';
      render();
      setTimeout(() => openListSheet(parseInt(parts[1], 10)), 150);
      return;
    }

    const actEl = t.closest('[data-act]');
    if (actEl) {
      const act = actEl.getAttribute('data-act');
      const st = B.state.settings;
      if (act === 'daily') { startDaily(); return; }
      if (act === 'daily-n') { startDaily(null, parseInt(actEl.getAttribute('data-n'), 10)); return; }
      if (act === 'newbook') { openImportBookSheet(); return; }
      if (act === 'fillbook') { openFillSheet(PK.book); return; }

      if (act === 'delbook') {
        const code = PK.book;
        const mb = B.book(code) || {};
        if (!confirm('删除「' + (mb.name || '这本词书') + '」？\n\n只是从列表里拿掉，背过的记录不会丢。')) return;
        const rest = loadMyBooks().filter((x) => x.code !== code);
        saveMyBooks(rest);
        const arr = window.BBB_BOOKS || [];
        for (let i = arr.length - 1; i >= 0; i--) if (arr[i].code === code) arr.splice(i, 1);
        if (B.state.settings.book === code) B.state.settings.book = 'sat';
        PK.book = B.state.settings.book;
        B.touch(); B.save();
        render();
        toast('已删除');
        return;
      }
      if (act === 'hardreset') {
        if (!confirm('清空所有本地数据？\n\n进度、自制词书、查词缓存都会删掉，无法恢复。')) return;
        try {
          ['bbb:state:v1', 'bbb:snaps', 'bbb:mybooks:v1', 'bbb:dict:v1', 'bbb:feedback:v1'].forEach((k) => localStorage.removeItem(k));
        } catch (e) { }
        location.reload();
        return;
      }
      if (act === 'offline-audio') { openAudioPicker(); return; }
      if (act === 'feedback') { openFeedbackSheet(); return; }
      if (act === 'star') {
        const sw = actEl.getAttribute('data-word');
        toast(B.star(sw) ? '已加入生词本' : '已移出生词本');
        render();
        return;
      }
      if (act === 'spread') {
        const n = B.spreadBacklog(3);
        toast(n ? '已把 ' + n + ' 个词摊到未来 3 天' : '没有需要摊平的词');
        render();
        return;
      }
      if (act === 'weak') {
        const list = B.todayWeak();
        if (!list.length) { toast('今天没有需要重来的词'); return; }
        startReviewQuiz(list.slice(0, 60), { book: B.state.settings.book, title: '今日薄弱词' });
        return;
      }
      if (act === 'long') { startLongReview(); return; }
      if (act === 'toggle-long') {
        st.longReview = !st.longReview;
        B.touch(); B.save();
        toast(st.longReview ? '已开启定期回顾旧词' : '已关闭定期回顾');
        render();
        return;
      }
      if (act === 'only-review') { openReviewSheet(); return; }
      if (act === 'books') { location.hash = '#/books'; return; }
      if (act === 'continuelist') {
        const ls = B.state.lastList;
        if (ls) { PK.book = ls.book; openListSheet(ls.gi); }
        return;
      }
      if (act === 'resume') { resumeSession(); return; }
      if (act === 'qz-exit') { qzExit(); return; }
      if (act === 'qz-next') { qzNext(); return; }
      if (act === 'qz-spell') { qzSpellSubmit(); return; }
      if (act === 'qz-say') {
        const w = S.quiz && S.quiz.cur ? S.quiz.cur.word : '';
        if (w) AUD.play(w, st.accent === 'uk' ? 'uk' : 'us');
        return;
      }
      if (act === 'qz-retry') {
        const sum = S.quiz && S.quiz.sum;
        const weak = (sum ? sum.weak : []).map((x) => x.w);
        if (!weak.length) return;
        const chain = sum && sum.chain;   // 后面排着的新词别弄丢
        S.quiz = null;
        startDrill(weak, { title: '不熟的词', book: st.book, chain: chain });
        return;
      }
      if (act === 'qz-chain') {
        const chain = S.quiz && S.quiz.sum ? S.quiz.sum.chain : null;
        S.quiz = null;
        if (chain && chain.length) startDrill(chain, { title: '今日新词', book: st.book });
        else location.hash = '#/home';
        return;
      }
      if (act === 'qz-done') { S.quiz = null; S.active = false; S.done = false; location.hash = '#/home'; return; }
      if (act === 'search') { openSearch(); return; }
      if (act === 'exit') { persistSession(); S.active = false; location.hash = '#/home'; return; }
      if (act === 'home') { location.hash = '#/home'; return; }
      if (act === 'flip') {
        if (S.mode === 'spell' && !S.checked) return;
        S.flipped = !S.flipped;
        render();
        if (S.flipped && B.state.settings.autoAudio === 'after') playWord();
        return;
      }
      if (act === 'spell-submit') { submitSpell(); return; }
      if (act === 'toggle-onlynew') { st.onlyNew = !st.onlyNew; PK.onlyNew = st.onlyNew; B.touch(); B.save(); render(); return; }
      if (act === 'toggle-easy') { st.showEasy = !st.showEasy; B.touch(); B.save(); render(); return; }
      if (act === 'toggle-drill') { st.drillNew = !st.drillNew; B.touch(); B.save(); render(); return; }
      if (act === 'toggle-remind') {
        st.remindOn = !st.remindOn;
        B.touch(); B.save();
        if (st.remindOn) {
          if (notiPerm() === 'default') askPerm();
          toast('已开启每日 ' + st.remindTime + ' 提醒');
        }
        render();
        return;
      }
      if (act === 'ask-perm') { askPerm(); return; }
      if (act === 'toggle-reviewquiz') { st.reviewQuiz = !st.reviewQuiz; B.touch(); B.save(); render(); return; }
      if (act === 'toggle-replay') { st.spellReplay = !st.spellReplay; B.touch(); B.save(); render(); return; }
      if (act === 'toggle-ime') { st.imeSuggest = !st.imeSuggest; B.touch(); B.save(); render(); return; }
      if (act === 'toggle-ipa') { st.showIpa = !st.showIpa; B.touch(); B.save(); render(); return; }
      if (act === 'toggle-endef') { st.showEnDef = !st.showEnDef; B.touch(); B.save(); render(); return; }
      if (act === 'toggle-example') { st.showExample = !st.showExample; B.touch(); B.save(); render(); return; }
      if (act === 'exam-focus') { const d = $('#examdate'); if (d) { d.focus(); try { d.showPicker(); } catch (e) { } } return; }
      if (act === 'exam-clear') { st.examDate = ''; B.touch(); B.save(); render(); return; }
      if (act === 'export') { exportData(); return; }
      if (act === 'import') { importData(); return; }
      if (act === 'copy-link') { copyText(shareUrl()); return; }
      if (act === 'system-share') { nativeShare(); return; }
      if (act === 'reset') {
        const ans = prompt('确定清空全部学习进度？此操作不可撤销。\n\n清空前会自动存一份快照，可在「设置 → 数据快照」里恢复。\n\n确认请输入：清空');
        if (ans === null) return;
        if (String(ans).trim() !== '清空') { toast('没有清空，输入不匹配'); return; }
        B.makeSnapshot('before-reset');
        B.reset();
        toast('已清空，旧进度存在快照里');
        render();
        return;
      }
      if (act === 'snapshots') { openSnapshotSheet(); return; }
    }

    const go = t.closest('[data-go]');
    if (go) { location.hash = '#/' + go.getAttribute('data-go'); return; }

    const qb = t.closest('[data-q]');
    if (qb) {
      if (!S.active) return;
      // 没翻面就评分会把「没看到答案」也算进去，这里统一拦住
      if (S.mode === 'spell' ? !S.checked : !S.flipped) return;
      rate(parseInt(qb.getAttribute('data-q'), 10));
      return;
    }

    const pkb = t.closest('[data-pkbook]');
    if (pkb) {
      PK.book = pkb.getAttribute('data-pkbook');
      PK.level = '全部';
      B.state.settings.book = PK.book;
      B.touch(); B.save();
      render();
      return;
    }

    const pkl = t.closest('[data-pklevel]');
    if (pkl) { PK.level = pkl.getAttribute('data-pklevel'); render(); return; }

    const ol = t.closest('[data-openlist]');
    if (ol) { openListSheet(parseInt(ol.getAttribute('data-openlist'), 10)); return; }

    const sb2 = t.closest('[data-setbook2]');
    if (sb2) {
      const code = sb2.getAttribute('data-setbook2');
      B.state.settings.book = code;
      PK.book = code; PK.level = '全部';
      B.touch(); B.save(); render();
      return;
    }

    const sb = t.closest('[data-setbook]');
    if (sb) {
      const code = sb.getAttribute('data-setbook');
      B.state.settings.book = code;
      PK.book = code;
      PK.level = '全部';
      B.touch(); B.save();
      render();
      toast('默认词书：' + B.book(code).name);
      return;
    }

    // 必须限定 button：[data-theme] 也挂在 <html> 上，用裸选择器会把页面里所有点击
    // 都当成“切换主题”吞掉，导致下面的 data-new / data-review / data-size 全部失效
    const th = t.closest('button[data-theme]');
    if (th) { B.state.settings.theme = th.getAttribute('data-theme'); B.touch(); B.save(); applyTheme(); render(); return; }

    const nw = t.closest('[data-new]');
    if (nw) { B.state.settings.dailyNew = parseInt(nw.getAttribute('data-new'), 10); B.touch(); B.save(); render(); return; }

    const rv = t.closest('[data-review]');
    if (rv) { B.state.settings.dailyReview = parseInt(rv.getAttribute('data-review'), 10); B.touch(); B.save(); render(); return; }

    const le = t.closest('[data-longevery]');
    if (le) { B.state.settings.longEvery = parseInt(le.getAttribute('data-longevery'), 10); B.touch(); B.save(); render(); return; }

    const ln = t.closest('[data-longsize]');
    if (ln) { B.state.settings.longSize = parseInt(ln.getAttribute('data-longsize'), 10); B.touch(); B.save(); render(); return; }

    const sc = t.closest('[data-scale]');
    if (sc) { B.state.settings.cardScale = parseFloat(sc.getAttribute('data-scale')) || 1; B.touch(); B.save(); applyScale(); render(); return; }

    const ac = t.closest('[data-accent]');
    if (ac) { B.state.settings.accent = ac.getAttribute('data-accent'); B.touch(); B.save(); render(); return; }

    const au = t.closest('[data-audio]');
    if (au) { B.state.settings.autoAudio = au.getAttribute('data-audio'); B.touch(); B.save(); render(); return; }

    const sz = t.closest('[data-size]');
    if (sz) {
      B.state.settings.sessionSize = parseInt(sz.getAttribute('data-size'), 10);
      PK.size = B.state.settings.sessionSize;   // 同步「选 List」弹窗的缓存，否则改了不生效
      B.touch(); B.save(); render(); return;
    }

    const od = t.closest('[data-order]');
    if (od) {
      B.state.settings.order = od.getAttribute('data-order');
      PK.order = B.state.settings.order;
      B.touch(); B.save(); render(); return;
    }

    const md = t.closest('[data-mode]');
    if (md) {
      B.state.settings.mode = md.getAttribute('data-mode');
      if (S.active) S.mode = B.state.settings.mode;
      B.touch(); B.save(); render(); return;
    }
  });

  function submitSpell() {
    const w = S.queue[S.i];
    if (!w) return;
    const inp = $('#spell');
    if (inp) S.typed = inp.value;
    const v = (S.typed || '').trim().toLowerCase();
    if (!v) { toast('先拼一下再提交'); return; }
    S.checked = true;
    S.ok = v === w.toLowerCase();
    S.near = !S.ok && oneEditAway(v, w.toLowerCase()) === 1;
    if (S.ok) playWord();
    else if (B.state.settings.spellReplay) setTimeout(() => playWord(), 260);
    render();
    persistSession();
  }

  document.addEventListener('keydown', (e) => {
    if (currentRoute() !== 'study' || !S.active) return;
    if (S.quiz) {
      if (e.target && e.target.tagName === 'INPUT') {
        if (e.key === 'Enter') {
          e.preventDefault();
          if (S.quiz.fb) qzNext(); else qzSpellSubmit();
        }
        return;
      }
      if (S.quiz.sum) {
        if (e.key === 'Enter') { e.preventDefault(); S.quiz = null; S.active = false; S.done = false; location.hash = '#/home'; }
        return;
      }
      if (S.quiz.fb) {
        if (e.key === 'Enter' || e.code === 'Space') { e.preventDefault(); qzNext(); }
        return;
      }
      if (/^[1-4]$/.test(e.key || '')) {
        const i = parseInt(e.key, 10) - 1;
        const n = S.quiz.cur ? S.quiz.cur.opts.length : 0;
        if (i < n) { e.preventDefault(); qzAnswer(i); }
        return;
      }
      if (e.key === 'Escape') { qzExit(); }
      return;
    }
    if (e.target && e.target.tagName === 'INPUT') {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (S.mode === 'spell' && !S.checked) submitSpell();
        else if (S.mode === 'spell' && S.checked) rate(S.ok ? 2 : 0);
        else if (S.flipped) rate(2);
      }
      return;
    }
    if (e.code === 'Space') {
      e.preventDefault();
      if (S.mode !== 'spell' || S.checked) {
        S.flipped = !S.flipped;
        render();
        if (S.flipped && B.state.settings.autoAudio === 'after') playWord();
      }
    } else if (e.key === '1') { if (S.flipped) rate(0); }
    else if (e.key === '2') { if (S.flipped) rate(1); }
    else if (e.key === '3') { if (S.flipped) rate(2); }
    else if (e.key === '4' && B.state.settings.showEasy) { if (S.flipped) rate(3); }
    else if (e.key === 'Escape') { S.active = false; location.hash = '#/home'; }
  });

  function exportData() {
    const dump = Object.assign({ app: 'bengbengbeng', v: B.V, exportedAt: new Date().toISOString() }, B.payload());
    dump.mybooks = loadMyBooks();
    const blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'bengbengbeng-' + B.dayKey() + '.json';
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1500);
    toast('已导出备份（' + Object.keys(dump.words || {}).length + ' 个词）');
  }

  function importData() {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'application/json,.json';
    inp.onchange = () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      if (f.size > 8 * 1024 * 1024) { toast('文件太大，不像是学习记录'); return; }
      const rd = new FileReader();
      rd.onload = () => {
        let d = null;
        try {
          d = JSON.parse(rd.result);
        } catch (e) {
          toast('不是有效的 JSON 文件');
          return;
        }
        if (!d || typeof d !== 'object' || !d.words || typeof d.words !== 'object') {
          toast('文件里没有学习记录');
          return;
        }
        openImportSheet(d);
      };
      rd.onerror = () => toast('读取文件失败');
      rd.readAsText(f);
    };
    inp.click();
  }

  // 先在一份副本上跑一遍合并，算出「会合并多少」，让用户看清再决定
  function previewMerge(d) {
    const clone = (o) => JSON.parse(JSON.stringify(o));
    const bak = {
      words: B.state.words, logs: B.state.logs, sessions: B.state.sessions,
      settings: B.state.settings, lastList: B.state.lastList,
    };
    B.state.words = clone(bak.words);
    B.state.logs = clone(bak.logs);
    B.state.sessions = bak.sessions.slice();
    B.state.settings = clone(bak.settings);
    let res = { changed: false, words: 0, logs: 0, sessions: 0 };
    try { res = B.mergeRemote(d); } catch (e) { }
    B.state.words = bak.words;
    B.state.logs = bak.logs;
    B.state.sessions = bak.sessions;
    B.state.settings = bak.settings;
    B.state.lastList = bak.lastList;
    return res;
  }

  function openImportSheet(d) {
    const res = previewMerge(d);
    const fileN = Object.keys(d.words || {}).length;
    const mask = document.createElement('div');
    mask.className = 'sheet-mask';
    mask.innerHTML = `<div class="sheet">
      <div class="grab"></div>
      <h3 style="font-size:21px">导入学习记录</h3>
      <div class="sheet-sub">和现有进度合并，不会覆盖你已经背过的词</div>
      <div class="card tight" style="box-shadow:none;border:1px solid var(--line);margin:12px 0 14px">
        <div class="row" style="padding:11px 0"><div class="r-lb">文件里的词条</div><span class="pill">${fileN} 个</span></div>
        <div class="row" style="padding:11px 0"><div class="r-lb">会合并进本机</div><span class="pill brand">${res.words || 0} 个词</span></div>
        <div class="row" style="padding:11px 0;border-bottom:0"><div class="r-lb">新增打卡记录</div><span class="pill">${res.logs || 0} 天</span></div>
      </div>
      <button class="btn btn-primary" style="width:100%" data-import-ok="1" ${res.changed ? '' : 'disabled'}>${res.changed ? '合并导入' : '没有新的记录'}</button>
      <button class="btn btn-primary ghost" style="width:100%;margin-top:10px" data-import-cancel="1">取消</button>
      <div class="sheet-note">导入前会自动存一份快照，出问题可以在「设置 → 数据快照」恢复</div>
    </div>`;
    document.body.appendChild(mask);
    mask.addEventListener('click', (e) => {
      if (e.target === mask || e.target.closest('[data-import-cancel]')) { mask.remove(); return; }
      if (e.target.closest('[data-import-ok]')) {
        B.makeSnapshot('before-import');
        if (Array.isArray(d.mybooks) && d.mybooks.length) {
          const cur = loadMyBooks();
          const seen = {};
          cur.forEach((x) => { seen[x.code] = 1; });
          const add = d.mybooks.filter((x) => x && x.code && !seen[x.code]);
          if (add.length) { saveMyBooks(cur.concat(add)); installMyBooks(); }
        }
        const r = B.mergeRemote(d);
        if (d.lastList && typeof d.lastList === 'object' && !B.state.lastList) B.state.lastList = d.lastList;
        B.touch(); B.saveNow(); applyTheme();
        mask.remove();
        render();
        toast(r.changed ? '导入完成，合并了 ' + (r.words || 0) + ' 个词' : '没有新的记录可合并');
      }
    });
  }

  function openSnapshotSheet() {
    const list = B.listSnapshots().reverse();
    const rows = list.length ? list.map((x) => {
      const t = new Date(x.t);
      const pad = (n) => String(n).padStart(2, '0');
      const when = (t.getMonth() + 1) + '/' + t.getDate() + ' ' + pad(t.getHours()) + ':' + pad(t.getMinutes());
      const why = x.reason === 'before-reset' ? '清空前' : x.reason === 'before-import' ? '导入前' : '每日自动';
      return `<div class="row" style="padding:12px 0">
        <div><div class="r-lb">${why} · ${when}</div><div class="r-sub">${x.n} 个词的状态</div></div>
        <button class="pill brand" data-restore="${x.i}" style="height:30px;padding:0 12px">恢复</button>
      </div>`;
    }).join('') : '<div class="empty" style="padding:22px 0">还没有快照，明天会自动留一份</div>';

    const mask = document.createElement('div');
    mask.className = 'sheet-mask';
    mask.innerHTML = `<div class="sheet">
      <div class="grab"></div>
      <h3 style="font-size:21px">数据快照</h3>
      <div class="sheet-sub">每天自动留一份，清空和导入前也会各留一份，最多保留 ${4} 份</div>
      <div style="margin:6px 0 16px">${rows}</div>
      <button class="btn btn-primary" style="width:100%" data-snap-now="1">现在就存一份</button>
      <button class="btn btn-primary ghost" style="width:100%;margin-top:10px" data-import-cancel="1">关闭</button>
      <div class="sheet-note">恢复会用快照覆盖当前进度，恢复前会先存一份当前状态</div>
    </div>`;
    document.body.appendChild(mask);
    mask.addEventListener('click', (e) => {
      if (e.target === mask || e.target.closest('[data-import-cancel]')) { mask.remove(); return; }
      if (e.target.closest('[data-snap-now]')) {
        const n = B.makeSnapshot('manual');
        mask.remove();
        toast('已存快照（共 ' + n + ' 份）');
        return;
      }
      const rs = e.target.closest('[data-restore]');
      if (rs) {
        const i = parseInt(rs.getAttribute('data-restore'), 10);
        if (!confirm('用这份快照覆盖当前进度？\n\n当前状态会先存成一份快照，可以反悔。')) return;
        B.makeSnapshot('before-restore');
        if (B.restoreSnapshot(i)) { mask.remove(); render(); toast('已恢复到该快照'); }
        else { toast('这份快照读不出来'); }
      }
    });
  }

  /* ---------------- 离线发音 ---------------- */
  const AUDIO_CACHE = 'bbb-audio-v1';
  const AUDIO_IDX = 'bbb:audio-idx:v1';

  function audioUrlOf(word, accent) {

  function audioIdx() {
    try { return JSON.parse(localStorage.getItem(AUDIO_IDX) || '{}') || {}; }
    catch (e) { return {}; }
  }

  function audioIdxSave(o) {
    try { localStorage.setItem(AUDIO_IDX, JSON.stringify(o)); } catch (e) { }

  function audioCount() { return Object.keys(audioIdx()).length; }

  async function runAudioDownload(words, bkName) {
    const ui = audioProgressSheet();
    const idx = audioIdx();
    const accent = B.state.settings.accent === 'uk' ? 'uk' : 'us';
    let ok = 0, done = 0, fail = 0;
    try {
      const c = await caches.open(AUDIO_CACHE);
      for (const w of words) {
        const u = audioUrlOf(w, accent);
        try {
          const hit = await c.match(u);
          if (hit) { ok++; idx[u] = 1; }
          else {
            if (idx[u]) delete idx[u];   // 索引说有、缓存其实被清了，重下
            const res = await fetch(u, { mode: 'no-cors' });
            if (res && (res.status === 200 || res.type === 'opaque')) {
              await c.put(u, res);
              idx[u] = 1; ok++;
            } else fail++;
          }
        } catch (e) { fail++; }
        done++;
        ui.update(done, words.length);
        if (done % 10 === 0) { audioIdxSave(idx); await new Promise((r) => setTimeout(r, 120)); }
      }
      audioIdxSave(idx);
    } catch (e) {
      ui.done('出错了：' + (e && e.message));
      return;
    }
    ui.done('「' + bkName + '」存下 ' + ok + ' 个词' + (fail ? '，' + fail + ' 个失败' : ''));
    toast('离线发音：+' + ok + ' 个词');
    render();
  }

  /* ---------------- 自制词书 ---------------- */
  const MYBOOK_KEY = 'bbb:mybooks:v1';
  const MB_STOP = ('the a an and or but if then than that this these those is are was were be been being am do does did ' +
    'have has had will would can could should may might must not no nor so as at by for from in into of on onto out over ' +
    'to up with without it its he she they we you i me my your his her their our them us which who whom whose what when ' +
    'where why how all any both each few more most other some such only own same very just also there here about after ' +
    'before between during through under above below again further once because while until against among around').split(' ');

  function mbNorm(s) {
    return String(s || '').toLowerCase().replace(/[\u2019']/g, "'").replace(/^[^a-z]+|[^a-z']+$/g, '');
  }

  function loadMyBooks() {
    try {
      const raw = localStorage.getItem(MYBOOK_KEY);
      const list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list : [];
    } catch (e) { return []; }
  }

  function saveMyBooks(list) {

  // 把自制词书接进运行时的词库：命中原词库就直接复用下标，新词追加到末尾
  function installMyBooks() {
    const list = loadMyBooks();
    if (!list.length) return;
    const WD = window.BBB_WORDS || [];
    const BK = window.BBB_BOOKS || [];
    const idx = new Map();
    for (let i = 0; i < WD.length; i++) idx.set(mbNorm(WD[i][0]), i);
    list.forEach((mb) => {
      if (!mb || !mb.code || BK.some((b) => b.code === mb.code)) return;
      const ids = [];
      (mb.words || []).forEach((rec) => {
        if (!rec || !rec[0]) return;
        if (Array.isArray(rec[3]) && rec[3].length && String(rec[3][0]).length > 40) rec[3] = [String(rec[3][0]).slice(0, 40)];
        const key = mbNorm(rec[0]);
        let i = idx.get(key);
        if (i === undefined) { i = WD.length; WD.push(rec); idx.set(key, i); }
        ids.push(i);
      });
      if (!ids.length) return;
      const groups = [];
      for (let i = 0; i < ids.length; i += 40) {
        groups.push({ t: 'List ' + (groups.length + 1), lv: '我的', w: ids.slice(i, i + 40) });
      }
      BK.push({ code: mb.code, name: String(mb.name || '我的词书').slice(0, 20), sub: '自制词书 · ' + ids.length + ' 词', groups: groups, mine: true });
    });
  }

  // 词形还原：复数 / 过去式 / ing 都试着回退一层
  function mbVariants(w) {
    const out = [w];
    const push = (x) => { if (x && x.length > 1 && out.indexOf(x) < 0) out.push(x); };
    if (/ies$/.test(w)) push(w.slice(0, -3) + 'y');
    if (/(ses|xes|zes|ches|shes)$/.test(w)) push(w.slice(0, -2));
    if (/s$/.test(w)) push(w.slice(0, -1));
    if (/ied$/.test(w)) push(w.slice(0, -3) + 'y');
    if (/ed$/.test(w)) { push(w.slice(0, -2)); push(w.slice(0, -1)); }
    if (/ing$/.test(w)) { push(w.slice(0, -3)); push(w.slice(0, -3) + 'e'); }
    return out;
  }

  function mbLookup(map, w) {
    const v = mbVariants(w);
    for (let i = 0; i < v.length; i++) {
      if (map.has(v[i])) return map.get(v[i]);
    }
    return null;
  }

  function mbBuildIndex() {
    const map = new Map();
    const WD = W();
    for (let i = 0; i < WD.length; i++) {
      const k = mbNorm(WD[i][0]);
      if (!map.has(k)) map.set(k, i);
    }
    return map;
  }

  // 解析输入：支持「一行一个词」「word 中文释义」，也支持直接粘一段文章
  function mbParse(text) {
    const out = new Map();
    String(text || '').split(/\r?\n/).forEach((line) => {
      const raw = line.trim();
      if (!raw) return;
      const m = raw.match(/^([A-Za-z][A-Za-z'\u2019\-]{1,30})\s*[,，\t|:：]\s*(.+)$/)
        || raw.match(/^([A-Za-z][A-Za-z'\u2019\-]{1,30})\s{2,}(.+)$/)
        || raw.match(/^([A-Za-z][A-Za-z'\u2019\-]{1,30})\s+([\s\S]+)$/);
      if (m && /[\u4e00-\u9fa5]/.test(m[2])) {
        const w = mbNorm(m[1]);
        if (w && !out.has(w)) out.set(w, m[2].trim().slice(0, 40));
        return;
      }
      const toks = raw.match(/[A-Za-z][A-Za-z'\u2019\-]{1,30}/g) || [];
      toks.forEach((t) => {
        const w = mbNorm(t);
        if (w.length < 2 || MB_STOP.indexOf(w) >= 0 || out.has(w)) return;
        out.set(w, null);
      });
    });
    return out;
  }

  function mbAnalyze(text) {
    const map = mbBuildIndex();
    const parsed = mbParse(text);
    const hit = [], fresh = [];
    let skipped = 0;
    parsed.forEach((cn, w) => {
      const idx = mbLookup(map, w);
      if (idx !== null) hit.push(idx);
      else if (cn) fresh.push([w, '', '', [cn], '', '', '', 0, {}]);
      else { fresh.push([w, '', '', [], '', '', '', 0, { todo: 1 }]); skipped++; }
    });
    return { total: parsed.size, hit: hit, fresh: fresh, skipped: skipped };
  }

  // 删词/补词后，按存储重建这本书的分组
  function rebuildMyBook(code) {
    const mb = loadMyBooks().filter((x) => x.code === code)[0];
    const bk = (window.BBB_BOOKS || []).filter((b) => b.code === code)[0];
    if (!mb || !bk) return;
    const WD = W();
    const ids = [];
    mb.words.forEach((w) => {
      const rec = B.recOf(w[0]);
      const i = rec ? WD.indexOf(rec) : -1;
      if (i >= 0) ids.push(i);
    });
    const groups = [];
    for (let i = 0; i < ids.length; i += 40) {
      groups.push({ t: 'List ' + (groups.length + 1), lv: '我的', w: ids.slice(i, i + 40) });
    }
    bk.groups = groups;
    bk.sub = '自制词书 · ' + ids.length + ' 词';
  }

        ${todo.map((w) => `<div class="fill-row" data-fill-row="${esc(w[0])}">
          <div class="fill-w">${esc(w[0])}</div>
          <input class="fb-input fill-i" data-fill-in="${esc(w[0])}" maxlength="40" placeholder="中文释义" style="height:38px;min-height:0" />
          <button class="nb-x" data-fill-del="${esc(w[0])}" aria-label="不要这个">×</button>
        </div>`).join('')}
      </div>
      <button class="btn btn-primary" style="width:100%" data-fill-save="1">保存</button>
      <button class="btn btn-primary ghost" style="width:100%;margin-top:10px" data-fill-online="1">${DICT_ONLINE ? '联网补全剩下的' : '联网补全 · 暂不支持'}</button>
      <button class="btn btn-primary ghost" style="width:100%;margin-top:10px" data-fill-later="1">以后再说</button>
    </div>`;
    document.body.appendChild(mask);

    mask.addEventListener('click', (e) => {
      if (e.target === mask) { mask.remove(); return; }
      if (e.target.closest('[data-fill-later]')) { mask.remove(); return; }
      if (e.target.closest('[data-fill-online]')) {
        if (!DICT_ONLINE) { toast('联网查词暂不支持，先手动填一下'); return; }
        const empty = [];
        mask.querySelectorAll('[data-fill-in]').forEach((inp) => {
          if (!(inp.value || '').trim()) empty.push(inp.getAttribute('data-fill-in'));
        });
        if (!empty.length) { toast('都填好了'); return; }
        const btn = e.target.closest('[data-fill-online]');
        btn.textContent = '查询中…';
        btn.disabled = true;
        dictLookupMany(empty.slice(0, 60), (d, t) => { btn.textContent = '查询中 ' + d + '/' + t; }).then((got) => {
          let n = 0;
          mask.querySelectorAll('[data-fill-in]').forEach((inp) => {
            const w = inp.getAttribute('data-fill-in');
            if (!(inp.value || '').trim() && got[w]) { inp.value = got[w]; n++; }
          });
          btn.textContent = '联网补全剩下的';
          btn.disabled = false;
          toast(n ? '查到 ' + n + ' 个，检查一下再保存' : '没查到，可能网络不通');
        });
        return;
      }
      const del = e.target.closest('[data-fill-del]');
      if (del) {
        const row = del.closest('[data-fill-row]');
        if (row) row.remove();
        return;
      }
      if (e.target.closest('[data-fill-save]')) {
        const alive = {};
        mask.querySelectorAll('[data-fill-row]').forEach((r) => { alive[r.getAttribute('data-fill-row')] = 1; });
        const drop = {};
        todo.forEach((w) => { if (!alive[w[0]]) drop[w[0]] = 1; });
        mask.querySelectorAll('[data-fill-in]').forEach((inp) => {
          const w = inp.getAttribute('data-fill-in');
          const v = (inp.value || '').trim();
          if (!v) return;
          const rec = B.recOf(w);
          if (rec) { rec[3] = [v.slice(0, 40)]; const ex = rec[8]; if (ex && ex.todo) delete ex.todo; }
        });
        const all = loadMyBooks();
        const target = all.filter((x) => x.code === code)[0];
        if (target) {
          target.words = target.words.filter((w) => !drop[w[0]]);
          target.words.forEach((w) => {
            const rec = B.recOf(w[0]);
            if (rec && rec[3] && rec[3].length) w[3] = rec[3];
          });
          // 词全删光了：这本词书直接移除，别留一个 0 词的空壳
          if (!target.words.length) {
            saveMyBooks(all.filter((x) => x.code !== code));
            const arr = window.BBB_BOOKS || [];
            for (let i = arr.length - 1; i >= 0; i--) if (arr[i].code === code) arr.splice(i, 1);
            if (B.state.settings.book === code) B.state.settings.book = (arr[0] || {}).code || 'sat';
            PK.book = B.state.settings.book;
            B.touch(); B.save();
            mask.remove();
            render();
            toast('词都删光了，这本词书已移除');
            return;
          }
          saveMyBooks(all);
          rebuildMyBook(code);
        }
        mask.remove();
        render();
        toast('已保存');
        return;
      }
    });
  }

  /* ---------------- 在线查词 ---------------- */
  // 联网查词总开关：后端（CloudBase 代理）做好后改成 true 即可开放
  const DICT_ONLINE = false;
  const DICT_KEY = 'bbb:dict:v1';
  let dictCache = null;

  function dictLoad() {
    if (dictCache) return dictCache;
    try { dictCache = JSON.parse(localStorage.getItem(DICT_KEY) || '{}') || {}; }
    catch (e) { dictCache = {}; }
    return dictCache;
  }

  function dictPersist() {
    try { localStorage.setItem(DICT_KEY, JSON.stringify(dictCache || {})); } catch (e) { }
  }

  function dictClean(s) {
    const t = String(s || '').replace(/\s+/g, ' ').trim();
    if (!t || t.length > 30) return '';
    if (/MYMEMORY|QUERY LENGTH|INVALID|WARNING/i.test(t)) return '';
    if (!/[\u4e00-\u9fa5]/.test(t)) return '';
    return t.replace(/[。.]$/, '');
  }

  function fetchJSON(url, ms) {
    return new Promise((resolve, reject) => {
      const ctl = window.AbortController ? new AbortController() : null;
      const timer = setTimeout(() => { if (ctl) ctl.abort(); reject(new Error('timeout')); }, ms || 6000);
      fetch(url, ctl ? { signal: ctl.signal } : undefined)
        .then((r) => r.json())
        .then((d) => { clearTimeout(timer); resolve(d); })
        .catch((e) => { clearTimeout(timer); reject(e); });
    });
  }

  // 先 MyMemory，失败再试 Google，都挂了就返回 null（交给人工补）
  function dictLookup(word) {
    const c = dictLoad();
    if (c[word]) return Promise.resolve(c[word]);
    const q = encodeURIComponent(word);
    return fetchJSON('https://api.mymemory.translated.net/get?q=' + q + '&langpair=en|zh-CN', 6000)
      .then((d) => {
        const t = dictClean(d && d.responseData && d.responseData.translatedText);
        if (!t) throw new Error('empty');
        return t;
      })
      .catch(() => fetchJSON('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q=' + q, 6000)
        .then((d) => {
          const t = dictClean(((d && d[0]) || []).map((x) => x[0]).join(''));
          if (!t) throw new Error('empty');
          return t;
        }))
      .then((t) => { c[word] = t; dictPersist(); return t; })
      .catch(() => null);
  }

  // 并发 4 个一批，边查边回调进度
  function dictLookupMany(words, onTick) {
    const out = {};
    let i = 0, done = 0;
    const total = words.length;
    const worker = () => {
      if (i >= total) return Promise.resolve();
      const w = words[i++];
      return dictLookup(w).then((zh) => {
        if (zh) out[w] = zh;
        done++;
        if (onTick) onTick(done, total);
        return worker();
      });
    };
    const arr = [];
    const n = Math.min(4, total);
    for (let k = 0; k < n; k++) arr.push(worker());
    return Promise.all(arr).then(() => out);
  }

  function openImportBookSheet() {
    const mask = document.createElement('div');
    mask.className = 'sheet-mask';
    let plan = null;
    let bookName = '';
    let online = true;

    function body() {
      return `<div class="grab"></div>
        <h3 style="font-size:21px">新建词书</h3>
        <div class="sheet-sub">粘贴单词、整段文章，或者选一个 txt / csv 文件</div>
        <input class="fb-input" id="mbname" maxlength="20" placeholder="词书名，例如「雅思听力生词」" style="height:44px;min-height:0;margin-bottom:10px" value="${esc(bookName)}" />
        <textarea class="fb-input" id="mbtext" placeholder="每行一个词；也可以直接粘贴一段英文文章&#10;想指定释义就写成：abandon，放弃 / 抛弃"></textarea>
        <label class="btn btn-primary ghost" style="width:100%;margin-top:10px;height:42px;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer">
          选一个文件
          <input type="file" id="mbfile" accept=".txt,.md,.csv,text/plain" style="display:none" />
        </label>
        ${DICT_ONLINE
          ? `<label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--sub)">
               <input type="checkbox" id="mbonline" ${online ? 'checked' : ''} style="width:16px;height:16px" />
               联网查词：词库里没有的词，自动查中文意思
             </label>`
          : `<div style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--faint)">
               <span class="pill" style="color:var(--amber);background:var(--amber-soft);border-color:transparent">暂不支持</span>
               联网查词：等后端做好后再开放
             </div>`}
        <div class="fb-meta">支持 txt / md / csv。Word、PDF 请先把文字复制粘贴进上面的框。<br/>词库里有的词会自动补音标和例句；联网查到的只有中文意思，查不到的还能手动补。</div>
        <button class="btn btn-primary" style="width:100%;margin-top:14px" data-mb-parse="1">解析</button>
        <button class="btn btn-primary ghost" style="width:100%;margin-top:10px" data-mb-close="1">取消</button>`;
    }

    function showProgress(done, total) {
      const sheet = mask.querySelector('.sheet');
      if (!sheet) return;
      const p = total ? Math.round((done / total) * 100) : 0;
      sheet.innerHTML = `<div class="grab"></div>
        <h3 style="font-size:21px">正在联网查词…</h3>
        <div class="sheet-sub">${done} / ${total}　词库里没有的词，正在一个个查中文意思</div>
        <div style="height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:16px 0 6px">
          <i style="display:block;height:100%;width:${p}%;background:var(--brand-grad);transition:width .25s"></i>
        </div>
        <div class="fb-meta">网络不通会自动跳过，这些词之后可以手动补</div>`;
    }

    function showPreview() {
      mask.querySelector('.sheet').innerHTML = `<div class="grab"></div>
        <h3 style="font-size:21px">识别到 ${plan.total} 个词</h3>
        <div class="sheet-sub">词库已有 ${plan.hit.length} 个 · 新词 ${plan.fresh.length} 个${plan.skipped ? '（还有 ' + plan.skipped + ' 个没查到释义）' : ''}</div>
        <div class="card tight" style="box-shadow:none;border:1px solid var(--line);margin:12px 0 14px;padding:10px 14px;font-size:12.5px;color:var(--sub);line-height:1.8">
          ${plan.hit.length ? '这些词会直接带上音标、中文释义和例句。<br/>' : ''}${plan.fresh.length ? '新词会建成卡片；没查到释义的，创建后马上让你逐个补，也可以直接删掉。' : ''}
        </div>
        <button class="btn btn-primary" style="width:100%" data-mb-create="1">创建「${esc(bookName || '我的词书')}」</button>
        <button class="btn btn-primary ghost" style="width:100%;margin-top:10px" data-mb-back="1">返回修改</button>`;
    }

    mask.innerHTML = `<div class="sheet">${body()}</div>`;
    document.body.appendChild(mask);

    mask.addEventListener('change', (e) => {
      if (e.target && e.target.id === 'mbonline') { online = !!e.target.checked; return; }
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        const ta = mask.querySelector('#mbtext');
        ta.value = String(r.result || '').slice(0, 200000);
        toast('已读入 ' + f.name);
      };
      r.readAsText(f);
    });

    mask.addEventListener('click', (e) => {
      if (e.target === mask) { mask.remove(); return; }
      if (e.target.closest('[data-mb-close]')) { mask.remove(); return; }

      if (e.target.closest('[data-mb-parse]')) {
        const ta = mask.querySelector('#mbtext');
        const nm = mask.querySelector('#mbname');
        bookName = (nm.value || '').trim();
        const text = (ta.value || '').trim();
        if (!text) { toast('先粘点内容进来'); ta.focus(); return; }
        plan = mbAnalyze(text);
        if (!plan.hit.length && !plan.fresh.length) { toast('没认出英文单词，换段文字试试'); return; }

        const todo = plan.fresh.filter((r) => !r[3].length).map((r) => r[0]).slice(0, 60);
        if (DICT_ONLINE && online && todo.length) {
          showProgress(0, todo.length);
          dictLookupMany(todo, showProgress).then((got) => {
            let n = 0;
            plan.fresh.forEach((r) => {
              if (!r[3].length && got[r[0]]) { r[3] = [got[r[0]]]; r[8] = { online: 1 }; n++; }
            });
            plan.skipped = plan.fresh.filter((r) => !r[3].length).length;
            if (n) plan.onlineN = n;
            showPreview();
          });
          return;
        }
        showPreview();
        return;
      }

      if (e.target.closest('[data-mb-back]')) {
        mask.querySelector('.sheet').innerHTML = body();
        return;
      }

      if (e.target.closest('[data-mb-create]')) {
        if (!plan || (!plan.hit.length && !plan.fresh.length)) return;
        const code = 'my' + Date.now().toString(36);
        const name = (bookName || '我的词书').slice(0, 20);
        const words = plan.hit.map((i) => W()[i]).concat(plan.fresh);
        const list = loadMyBooks();
        if (!saveMyBooks(list.concat([{ code: code, name: name, createdAt: Date.now(), words: words }]))) return;
        installMyBooks();
        B.state.settings.book = code;
        PK.book = code;
        PK.level = '全部';
        B.touch(); B.save();
        mask.remove();
        location.hash = '#/books';
        render();
        toast('已创建「' + name + '」 · ' + words.length + ' 词');
        if (plan.skipped) setTimeout(() => openFillSheet(code), 260);
        return;
      }
    });
  }

  /* ---------------- 自制词书：改名 / 加词 ---------------- */
  function renameMyBook(code) {
    const mb = loadMyBooks().filter((x) => x.code === code)[0];
    if (!mb) return;
    const name = prompt('给这本词书起个新名字', mb.name || '');
    if (name === null) return;
    const clean = String(name).trim().slice(0, 20);
    if (!clean) { toast('名字不能为空'); return; }
    const all = loadMyBooks().map((x) => (x.code === code ? Object.assign({}, x, { name: clean }) : x));
    saveMyBooks(all);
    const bk = (window.BBB_BOOKS || []).filter((b) => b.code === code)[0];
    if (bk) bk.name = clean;
    render();
    toast('已改名为「' + clean + '」');
  }

  function addWordsToBook(code, text) {
    const mb = loadMyBooks().filter((x) => x.code === code)[0];
    if (!mb) return 0;
    const plan = mbAnalyze(text);
    const have = {};
    (mb.words || []).forEach((w) => { have[mbNorm(w[0])] = 1; });
    let added = 0;
    const push = (rec) => {
      const k = mbNorm(rec[0]);
      if (!k || have[k]) return;
      have[k] = 1;
      mb.words.push(rec);
      added++;
    };
    plan.hit.forEach((i) => push(W()[i]));
    const WD = window.BBB_WORDS || [];
    plan.fresh.forEach((rec) => { push(rec); });
    // 新词条要真的进词库，否则索引不到
    (mb.words || []).forEach((w) => {
      if (!B.recOf(w[0])) WD.push(w);
    });
    const all = loadMyBooks().map((x) => (x.code === code ? mb : x));
    saveMyBooks(all);
    rebuildMyBook(code);
    return added;
  }

  function openAddWordsSheet(code) {
    const mask = document.createElement('div');
    mask.className = 'sheet-mask';
    mask.innerHTML = `<div class="sheet">
      <div class="grab"></div>
      <h3 style="font-size:21px">加词</h3>
      <div class="sheet-sub">每行一个词，也可以直接粘贴一段文章；写「word 中文」可以指定释义</div>
      <textarea class="fb-input" id="awtext" placeholder="abandon&#10;zeitgeist 时代精神&#10;或者直接粘一段英文"></textarea>
      <button class="btn btn-primary" style="width:100%;margin-top:14px" data-aw-save="1">加进词书</button>
      <button class="btn btn-primary ghost" style="width:100%;margin-top:10px" data-aw-cancel="1">取消</button>
    </div>`;
    document.body.appendChild(mask);
    mask.addEventListener('click', (e) => {
      if (e.target === mask || e.target.closest('[data-aw-cancel]')) { mask.remove(); return; }
      if (e.target.closest('[data-aw-save]')) {
        const txt = (mask.querySelector('#awtext').value || '').trim();
        if (!txt) { toast('先写点词'); return; }
        const n = addWordsToBook(code, txt);
        mask.remove();
        render();
        toast(n ? '加了 ' + n + ' 个词' : '这些词都已经在里面了');
      }
    });
    setTimeout(() => { const t = mask.querySelector('#awtext'); if (t) t.focus(); }, 90);
  }

  /* ---------------- 启动 ---------------- */
  function boot() {
    if (!W().length) {
      app.innerHTML = '<div class="card"><p style="margin:0;color:var(--red)">词库数据未加载，请确认 data/words.js 存在。</p></div>';
      return;
    }
    B.load();
    try { installMyBooks(); } catch (e) { console.warn('自制词书加载失败', e); }
    B.installFlush();
    curveRangeInit();
    // 今天第一次打开就留一份快照，别等用户先操作
    if (Object.keys(B.state.words).length) B.makeSnapshot('auto');

    const qp = new URLSearchParams(location.search);
    if (qp.get('theme')) B.state.settings.theme = qp.get('theme');
    if (qp.get('demo') === '1' && !Object.keys(B.state.words).length) seedDemo();

    PK.book = B.state.settings.book;
    PK.size = B.state.settings.sessionSize;
    PK.order = B.state.settings.order;
    PK.onlyNew = B.state.settings.onlyNew;

    applyTheme();
    if (tabbar) tabbar.hidden = false;

    if (qp.get('go')) {
      const g = qp.get('go');
      if (g === 'study') startDaily();
      location.hash = '#/' + g;
    }
    if (!location.hash) location.hash = '#/home';
    render();

    if (qp.get('list') !== null && qp.get('list') !== undefined) {
      const gi = parseInt(qp.get('list'), 10);
      setTimeout(() => { try { openListSheet(isNaN(gi) ? 0 : gi); } catch (e) { } }, 250);
    }

    // 纯本地版：不连接任何服务器，进度只写 localStorage
    // 每日提醒：每分钟看一次是否到点（页面开着就有效），切回前台也补查一次
    checkRemind();
    setInterval(checkRemind, 60000);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) { checkRemind(); updateTitle(); }
    });
  }

  function seedDemo() {
    const bk = B.book();
    const now = Date.now();
    B.bookWordIdx(bk.code).slice(0, 320).forEach((ix) => {
      const w = W()[ix][0];
      const d = 0.4 + Math.random() * 25;
      B.state.words[w] = {
        st: d >= 21 ? 3 : 2,
        e: 2.3 + Math.random() * 0.5,
        i: d,
        d: now + d * 86400000 * (Math.random() < 0.3 ? -0.2 : 1),
        r: 2 + Math.floor(Math.random() * 6),
        l: Math.floor(Math.random() * 2),
        seen: 3 + Math.floor(Math.random() * 8),
        u: now - Math.floor(Math.random() * 20) * 86400000,
      };
    });
    for (let i = 1; i <= 24; i++) {
      const dt = new Date();
      dt.setDate(dt.getDate() - i);
      if (Math.random() < 0.8) B.state.logs[B.dayKey(dt.getTime())] = {
        n: Math.floor(Math.random() * 22), r: Math.floor(Math.random() * 30),
        ok: 10 + Math.floor(Math.random() * 30), bad: Math.floor(Math.random() * 8),
      };
    }
    B.state.lastList = { book: bk.code, gi: 3 };
    B.saveNow();
  }

  window.addEventListener('hashchange', () => {
    const r = currentRoute();
    if (r !== 'study' && S.active) { persistSession(); S.active = false; }
    closeSheets();
    render();
    window.scrollTo(0, 0);
    if (r === 'study') setTimeout(maybeAutoAudio, 60);
  });

  // 调试/自动化测试用的只读入口，正常使用不会触发
  window.BBBDebug = {
    quiz: () => S.quiz,
    session: () => S,
    settings: () => B.state.settings,
    due: () => B.dueWordsAll(),
    remind: () => checkRemind(),
    startDrill: (words, opts) => startDrill(words, opts),
    startReviewQuiz: (words, opts) => startReviewQuiz(words, opts),
    openImportSheet: (d) => openImportSheet(d),
    openSnapshotSheet: () => openSnapshotSheet(),
  };

  boot();
})();

</script>

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
