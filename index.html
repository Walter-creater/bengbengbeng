<script data-src="assets/app.js">
/* bengbengbeng · 应用主逻辑 */
(function () {
  'use strict';

  const B = window.BBB;
  const AUD = window.BBBAudio;
  const RT = window.BBBRoots;
  const W = () => window.BBB_WORDS || [];

  const app = document.getElementById('app');
  const tabbar = document.getElementById('tabbar');
  const toastEl = document.getElementById('toast');

  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));

  const BOOK_MARK = { sat: 'S', cet4: '四', toefl: '托', ielts: '雅' };
  const BOOK_SHORT = { sat: 'SAT', cet4: '四级', toefl: '托福', ielts: '雅思' };
  const BOOK_TONE = { toefl: 't', cet4: 'c', ielts: 'i' };

  // 拼写输入框的输入法属性：允许联想时放开，禁止时全部关掉
  function imeAttr() {
    return B.state.settings.imeSuggest
      ? 'autocomplete="on" autocapitalize="sentences" autocorrect="on" spellcheck="true"'
      : 'autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"';
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  let toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('on'), 1800);
  }

  const recOf = (w) => B.recOf(w);

  function splitDefs(defs) {
    const out = [];
    (defs || []).forEach((d) => {
      const m = String(d).match(/^([a-z]{1,5}\.(?:\s*[/&]\s*[a-z]{1,5}\.)?)\s*([\s\S]+)$/i);
      if (m) out.push({ pos: m[1].toLowerCase(), text: m[2] });
      else out.push({ pos: '', text: d });
    });
    return out;
  }

  function highlight(sentence, word) {
    const s = esc(sentence);
    if (!word) return s;
    try {
      const re = new RegExp('\\b(' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\w{0,4})\\b', 'gi');
      return s.replace(re, '<b>$1</b>');
    } catch (e) { return s; }
  }

  function greeting() {
    const h = new Date().getHours();
    if (h < 5) return '夜深了';
    if (h < 11) return '早上好';
    if (h < 14) return '中午好';
    if (h < 18) return '下午好';
    return '晚上好';
  }

  const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);

  // dailyReview = 0 表示不限量
  function reviewCap() {
    const v = Number(B.state.settings.dailyReview);
    return v > 0 ? v : 1e9;
  }

  /* ---------------- 主题 ---------------- */
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  function applyTheme() {
    const t = B.state.settings.theme;
    const dark = t === 'dark' || (t === 'auto' && mq.matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#12151C' : '#F2F4F9');
    applyScale();
  }

  function applyScale() {
    const s = Number(B.state.settings.cardScale) || 1;
    document.documentElement.style.setProperty('--card-scale', s);
  }

  if (mq.addEventListener) mq.addEventListener('change', applyTheme);
  if (mq.addListener) mq.addListener(applyTheme);

  // 存储写入失败（隐私模式 / 配额）时给用户一次明确提示，而不是静默丢数据
  window.__bbbStorageError = function () {
    toast('浏览器存储不可用，进度可能无法保存');
  };

  /* ---------------- 学习会话 ---------------- */
  const S = {
    queue: [], i: 0, flipped: false, mode: 'read',
    book: 'sat', gi: -1, title: '', kind: 'list',
    stat: { fresh: 0, reviewed: 0, again: 0, hard: 0, good: 0 },
    active: false, done: false, typed: '', checked: false, ok: false, near: false, panel: '',
  };

  function resetSession() {
    S.i = 0; S.flipped = false; S.typed = ''; S.checked = false; S.ok = false; S.near = false; S.panel = '';
    S.stat = { fresh: 0, reviewed: 0, again: 0, hard: 0, good: 0 };
  }

  // 队列进度写进 state，退出/切页/刷新后还能接着背
  function persistSession() {
    if (!S.active || !S.queue.length) return;
    B.setPending({
      queue: S.queue, i: S.i, book: S.book, gi: S.gi,
      title: S.title, kind: S.kind, mode: S.mode, stat: S.stat,
    });
  }

  function goStudy() {
    if (!S.queue.length) { toast('这一组没有可背的词了'); return; }
    S.active = true; S.done = false;
    S.mode = B.state.settings.mode;
    persistSession();
    if (location.hash === '#/study') { render(); maybeAutoAudio(); }
    else location.hash = '#/study';
  }

  // 定期回顾：把很久以前学过、还没到期复习的词捞出来过一遍
  function startLongReview() {
    const list = B.longDue();
    if (!list.length) { toast('暂时没有需要回顾的词'); return; }
    B.markLongReview();      // 先记时间，避免关掉页面后又弹一次
    startReviewQuiz(list, { book: B.state.settings.book, title: '旧词回顾' });
  }

  function resumeSession() {
    const p = B.state.pending;
    if (!p) return false;
    S.queue = p.queue.slice();
    S.i = Math.min(p.i, S.queue.length - 1);
    S.book = p.book; S.gi = p.gi; S.title = p.title; S.kind = p.kind;
    S.mode = p.mode || B.state.settings.mode;
    S.stat = p.stat || { fresh: 0, reviewed: 0, again: 0, hard: 0, good: 0 };
    S.flipped = false; S.typed = ''; S.checked = false; S.ok = false; S.panel = '';
    S.done = false;
    S.active = true;
    goStudy();
    return true;
  }

  function startList(bookCode, gi, size, order, onlyNew) {
    const g = B.group(bookCode, gi);
    if (!g) return;
    let words = g.w.map((i) => W()[i][0]);
    const before = words.length;
    if (onlyNew) words = words.filter((w) => { const c = B.state.words[w]; return !c || c.st === 0; });
    if (order === 'random') {
      for (let i = words.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = words[i]; words[i] = words[j]; words[j] = t;
      }
    }
    if (size > 0) words = words.slice(0, size);
    if (!words.length) {
      toast(onlyNew && before ? '这一组都学过了，可关掉「只背未学」' : '这一组没有词');
      return;
    }
    // 全是没学过的新词 → 走「10 词一组 · 三轮抽查」
    if (B.state.settings.drillNew && words.length >= 2 &&
      words.every((w) => !B.state.words[w] || B.state.words[w].st === 0)) {
      B.state.lastList = { book: bookCode, gi: gi };
      B.save();
      startDrill(words, { book: bookCode, gi: gi, title: g.t });
      return;
    }
    S.queue = words;
    S.book = bookCode;
    S.gi = gi;
    S.title = g.t;
    S.kind = 'list';
    resetSession();
    B.state.lastList = { book: bookCode, gi: gi };
    B.save();
    goStudy();
  }

  // 随手记：先收到期的词，不够再补新词；单程过一遍，随时退出都不丢
  function startQuick(n) {
    if (!n || n < 1) return;
    const st = B.state.settings;
    const due = B.dueWordsAll().slice(0, n);
    const nw = due.length < n ? B.newWords(n - due.length, st.book) : [];
    const pool = due.concat(nw);
    if (!pool.length) {
      toast('这本词书已经背完了，去「词书」换一本吧');
      return;
    }
    S.queue = pool;
    S.book = st.book;
    S.gi = -1;
    S.kind = 'quick';
    S.title = due.length && nw.length ? '随手记 · ' + due.length + ' 复习 + ' + nw.length + ' 新词'
      : due.length ? '随手记 · ' + due.length + ' 个复习词'
        : '随手记 · ' + nw.length + ' 个新词';
    resetSession();
    S.quickN = n;
    S.stat.reviewed = due.length;
    goStudy();
  }

  // limit: 不传 = 今日任务；>0 = 本次只背 N 个；0 = 全部（复习部分不受今日上限约束）
  // 自定义数量只作用于这一次会话，不写回 dailyNew / dailyReview
  function startDaily(only, limit) {
    const st = B.state.settings;
    const tc = B.todayCounts();
    const newLeft = Math.max(0, st.dailyNew - tc.newDone);
    let reviewLimit = Math.max(0, reviewCap() - tc.reviewDone);

    let due = B.dueWordsAll();
    let nw = B.newWords(newLeft);
    if (only === 'review') { nw = []; }
    else if (only === 'new') { due = []; }

    const custom = typeof limit === 'number' && isFinite(limit);
    if (custom && limit === 0) {
      // 全部：到期词一条不落，仍不动每日目标
      reviewLimit = due.length;
      const all = due.length + nw.length;
      if (all > 300 && !confirm('这次要背 ' + all + ' 个词，确定吗？')) return;
    } else if (custom) {
      due = due.slice(0, Math.min(reviewLimit, limit));
      const rest = limit - due.length;
      nw = rest > 0 ? nw.slice(0, Math.min(nw.length, rest)) : [];
      reviewLimit = due.length;
    } else {
      due = due.slice(0, reviewLimit);
    }

    // 复习走四选一（百词斩式），新词跟在后面走三轮抽查
    if (due.length && st.reviewQuiz) {
      if (st.drillNew) { startReviewQuiz(due, { book: st.book, title: '今日复习', chain: nw }); return; }
      if (!nw.length) { startReviewQuiz(due, { book: st.book, title: '今日复习' }); return; }
      // 四选一开着但新词精学关着、且今天还有新词 → 落到老混合流程，别把新词吞了
    }
    if (!due.length && nw.length && st.drillNew) {
      startDrill(nw, { book: st.book, title: '今日新词' });
      return;
    }

    S.queue = due.concat(nw);
    S.book = st.book;
    S.gi = -1;
    S.kind = only === 'review' ? 'review' : 'daily';
    S.title = only === 'review' ? '今日复习'
      : custom ? (limit === 0 ? '今日任务 · 全部' : '今日任务 · 只背 ' + limit + ' 个')
        : '今日任务';
    resetSession();
    S.stat.reviewed = due.length;
    if (!S.queue.length) {
      toast(reviewLimit <= 0 && only === 'review' ? '今天的复习量已达上限，可在设置里调高' : '今天没有待办，去词书里选一组吧');

    return `

            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

      <div class="sec-title">
        <h2>记忆曲线</h2>
        ${mem.learned ? `<div class="seg-mini sm">${RANGES.map((rg) => `<button data-curve="${rg.d}" class="${curveRange === rg.d ? 'on' : ''}">${rg.label}</button>`).join('')}</div>` : ''}
      </div>
      ${mem.learned ? `<div class="card curve-card">
        ${curveSvg(mem)}
        <div class="curve-cap">${mem.cfg.tail}：按计划 <b>${Math.round(mem.last * 100)}%</b>，不复习 <b>${Math.round(mem.naturalLast * 100)}%</b></div>
      </div>` : `<div class="card curve-empty">
        <div class="ce-top">
          <div class="ce-emoji">🌱</div>
          <div>
            <div class="ce-t">还没有开始背</div>
            <div class="ce-s">先背第一组，这里就会长出你自己的记忆曲线</div>
          </div>
        </div>
        <div class="ce-steps">
          <div class="ce-step"><b>今天</b><span>记 20 个词</span></div>
          <div class="ce-step"><b>第 2 天</b><span>回来复习</span></div>

      <div class="sec-title"><h2>词书</h2><a class="link" href="#/books">全部 List ›</a></div>
      <div class="card tight">
        ${B.books().map((bk2) => {
      const cc = B.counts(bk2.code);
      return `<div class="lib-row" data-setbook="${bk2.code}">
            <div class="lib-mark ${BOOK_TONE[bk2.code] || ''}">${BOOK_MARK[bk2.code] || '词'}</div>
            <div class="lib-info">
              <div class="n">${esc(bk2.name)} ${bk2.code === st.book ? '<span class="pill brand" style="height:18px;font-size:10px">默认</span>' : ''}<small>${cc.total} 词 · ${bk2.groups.length} 个 List</small></div>
              <div class="p"><i style="width:${pct(cc.learned, cc.total)}%"></i></div>
            </div>
            <div class="lib-pct">${cc.learned}/${cc.total}</div>
          </div>`;
    }).join('')}
      </div>
      <div class="fb-entry"><button data-act="feedback">用着有问题？反馈一下</button></div>
      <div style="text-align:center;color:var(--faint);font-size:11px;line-height:1.7;margin:18px 0 4px">
        共 ${W().length} 个词条 · 音标来自词表与词典 · 发音为有道词典真人录音
      </div>`;
  }

  /* ---------------- 记忆曲线：按真实词卡推算一段时间的保持率 ---------------- */
  // 遗忘用幂函数 R = 1 / (1 + Δt / (9·S))，S = 这个词当前的间隔；
  // 到期那天刚好落到 ~90%，和「到点该复习」的调度是同一套语言。
  const RANGES = [
    {
      d: 1, label: '1 天', step: 1 / 24, tail: '24 小时后',
      ticks: [[0, '现在'], [0.25, '6h'], [0.5, '12h'], [1, '24h']],
    },
    {
      d: 7, label: '1 周', step: 1 / 4, tail: '7 天后',
      ticks: [[0, '今天'], [2, '+2 天'], [4, '+4 天'], [7, '+7 天']],
    },
    {
      d: 30, label: '1 月', step: 1 / 2, tail: '30 天后',
      ticks: [[0, '今天'], [7, '+7 天'], [14, '+14 天'], [30, '+30 天']],
    },
  ];
  let curveRange = 7;

  function rangeCfg(d) {
    for (let i = 0; i < RANGES.length; i++) if (RANGES[i].d === d) return RANGES[i];
    return RANGES[1];
  }

  function curveRangeInit() {
    try {
      const v = parseInt(localStorage.getItem('bbb:curve-range'), 10);
      if (v === 1 || v === 7 || v === 30) curveRange = v;
    } catch (e) { }
  }

  function setCurveRange(d) {
    if (d !== 1 && d !== 7 && d !== 30) return;
    curveRange = d;
    try { localStorage.setItem('bbb:curve-range', String(d)); } catch (e) { }
    render();
  }

  let curveCache = { rev: -1, range: 0, data: null };

  // FSRS-4.5 的遗忘曲线：R = (1 + FACTOR · t / S) ^ DECAY
  //   t = 距上次复习的天数，S = 该词当前稳定度；t = S 时正好 0.9，
  //   和 SM-2 / Anki / FSRS 共用的「到点保持率 90%」是同一个约定。
  const FSRS_FACTOR = 19 / 81;
  const FSRS_DECAY = -0.5;
  function recall(t, S) {
    return Math.pow(1 + FSRS_FACTOR * Math.max(0, t) / Math.max(0.1, S), FSRS_DECAY);
  }

  function memoryProjection(days) {
    const cfg = rangeCfg(days || curveRange);
    const rev = B.state.rev;
    if (curveCache.rev === rev && curveCache.range === cfg.d && curveCache.data) return curveCache.data;

    const DAY = 86400000;
    const CAP = 180;
    const now = Date.now();
    const steps = Math.round(cfg.d / cfg.step);
    const planned = new Array(steps + 1).fill(0);
    const natural = new Array(steps + 1).fill(0);
    const events = [];
    let learned = 0, nowSum = 0;

    for (const w in B.state.words) {
      const c = B.state.words[w];
      if (!c || !c.st) continue;                                 // 没学过的词不参与
      learned++;

      const S0 = Math.max(0.7, c.i || 1);                        // 当前稳定度（天）
      const ease = Math.min(3.2, Math.max(1.3, c.e || 2.5));     // 熟练度系数
      const since = Math.max(0, (now - (c.u || now)) / DAY);     // 距上次复习
      const due = Math.max(0, (c.d - now) / DAY);                // 距下次复习
      nowSum += recall(since, S0);

      // 未来的复习节点：到期日，之后间隔按熟练度继续拉长
      const bounds = [0];
      const stab = [S0];
      let t = due;
      while (t <= cfg.d && bounds.length < 60) {
        const s2 = Math.min(CAP, Math.max(1, stab[stab.length - 1] * ease));
        bounds.push(t);
        stab.push(s2);
        if (t > 0.001) events.push(t);
        t += s2;
      }
      bounds.push(Infinity);
      stab.push(stab[stab.length - 1]);

      for (let k = 0; k <= steps; k++) {
        const day = k * cfg.step;
        let seg = 0;
        while (seg + 1 < bounds.length && day >= bounds[seg + 1]) seg++;
        const elapsed = since + (day - bounds[seg]);
        planned[k] += recall(elapsed, stab[seg]);
        natural[k] += recall(since + day, S0);
      }
    }

    events.sort((a, b) => a - b);
    const data = {
      cfg: cfg,
      learned: learned,
      events: events,
      planned: learned ? planned.map((v) => v / learned) : null,
      natural: learned ? natural.map((v) => v / learned) : null,
      today: learned ? nowSum / learned : 0,                     // 此刻的真实保持率
      last: learned ? planned[steps] / learned : 0,
      naturalLast: learned ? natural[steps] / learned : 0,
    };
    if (learned) data.planned[0] = data.today;                   // 左端点画「现在」，不是「复习后」
    curveCache = { rev: rev, range: cfg.d, data: data };
    return data;
  }

  function curveSvg(p) {
    p = p || memoryProjection();
    if (!p.learned) return '<div class="curve-none">还没有学过的词</div>';

    const cfg = p.cfg;
    const W = 322, H = 150;
    const x0 = 34, x1 = 262, yTop = 16, yBase = 110;

    const steps = Math.round(cfg.d / cfg.step);
    let lo = 1;
    for (let k = 0; k <= steps; k++) lo = Math.min(lo, p.planned[k], p.natural[k]);
    const yMin = Math.max(0, Math.min(0.88, Math.floor(lo * 10) / 10 - 0.04));
    const mid = yMin < 0.42 ? 0.5 : Math.round(((yMin + 1) / 2) * 20) / 20;

    const X = (day) => x0 + (day / cfg.d) * (x1 - x0);
    const Y = (v) => yBase - ((Math.max(yMin, Math.min(1, v)) - yMin) / (1 - yMin)) * (yBase - yTop);
    const f1 = (n) => n.toFixed(1);

    // 估算文字宽度：给标注做一个刚好包住的气泡，比白描边干净
    const tw = (str, size) => {
      let w = 0;
      for (let i = 0; i < str.length; i++) {
        const ch = str[i];
        if (/[\u4e00-\u9fff]/.test(ch)) w += size;
        else if (ch === ' ') w += size * 0.32;
        else if (/[0-9]/.test(ch)) w += size * 0.56;
        else if (ch === '%') w += size * 0.7;
        else if (ch === '.') w += size * 0.3;
        else w += size * 0.55;
      }
      return w;
    };
    // 纵向居中于 cy 的小气泡
    const chip = (x, cy, text, color, bg) => {
      const w = tw(text, 8.5) + 11;
      return '<g><rect x="' + f1(x) + '" y="' + f1(cy - 7.5) + '" width="' + f1(w) + '" height="15" rx="5.5"'
        + ' fill="' + bg + '" stroke="' + color + '" stroke-opacity=".26" stroke-width="1"/>'
        + '<text x="' + f1(x + 5.5) + '" y="' + f1(cy + 3) + '" font-size="8.5" font-weight="600" fill="' + color + '">' + text + '</text></g>';
    };

    let dPlanned = '', dNatural = '';
    for (let k = 0; k <= steps; k++) {
      const x = f1(X(k * cfg.step));
      dPlanned += (k ? ' L' : 'M') + x + ' ' + f1(Y(p.planned[k]));
      dNatural += (k ? ' L' : 'M') + x + ' ' + f1(Y(p.natural[k]));
    }

    const dots = [];
    let lastX = x0 + 16, firstDot = null;
    for (let i = 0; i < p.events.length && dots.length < 9; i++) {
      const ev = p.events[i];
      const xi = X(ev);
      if (xi - lastX < 26) continue;
      lastX = xi;
      const k = Math.min(steps, Math.round(ev / cfg.step));
      const yi = Y(p.planned[k]);
      dots.push('<circle cx="' + f1(xi) + '" cy="' + f1(yi) + '" r="3.2" fill="var(--surface)" stroke="var(--green)" stroke-width="1.7"/>');
      if (!firstDot && xi > x0 + 52 && xi < x1 - 46) firstDot = [xi, yi];
    }

    const yP = Y(p.planned[steps]);
    const yN = Y(p.natural[steps]);
    let lp = yP, ln = yN;
    if (Math.abs(lp - ln) < 13) {
      const c = (lp + ln) / 2;
      lp = c - 6.5;
      ln = c + 6.5;
    }

    const yTicks = [[1, yTop]];
    if (Math.abs(Y(mid) - yTop) > 11 && Math.abs(Y(mid) - yBase) > 11) yTicks.push([mid, Y(mid)]);
    yTicks.push([yMin, yBase]);
    const yLabels = yTicks.map(([v, y]) =>
      '<text x="' + (x0 - 7) + '" y="' + f1(y + 3) + '" font-size="8.5" fill="#9AA4B2" text-anchor="end"'
      + ' style="font-variant-numeric:tabular-nums">' + Math.round(v * 100) + '%</text>').join('');

    const ticks = cfg.ticks.map(([d, t], idx) => {
      const anchor = idx === 0 ? 'start' : idx === cfg.ticks.length - 1 ? 'end' : 'middle';
      return '<text x="' + f1(X(d)) + '" y="' + (H - 8) + '" font-size="9" fill="#9AA4B2" text-anchor="' + anchor + '">' + t + '</text>';
    }).join('');

    const nowChip = chip(x0 + 8, Math.max(yTop + 12, Y(p.today) - 12), '现在 ' + Math.round(p.today * 100) + '%', '#D98A12', 'var(--amber-soft)');
    const reviewChip = firstDot
      ? chip(Math.min(firstDot[0] + 7, x1 - 40), Math.min(yBase - 12, firstDot[1] + 13), '复习', '#1E9C63', 'var(--green-soft)')
      : '';

    return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      <defs>
        <linearGradient id="mcg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#4C5FD5" stop-opacity=".22"/><stop offset="1" stop-color="#4C5FD5" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="mgl" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#5B6BE0"/><stop offset="1" stop-color="#4051C4"/>
        </linearGradient>
      </defs>

      <line x1="${x0}" y1="${yBase}" x2="${x1}" y2="${yBase}" stroke="var(--line)" stroke-width="1.4"/>
      <line x1="${x0}" y1="${f1(Y(mid))}" x2="${x1}" y2="${f1(Y(mid))}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 5"/>
      ${yLabels}

      <path d="${dPlanned} L${x1} ${yBase} L${x0} ${yBase} Z" fill="url(#mcg)"/>
      <path d="${dNatural}" fill="none" stroke="#9AA4B2" stroke-width="1.5" stroke-dasharray="5 4" opacity=".55" stroke-linecap="round"/>
      <path d="${dPlanned}" fill="none" stroke="url(#mgl)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots.join('')}

      <circle cx="${x0}" cy="${f1(Y(p.today))}" r="9" fill="#EF9A21" opacity=".14"/>
      <circle cx="${x0}" cy="${f1(Y(p.today))}" r="4.2" fill="#EF9A21"/>
      <circle cx="${x0}" cy="${f1(Y(p.today))}" r="1.6" fill="#fff"/>
      ${nowChip}
      ${reviewChip}

      <text x="${x1 + 8}" y="${f1(lp + 3)}" font-size="9" font-weight="600" fill="var(--brand)" letter-spacing=".2">按计划</text>
      <text x="${x1 + 8}" y="${f1(ln + 3)}" font-size="9" fill="#8B95A6" letter-spacing=".2">不复习</text>

      ${ticks}
    </svg>`;
  }

  /* ---------------- 词书 / List ---------------- */
  const PK = { book: 'sat', level: '全部', size: 20, order: 'book', onlyNew: true };

  function viewBooks() {
    PK.book = PK.book || B.state.settings.book;
    const bk = B.book(PK.book);
    const levels = [];
    bk.groups.forEach((g) => { if (g.lv && levels.indexOf(g.lv) < 0) levels.push(g.lv); });
    const list = bk.groups.map((g, gi) => ({ g: g, gi: gi })).filter((x) => PK.level === '全部' || x.g.lv === PK.level);
    const cc = B.counts(PK.book);
    const todoN = bk.mine ? B.bookWordIdx(PK.book).filter((i) => !W()[i][3] || !W()[i][3].length).length : 0;

    return `
      <div class="topbar">
        <div class="brand"><b>词书</b><span>${esc(bk.name)} ${cc.total} 词</span></div>
        <div style="display:flex;gap:8px">
          <button class="icon-btn" data-act="newbook" aria-label="新建词书" title="新建词书">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="icon-btn" data-act="search" aria-label="搜索">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          </button>
        </div>
      </div>

      <div class="booktabs">
        ${B.books().map((x) => `<button data-pkbook="${x.code}" class="${x.code === PK.book ? 'on' : ''}">
          <b>${esc(x.name)}</b><small>${x.groups.length} 个 List</small>
        </button>`).join('')}
      </div>
      <div class="book-sub">${esc(bk.sub)}${bk.mine ? ' · <button data-renamebook="1" style="color:var(--brand);text-decoration:underline">改名</button> · <button data-addwords="1" style="color:var(--brand);text-decoration:underline">加词</button> · <button data-delbook="1" style="color:var(--red);text-decoration:underline">删除这本</button>' : ''}</div>
      ${bk.mine && todoN ? `<div class="card tight" style="padding:11px 14px;margin:0 0 12px;border-color:var(--amber-soft)" data-act="fillbook">
        <div style="font-size:13px;font-weight:600;color:var(--amber)">还有 ${todoN} 个词没释义</div>
        <div style="font-size:11.5px;color:var(--faint);margin-top:2px">点这里补上，或者把它们删掉</div>
      </div>` : ''}

      ${levels.length > 1 ? `<div class="chips">
        ${['全部'].concat(levels).map((l) => `<button data-pklevel="${esc(l)}" class="${PK.level === l ? 'on' : ''}">${esc(l)}</button>`).join('')}
      </div>` : ''}

      <div class="lgrid">
        ${list.map((x) => {
      const st = B.groupStats(PK.book, x.gi);
      const p = pct(st.learned, st.total);
      return `<button class="lcard" data-openlist="${x.gi}">
          <div class="lc-head">
            <span class="lc-name">${esc(x.g.t)}</span>
            ${st.due ? `<span class="lc-due">复习 ${st.due}</span>` : ''}
          </div>
          <div class="lc-count">${st.total} 词 · 已学 ${st.learned}</div>
          <div class="lc-bar"><i style="width:${p}%"></i></div>
          <div class="lc-foot"><span>${p}%${st.mature ? ' · 掌握 ' + st.mature : ''}</span><span class="lc-go">开始 ›</span></div>
        </button>`;
    }).join('')}
      </div>
      ${list.length ? '' : '<div class="empty">这个级别还没有 List</div>'}
    `;
  }

  function openListSheet(gi) {
    const g = B.group(PK.book, gi);
    if (!g) return;
    const st = B.groupStats(PK.book, gi);
    const sizes = [10, 20, 30, 50, 0];
    const remaining = g.w.filter((i) => { const c = B.state.words[W()[i][0]]; return !c || c.st === 0; }).length;
    const pool = PK.onlyNew ? remaining : g.w.length;
    const willDo = PK.size === 0 ? pool : Math.min(PK.size, pool);

    const mask = document.createElement('div');
    mask.className = 'sheet-mask';
    mask.innerHTML = `<div class="sheet">
      <div class="grab"></div>
      <h3 style="font-size:22px">${esc(g.t)}</h3>
      <div class="sheet-sub">${g.w.length} 词 · 已学 ${st.learned} · 已掌握 ${st.mature}${st.due ? ' · <b style="color:var(--amber)">待复习 ' + st.due + '</b>' : ''}</div>

      <div class="opt-group">
        <div class="opt-lb">本次背多少词 <span>${PK.onlyNew ? '未学 ' + remaining : '全组 ' + g.w.length}</span></div>
        <div class="opt-row">
          ${sizes.map((n) => `<button data-size="${n}" class="opt ${PK.size === n ? 'on' : ''}">${n === 0 ? '全部' : n}</button>`).join('')}
        </div>
      </div>

      <div class="opt-group">
        <div class="opt-lb">顺序</div>
        <div class="opt-row">
          <button data-order="book" class="opt wide ${PK.order === 'book' ? 'on' : ''}">按书上的顺序</button>
          <button data-order="random" class="opt wide ${PK.order === 'random' ? 'on' : ''}">随机打乱</button>
        </div>
      </div>

      <div class="opt-group row-inline">
        <div class="opt-lb" style="margin:0">只背还没学过的 <span>学过的自动跳过</span></div>
        <div class="switch ${PK.onlyNew ? 'on' : ''}" data-toggle-new><i></i></div>
      </div>

      <button class="btn btn-primary" style="width:100%;margin-top:6px" data-start-list="${gi}" ${willDo ? '' : 'disabled'}>
        ${willDo ? '开始背 ' + willDo + ' 个词' : '这一组都学完了'}
      </button>
      ${st.due ? `<button class="btn btn-primary ghost" style="width:100%;margin-top:10px" data-review-list="${gi}">只复习这一组的 ${st.due} 个到期词</button>` : ''}
      <div class="sheet-note">${(B.state.settings.drillNew && remaining >= 2) ? '新模式：新词按 10 个一组抽查 3 轮（英→中 / 中→英 / 拼写），全对才进下一组' : '背完后这些词会在明天自动进入复习'}</div>
    </div>`;

    document.body.appendChild(mask);
    mask.addEventListener('click', (e) => {
      if (e.target === mask) { mask.remove(); return; }
      if (e.target.closest('[data-size]')) { PK.size = parseInt(e.target.closest('[data-size]').getAttribute('data-size'), 10); mask.remove(); openListSheet(gi); return; }
      if (e.target.closest('[data-order]')) { PK.order = e.target.closest('[data-order]').getAttribute('data-order'); mask.remove(); openListSheet(gi); return; }
      if (e.target.closest('[data-toggle-new]')) { PK.onlyNew = !PK.onlyNew; mask.remove(); openListSheet(gi); return; }
      const sl = e.target.closest('[data-start-list]');
      if (sl) {
        mask.remove();
        B.state.settings.sessionSize = PK.size;
        B.state.settings.order = PK.order;
        B.state.settings.onlyNew = PK.onlyNew;
        B.save();
        startList(PK.book, gi, PK.size, PK.order, PK.onlyNew);
        return;
      }
      const rv = e.target.closest('[data-review-list]');
      if (rv) {
        mask.remove();
        const words = B.group(PK.book, gi).w.map((i) => W()[i][0])
          .filter((w) => B.state.words[w] && B.state.words[w].d <= Date.now());
        if (!words.length) { toast('这一组暂时没有到期词'); return; }
        S.queue = words; S.book = PK.book; S.gi = gi; S.title = B.group(PK.book, gi).t; S.kind = 'list';
        resetSession(); S.stat.reviewed = words.length;
        goStudy();
      }
    });
  }

  /* ---------------- 复习范围选择 ---------------- */
  const RV = { scope: 'due', size: 50 };

  function reviewPool(scope) {
    const WD = W();
    if (scope === 'due') return B.dueWordsAll();
    if (scope === 'weak') {
      return WD.filter((r) => {
        const c = B.state.words[r[0]];
        return c && c.st > 0 && (c.st < 3 || (c.l || 0) > 0);
      }).map((r) => r[0]);
    }
    return WD.filter((r) => { const c = B.state.words[r[0]]; return c && c.st > 0; }).map((r) => r[0]);
  }

  function startReview(words, title) {
    if (!words.length) { toast('这个范围暂时没有词'); return; }
    if (B.state.settings.reviewQuiz) {
      startReviewQuiz(qzShuffle(words.slice()), { title: title || '复习', book: B.state.settings.book });
    } else {
      S.queue = words;
      S.book = B.state.settings.book;
      S.gi = -1;
      S.kind = 'review';
      S.title = title || '复习';
      resetSession();
      S.stat.reviewed = words.length;
      goStudy();
    }
  }

  function openReviewSheet() {
    const counts = {
      due: reviewPool('due').length,
      weak: reviewPool('weak').length,
      all: reviewPool('all').length,
    };
    if (!counts.all) { toast('还没有学过的词，先去词书背一小组'); return; }
    if (!counts[RV.scope]) RV.scope = counts.due ? 'due' : 'all';
    const pool = counts[RV.scope];
    const willDo = RV.size === 0 ? pool : Math.min(RV.size, pool);

    const mask = document.createElement('div');
    mask.className = 'sheet-mask';
    mask.innerHTML = `<div class="sheet">
      <div class="grab"></div>
      <h3 style="font-size:22px">复习</h3>
      <div class="sheet-sub">已学 ${counts.all} 词 · 到期 ${counts.due} · 不熟 ${counts.weak}</div>

      <div class="opt-group">
        <div class="opt-lb">复习哪些词 <span>${counts[RV.scope]} 个可选</span></div>
        <div class="opt-row">
          <button data-scope="due" class="opt wide ${RV.scope === 'due' ? 'on' : ''}">到期复习 <em>${counts.due}</em></button>
          <button data-scope="weak" class="opt wide ${RV.scope === 'weak' ? 'on' : ''}">只复习不熟的 <em>${counts.weak}</em></button>
          <button data-scope="all" class="opt wide ${RV.scope === 'all' ? 'on' : ''}">全部已学 <em>${counts.all}</em></button>
        </div>
      </div>

      <div class="opt-group">
        <div class="opt-lb">这次复习多少 <span>超出的下次再来</span></div>
        <div class="opt-row">
          ${[20, 50, 100, 0].map((n) => `<button data-rsize="${n}" class="opt ${RV.size === n ? 'on' : ''}">${n === 0 ? '全部' : n}</button>`).join('')}
        </div>
      </div>

      <button class="btn btn-primary" style="width:100%;margin-top:6px" data-start-review="1" ${willDo ? '' : 'disabled'}>
        ${willDo ? '开始复习 ' + willDo + ' 个词' : '这个范围暂时没有词'}
      </button>
      <div class="sheet-note">复习用四选一快速过，答错的词会当场再问一次；不熟的词会记在记忆曲线里</div>
    </div>`;
    document.body.appendChild(mask);

    mask.addEventListener('click', (e) => {
      if (e.target === mask) { mask.remove(); return; }
      const sc = e.target.closest('[data-scope]');
      if (sc) { RV.scope = sc.getAttribute('data-scope'); mask.remove(); openReviewSheet(); return; }
      const sz2 = e.target.closest('[data-rsize]');
      if (sz2) { RV.size = parseInt(sz2.getAttribute('data-rsize'), 10); mask.remove(); openReviewSheet(); return; }
      if (e.target.closest('[data-start-review]')) {
        mask.remove();
        let words = reviewPool(RV.scope);
        if (RV.size > 0) words = qzShuffle(words.slice()).slice(0, RV.size);
        const label = RV.scope === 'weak' ? '不熟的词' : RV.scope === 'all' ? '全部已学' : '到期复习';
        startReview(words, label);
      }
    });
  }

  /* ---------------- 学习 ---------------- */
  function viewStudy() {
    if (!S.active || S.i >= S.queue.length) return viewDone();
    const word = S.queue[S.i];
    const r = recOf(word);
    if (!r) { S.i++; return viewStudy(); }
    const en = r[4], ex = r[5], excn = r[6];
    const extra = r[8] || {};
    const c = B.card(word);
    const isNew = c.st === 0;
    const mode = S.mode;
    const st = B.state.settings;

    const defsHtml = splitDefs(r[3]).slice(0, 4).map((d) => `
      <div class="d">${d.pos ? `<span class="pos">${esc(d.pos)}</span>` : ''}<span>${esc(d.text)}</span></div>`).join('')
      || '<div class="d" style="color:var(--faint)">这个词还没写释义，去「词书」里补一下</div>';

    const exHtml = ex ? `
      <div class="example">
        <div class="en">${highlight(ex, word)}</div>
        ${excn ? `<div class="cn">${esc(excn)}</div>` : ''}
        <div class="src">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h16M4 16h10"/></svg>
          ${excn ? '双语例句 · 词典语料库' : '例句 · 词书原句'}
        </div>
      </div>` : '';

    const body = S.flipped
      ? `<div class="defs">${defsHtml}</div>${en && st.showEnDef ? `<div class="en-def">${esc(en)}</div>` : ''}${ex && st.showExample ? exHtml : ''}`
      : '<button class="reveal-btn" data-act="flip">点击显示释义 · 空格</button>';

    let spellBlock = '';
    if (mode === 'spell') {
      spellBlock = `<div class="spell-box">
        <input class="spell-input ${S.checked ? (S.ok ? 'ok' : 'bad') : ''}" id="spell" lang="en" inputmode="latin" enterkeyhint="done" ${imeAttr()} data-lpignore="true"
          placeholder="听发音，拼出这个单词" value="${esc(S.typed)}" ${S.checked ? 'readonly' : ''} />
        <div class="spell-tip">${S.checked ? (S.ok ? '拼写正确 ✓' : (S.near ? '差一个字母，正确的是 <b style="color:var(--green)">' + esc(word) + '</b>' : '正确拼写：<b style="color:var(--green)">' + esc(word) + '</b>')) : '按 Enter 提交'}</div>
      </div>`;
    }

    const hidden = (mode === 'listen' && !S.flipped) || (mode === 'spell' && !S.checked);

    const easyBtn = st.showEasy ? `<button class="easy" data-q="3">太简单<small>${B.predict(word, 3)}</small></button>` : '';
    const rateHtml = mode === 'spell'
      ? (S.checked
        ? `<div class="rate">
             <button class="again" data-q="0">再来一遍<small>${B.predict(word, 0)}</small></button>
             <button class="hard" data-q="1">有点难<small>${B.predict(word, 1)}</small></button>
             <button class="good" data-q="2">记住了<small>${B.predict(word, 2)}</small></button>
             ${easyBtn}
           </div>`
        : '<button class="btn btn-primary" data-act="spell-submit" style="margin-top:14px">提交拼写</button>')
      : (S.flipped
        ? `<div class="rate">
             <button class="again" data-q="0">忘记<small>${B.predict(word, 0)}</small></button>
             <button class="hard" data-q="1">模糊<small>${B.predict(word, 1)}</small></button>
             <button class="good" data-q="2">认识<small>${B.predict(word, 2)}</small></button>
             ${easyBtn}
           </div>`
        : `<div class="rate" style="opacity:.32;pointer-events:none">
             <button class="again">忘记<small>—</small></button>
             <button class="hard">模糊<small>—</small></button>
             <button class="good">认识<small>—</small></button>
             ${st.showEasy ? '<button class="easy">太简单<small>—</small></button>' : ''}
           </div>`);

    const crumb = S.gi >= 0 ? `${B.book(S.book).name} · ${esc(S.title)}` : esc(S.title);
    const accent = st.accent === 'uk' ? 'uk' : 'us';

    return `
      <div class="study-wrap">
        <div class="study-top">
          <button class="exit" data-act="exit" aria-label="退出">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
          <div style="flex:1;min-width:0">
            <div class="study-progress"><i style="width:${pct(S.i, S.queue.length)}%"></i></div>
            <div class="study-crumb">${crumb}</div>
          </div>
          <div class="study-count">${S.i + 1} / ${S.queue.length}</div>
        </div>

        <div class="flash ${S.flipped ? 'flipped' : ''}" data-act="flip">
          <div class="flash-tag">
            ${isNew ? '<span class="pill brand">新词</span>' : '<span class="pill green">复习</span>'}
            ${c.st === 3 ? '<span class="pill">已掌握</span>' : ''}
            ${r[7] >= 4 ? '<span class="pill">高频</span>' : ''}
            <button class="star ${B.isStarred(word) ? 'on' : ''}" data-act="star" data-word="${esc(word)}" aria-label="收藏到生词本">${B.isStarred(word) ? '★' : '☆'}</button>
          </div>

          <div class="word ${hidden ? 'hide' : ''}">${esc(word)}</div>

          ${st.showIpa ? `<div class="ipa">
            <span class="slash">/</span><span>${esc(r[1] || '—')}</span><span class="slash">/</span>
            <button class="spk" data-say="us" data-word="${esc(word)}" title="美式发音（词典录音）">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
            </button>
            ${r[2] && r[2] !== r[1] ? `<button class="spk" data-say="uk" data-word="${esc(word)}" title="英式发音（词典录音）">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
            </button>` : ''}
          </div>` : `<div class="ipa"><button class="spk" data-say="${accent}" data-word="${esc(word)}" title="发音">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
            </button></div>`}

          <div class="peek" data-noflip>
            <button class="peek-btn ${S.panel === 'ety' ? 'on' : ''}" data-panel="ety">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5c0-1 .8-1.5 2-1.5h12c1.2 0 2 .5 2 1.5v11c0 1-.8 1.5-2 1.5H6c-1.2 0-2-.5-2-1.5Z"/><path d="M8 9h8M8 13h5"/></svg>
              由来
            </button>
            <button class="peek-btn ${S.panel === 'root' ? 'on' : ''}" data-panel="root">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-6"/><path d="M12 15c0-4-3-6-6-6 0 4 3 6 6 6Z"/><path d="M12 15c0-4 3-6 6-6 0 4-3 6-6 6Z"/></svg>
              词根
            </button>
          </div>
          ${S.panel ? renderPanel(r, extra) : ''}

          <div class="flash-body">
            ${spellBlock}
            ${mode === 'spell' && !S.checked ? '' : body}
          </div>
        </div>

        ${rateHtml}
        <div class="kbd-hint">
          ${mode === 'spell'
        ? '<kbd>Enter</kbd> 提交 / 下一个 · <kbd>Esc</kbd> 退出'
        : '<kbd>空格</kbd> 翻面 · <kbd>1</kbd> 忘记 · <kbd>2</kbd> 模糊 · <kbd>3</kbd> 认识' + (st.showEasy ? ' · <kbd>4</kbd> 太简单' : '')}
        </div>
      </div>`;
  }

  // 同根词索引：只在第一次打开「由来」时建一次
  let rootIdx = null;
  function sameRootWords(word) {
    const a = RT.analyze(word);
    if (!a.ok) return [];
    const first = a.parts.filter((p) => p.kind === 'root')[0];
    if (!first) return [];
    if (!rootIdx) {
      rootIdx = {};
      const WD = W();
      for (let i = 0; i < WD.length; i++) {
        const an = RT.analyze(WD[i][0]);
        if (!an.ok) continue;
        const rt0 = an.parts.filter((p) => p.kind === 'root')[0];
        if (!rt0) continue;
        (rootIdx[rt0.t] = rootIdx[rt0.t] || []).push(WD[i][0]);
      }
    }
    return (rootIdx[first.t] || []).filter((w) => w !== word).slice(0, 8);
  }

  function renderPanel(r, extra) {
    const word = r[0];
    const src = extra.src || [];
    const bookNames = {};
    B.books().forEach((b) => { bookNames[b.code] = b.name; });

    // 由来：词源构成 + 书记忆法 + 同根词（哪个 List 只作为附注）
    if (S.panel === 'ety') {
      const an = RT.analyze(word);
      const segs = an.ok
        ? an.parts.filter((p) => p.m || p.kind !== 'rest').map((p) =>
          `<span class="rt ${p.kind}">${esc(p.t)}${p.m ? '<i>' + esc(p.m) + '</i>' : ''}${p.o ? '<u>' + esc(p.o) + '</u>' : ''}</span>`
        ).join('<span class="rt-plus">+</span>')
        : '';
      const same = sameRootWords(word);
      const srcLine = src.map((s) => {
        const g = B.group(s[0], s[1]);
        return esc((bookNames[s[0]] || s[0])) + (g ? ' · ' + esc(g.t) : '');
      }).join('　');
      return `<div class="panel" data-noflip>
        <div class="panel-h">单词的由来</div>
        ${segs
          ? `<div class="rt-row">${segs}</div>
             <div class="ety-line">词根词缀拼起来就是它的原始意思，先记住每个零件再记整词。</div>`
          : `<div class="panel-note">这个词是整体借用进英语的，拆不出常用词根，直接按整体记更好。</div>`}
        ${extra.note ? `<div class="mem"><b>书记忆法</b>${esc(extra.note)}</div>` : ''}
        ${same.length ? `<div class="ety-h">同根词 · 一起记</div>
          <div class="chips-inline">${same.map((w) => `<button class="tagchip link" data-peek="${esc(w)}"><i>同根</i>${esc(w)}</button>`).join('')}</div>` : ''}
        ${srcLine ? `<div class="ety-src">收录于 ${srcLine}</div>` : ''}
      </div>`;
    }

    const parts = RT.analyze(word);
    const seg = parts.ok ? parts.parts.map((p) =>
      `<span class="rt ${p.kind}">${esc(p.t)}${p.m ? '<i>' + esc(p.m) + '</i>' : ''}</span>`).join('<span class="rt-plus">+</span>') : '';

    const chips = [];
    if (extra.syn) chips.push(['近义', extra.syn]);
    if (extra.ant) chips.push(['反义', extra.ant]);
    if (extra.der) chips.push(['派生', extra.der]);

    return `<div class="panel" data-noflip>
      <div class="panel-h">词根词缀 ${parts.ok ? '' : '<span class="panel-warn">未识别到常用词根</span>'}</div>
      ${seg ? `<div class="rt-row">${seg}</div>` : ''}
      ${extra.note ? `<div class="mem"><b>书记忆法</b>${esc(extra.note)}</div>` : ''}
      ${chips.length ? `<div class="chips-inline">${chips.map(([k, v]) =>
      `<span class="tagchip"><i>${k}</i>${esc(v)}</span>`).join('')}</div>` : ''}
      ${!parts.ok && !extra.note && !chips.length ? '<div class="panel-note">这个词没有可拆解的常用词根，整体记忆即可</div>' : ''}
    </div>`;
  }

  /* ================= 精学抽查（10 词一组 · 三轮）与复习四选一 ================= */
  const QZ_NAME = { en2cn: '英 → 中', cn2en: '中 → 英', spell: '看义拼写', listen: '听音选义' };
  const QZ_TIP = {
    en2cn: '选出这个词的中文释义',
    cn2en: '选出对应的英文单词',
    spell: '看释义拼出单词',
    listen: '听发音，选出中文释义',
  };

  function defText(r) {
    const ds = splitDefs((r && r[3]) || []);
    if (!ds.length) return String((r && r[4]) || '').slice(0, 40);
    return ds.slice(0, 2).map((d) => d.text).join('；').slice(0, 48);
  }

  function qzShuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // 干扰项要像样：先记下每个词的词性和长度，挑选项时按「同词性 + 长度接近」打分
  function qzPosOf(r) {
    const ds = splitDefs((r && r[3]) || []);
    if (!ds.length || !ds[0].pos) return '';
    // 「n./v.」这种多词性统一成 n/v，便于和别的词求交集
    return ds[0].pos.replace(/\./g, '').split('/').filter(Boolean).sort().join('/');
  }

  function qzPool() {
    const q = S.quiz;
    if (!q.pool) {
      const WD = W();
      q.pool = [];
      for (let i = 0; i < WD.length; i++) {
        const r = WD[i];
        if (!r[3] || !r[3].length) continue;
        const t = defText(r);
        q.pool.push([r[0], t, qzPosOf(r), t.length, r[0].length]);
      }
    }
    return q.pool;
  }

  // 挑 3 个干扰项：同词性优先、长度接近优先，实在不够再全库随机补
  function qzDistract(correct, pos, useDefLen) {
    const pool = qzPool();
    const baseLen = correct.length;
    const chosen = {};
    chosen[correct] = 1;
    const out = [];
    const cand = [];
    const posSet = pos ? pos.split('/') : [];
    for (let i = 0; i < pool.length; i++) {
      const p = pool[i];
      const v = useDefLen ? p[1] : p[0];
      if (!v || chosen[v]) continue;
      const d = Math.abs((useDefLen ? p[3] : p[4]) - baseLen);
      const samePos = posSet.length > 0 && !!p[2] && p[2].split('/').some((k) => posSet.indexOf(k) >= 0);
      if (!samePos && d > 8) continue;      // 又不同词性又长短悬殊的，直接不要
      cand.push([v, (samePos ? 60 : 0) - d * 4 + Math.random() * 25]);
    }
    cand.sort((a, b) => b[1] - a[1]);
    for (let i = 0; i < cand.length && out.length < 3; i++) {
      if (chosen[cand[i][0]]) continue;
      chosen[cand[i][0]] = 1;
      out.push(cand[i][0]);
    }
    let guard = 0;
    while (out.length < 3 && guard++ < 600) {
      const p = pool[(Math.random() * pool.length) | 0];
      const v = useDefLen ? p[1] : p[0];
      if (!v || chosen[v]) continue;
      chosen[v] = 1;
      out.push(v);
    }
    return out;
  }

  // 只差一个字母（多一个 / 少一个 / 错一个）
  function oneEditAway(a, b) {
    if (a === b) return 0;
    const la = a.length, lb = b.length;
    if (Math.abs(la - lb) > 1) return 2;
    let i = 0, j = 0, miss = 0;
    while (i < la && j < lb) {
      if (a[i] === b[j]) { i++; j++; continue; }
      if (++miss > 1) return 2;
      if (la > lb) i++;
      else if (lb > la) j++;
      else { i++; j++; }
    }
    if (i < la || j < lb) miss++;
    return miss <= 1 ? 1 : 2;
  }

  // 复习出题不再固定轮换：越熟的词越要求「产出」（中译英、默写），
  // 反复忘的词直接上默写，避免四选一带来的「假会」
  function qzType() {
    const q = S.quiz;
    if (q.kind === 'drill') return ['en2cn', 'cn2en', 'spell'][q.round] || 'en2cn';
    const w = q.queue[q.idx];
    const c = w ? B.state.words[w] : null;
    if (!c || c.st === 0) return 'en2cn';
    if ((c.l || 0) >= 4) return 'spell';
    if (c.st === 1) return q.idx % 2 ? 'cn2en' : 'en2cn';
    if (c.st === 2) return ['cn2en', 'listen', 'spell'][q.idx % 3];
    return q.idx % 2 ? 'spell' : 'cn2en';
  }

  // 每题只生成一次选项，避免重绘时顺序乱跳
  function qzEnsure() {
    const q = S.quiz;
    if (!q) return null;
    if (q.cur && q.cur.idx === q.idx) return q.cur;
    const word = q.queue[q.idx];
    const r = word ? recOf(word) : null;
    if (!r) { q.cur = null; return null; }
    const type = qzType();
    const correct = type === 'cn2en' ? word : defText(r);
    const opts = [correct].concat(qzDistract(correct, qzPosOf(r), type !== 'cn2en'));
    qzShuffle(opts);
    q.cur = { idx: q.idx, word: word, r: r, type: type, opts: opts, ans: opts.indexOf(correct) };
    if (type === 'listen') {
      const w = word;
      setTimeout(() => AUD.play(w, B.state.settings.accent === 'uk' ? 'uk' : 'us'), 80);
    }
    return q.cur;
  }

  function qzStart(kind, groups, opts) {
    opts = opts || {};
    S.quiz = {
      kind: kind, groups: groups, gi: 0, round: 0, idx: 0, queue: [], cur: null, fb: null,
      wrong: {}, ask: {}, typed: '', checked: false, ok: false, near: false, pool: null, sum: null,
      chain: opts.chain && opts.chain.length ? opts.chain.slice() : null,
      book: opts.book || B.state.settings.book,
      gi0: opts.gi === undefined ? -1 : opts.gi,
      title: opts.title || (kind === 'review' ? '复习抽查' : '新词精学'),
      stat: { fresh: 0, reviewed: 0, ok: 0, bad: 0 },
    };
    S.active = true;
    S.done = false;
    S.queue = [];
    S.i = 0;
    S.panel = '';
    B.setPending(null);
    qzBuildRound();
    if (location.hash === '#/study') render();
    else location.hash = '#/study';
  }

  function startDrill(words, opts) {
    const groups = [];
    for (let i = 0; i < words.length; i += 10) groups.push(words.slice(i, i + 10));
    qzStart('drill', groups, opts || {});
  }

  function startReviewQuiz(words, opts) {
    qzStart('review', [qzShuffle(words.slice())], opts || {});
  }

  function qzBuildRound() {
    const q = S.quiz;
    const g = q.groups[q.gi] || [];
    q.queue = qzShuffle(g.slice());
    q.idx = 0; q.cur = null; q.fb = null;
    q.typed = ''; q.checked = false; q.ok = false; q.near = false;
  }

  function qzRecord(ok, pick) {
    const q = S.quiz;
    const cur = q.cur;
    if (!cur) return;
    const w = cur.word;
    q.fb = { ok: ok, pick: pick, ans: cur.ans };
    q.ask[w] = (q.ask[w] || 0) + 1;
    if (ok) {
      q.stat.ok++;
    } else {
      q.stat.bad++;
      B.markWrong(w);                                 // 答错 → 进错题本
      q.wrong[w] = (q.wrong[w] || 0) + 1;
      const cap = q.kind === 'review' ? 2 : 99;
      if (q.ask[w] < cap) q.queue.push(w);   // 不会的排到本轮末尾，再来一次
    }
    // 复习模式当场结算：中途退出也不丢进度
    // 一次答对=认识，重问后答对=模糊，两次都错=忘记
    if (q.kind === 'review') {
      const resolved = ok || (q.ask[w] || 0) >= 2;
      q.graded = q.graded || {};
      if (resolved && !q.graded[w]) {
        q.graded[w] = 1;
        const card = B.card(w);
        const wasNew = !card || card.st === 0;
        B.grade(w, ok ? (q.ask[w] === 1 ? 2 : 1) : 0);
        if (wasNew) q.stat.fresh++;
        else q.stat.reviewed++;
      }
    }
    B.save();
  }

  function qzAnswer(pick) {
    const q = S.quiz;
    if (!q || q.fb) return;
    const cur = qzEnsure();
    if (!cur) return;
    qzRecord(pick === cur.ans, pick);
    render();
  }

  function qzSpellSubmit() {
    const q = S.quiz;
    if (!q || q.fb) return;
    const cur = qzEnsure();
    if (!cur) return;
    const inp = $('#qzspell');
    if (inp) q.typed = inp.value;
    const v = (q.typed || '').trim().toLowerCase();
    if (!v) { toast('先拼一下再提交'); return; }
    const ok = v === cur.word.toLowerCase();
    q.checked = true;
    q.ok = ok;
    q.near = !ok && oneEditAway(v, cur.word.toLowerCase()) === 1;
    qzRecord(ok, -1);
    if (!ok && B.state.settings.spellReplay) setTimeout(() => AUD.play(cur.word, B.state.settings.accent === 'uk' ? 'uk' : 'us'), 260);
    else if (ok) AUD.play(cur.word, B.state.settings.accent === 'uk' ? 'uk' : 'us');
    render();
  }

  function qzNext() {
    const q = S.quiz;
    if (!q || !q.fb) return;
    S.panel = '';
    q.fb = null;
    q.cur = null;
    q.typed = '';
    q.checked = false;
    q.ok = false;
    q.near = false;
    q.idx++;
    if (q.idx >= q.queue.length) { qzEndRound(); return; }
    render();
  }

  function qzEndRound() {
    const q = S.quiz;
    if (q.kind === 'drill') {
      if (q.round < 2) { q.round++; qzBuildRound(); render(); return; }
      qzGradeGroup();
      q.gi++;
      if (q.gi >= q.groups.length) { qzFinish(); return; }
      q.round = 0;
      qzBuildRound();
      render();
      return;
    }
    qzGradeGroup();
    qzFinish();
  }

  // 一组的三轮全部过关后，按错误次数折算记忆曲线评分
  function qzGradeGroup() {
    const q = S.quiz;
    const words = q.groups[q.gi] || [];
    words.forEach((w) => {
      if (q.graded && q.graded[w]) return;  // 复习模式已当场结算
      const err = q.wrong[w] || 0;
      const card = B.card(w);
      const wasNew = !card || card.st === 0;
      B.grade(w, err === 0 ? 2 : err === 1 ? 1 : 0);
      if (wasNew) q.stat.fresh++;
      else q.stat.reviewed++;
    });
  }

  function qzFinish() {
    const q = S.quiz;
    const all = [];
    q.groups.forEach((g) => g.forEach((w) => all.push(w)));
    const weak = all.map((w) => ({ w: w, err: q.wrong[w] || 0 }))
      .filter((x) => x.err > 0)
      .sort((a, b) => b.err - a.err);
    q.sum = { total: all.length, weak: weak, stat: q.stat, kind: q.kind, chain: q.chain };
    B.state.sessions.push({ t: Date.now(), n: q.stat.fresh, r: q.stat.reviewed, ok: q.stat.ok, bad: q.stat.bad });
    if (B.state.sessions.length > 200) B.state.sessions = B.state.sessions.slice(-200);
    B.state.lastSession = { book: q.book, gi: q.gi0, t: Date.now() };
    B.saveNow();
    updateBadges();
    render();
  }

  function qzExit() {
    const q = S.quiz;
    if (q && !q.sum) {
      if (q.kind === 'review') {
        const doneN = q.stat.fresh + q.stat.reviewed;
        toast(doneN ? '已答完的 ' + doneN + ' 个词已计入记忆曲线' : '已退出');
      } else {
        const doneGroups = q.gi;
        toast(doneGroups ? '已学完的 ' + doneGroups + ' 组已保存，本组下次重来' : '已退出，本组下次重来');
      }
    }
    S.quiz = null;
    S.active = false;
    S.done = false;
    location.hash = '#/home';
  }

  function qzBlank(word) {
    const n = Math.max(3, word.length);
    return word.slice(0, 2) + new Array(Math.max(1, n - 1)).join('·') + ' (' + n + ')';
  }

  function viewQuiz() {
    const q = S.quiz;
    const cur = qzEnsure();
    if (!cur) {
      // 队列里出现没有词条的词，直接跳过，避免卡死
      q.idx++;
      if (q.idx >= q.queue.length) {
        qzEndRound();
        if (!S.quiz) return viewDone();
        return S.quiz.sum ? viewQuizSummary() : viewQuiz();
      }
      return viewQuiz();
    }
    const st = B.state.settings;
    const roundName = QZ_NAME[cur.type];
    const p = Math.round(((q.gi + (q.queue.length ? q.idx / q.queue.length : 1)) / Math.max(1, q.groups.length)) * 100);
    const bk = B.book(q.book);
    const crumb = (bk ? bk.name + ' · ' : '') + esc(q.title) +
      (q.kind === 'drill' ? ` · 第 ${q.gi + 1}/${q.groups.length} 组 · 第 ${q.round + 1}/3 轮` : '');
    const fb = q.fb;
    const accent = st.accent === 'uk' ? 'uk' : 'us';
    const qExtra = (cur.r && cur.r[8]) || {};

    let card = '';
    if (cur.type === 'spell') {
      card = `<div class="qz-card">
        <div class="qz-tag">${roundName}</div>
        <div class="qz-prompt cn">${esc(defText(cur.r))}</div>
        <div class="qz-blank">${esc(qzBlank(cur.word))}</div>
        <input class="spell-input ${q.checked ? (q.ok ? 'ok' : 'bad') : ''}" id="qzspell" lang="en" inputmode="latin" enterkeyhint="done" ${imeAttr()} data-lpignore="true"
          placeholder="拼出这个单词" value="${esc(q.typed)}" ${q.checked ? 'readonly' : ''} />
        <div class="qz-note">${q.checked
          ? (q.ok ? '拼写正确 ✓'
            : (q.near
              ? '差一个字母，正确的是 <b style="color:var(--green)">' + esc(cur.word) + '</b>'
              : '正确拼写：<b style="color:var(--green)">' + esc(cur.word) + '</b>'))
          : '按 Enter 提交'}</div>
      </div>`;
    } else {
      let head = '';
      if (cur.type === 'en2cn') {
        head = `<div class="qz-prompt">${esc(cur.word)}</div>
          <div class="qz-sub">${cur.r[1] ? `<span>/ ${esc(cur.r[1])} /</span>` : ''}
            <button class="spk" data-say="${accent}" data-word="${esc(cur.word)}" title="发音">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
            </button>
          </div>`;
      } else if (cur.type === 'listen') {
        head = `<div class="qz-prompt cn">听发音，选出它的意思</div>
          <div class="qz-sub"><button class="btn btn-primary ghost" data-act="qz-say" style="height:40px;width:100%">再听一次</button></div>`;
      } else {
        head = `<div class="qz-prompt cn">${esc(defText(cur.r))}</div>`;
      }
      card = `<div class="qz-card"><div class="qz-tag">${roundName}</div>${head}</div>
        <div class="qz-opts">
          ${cur.opts.map((o, i) => {
            let cls = 'qz-opt';
            if (fb) cls += i === fb.ans ? ' ok' : i === fb.pick ? ' bad' : ' dim';
            return `<button class="${cls}" data-opt="${i}" ${fb ? 'disabled' : ''}><b>${i + 1}</b><span>${esc(o)}</span></button>`;
          }).join('')}
        </div>`;
    }

    const footer = fb
      ? `<button class="btn btn-primary" data-act="qz-next" style="margin-top:14px">继续 · Enter</button>`
      : (cur.type === 'spell'
        ? '<button class="btn btn-primary" data-act="qz-spell" style="margin-top:14px">提交 · Enter</button>'
        : '<div class="kbd-hint">按 <kbd>1</kbd>–<kbd>4</kbd> 选择</div>');

    return `
      <div class="study-wrap">
        <div class="study-top">
          <button class="exit" data-act="qz-exit" aria-label="退出">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
          <div style="flex:1;min-width:0">
            <div class="study-progress"><i style="width:${p}%"></i></div>
            <div class="study-crumb">${crumb}</div>
          </div>
          <div class="study-count">${q.idx + 1} / ${q.queue.length}</div>
        </div>
        ${card}
        ${fb ? `<div class="qz-fb">
          <div class="qz-fb-def">${esc(defText(cur.r))}</div>
          ${cur.r[5] ? `<div class="qz-fb-ex">${esc(cur.r[5])}${cur.r[6] ? '<i>' + esc(cur.r[6]) + '</i>' : ''}</div>` : ''}
          <div class="peek" data-noflip>
            <button class="peek-btn ${S.panel === 'ety' ? 'on' : ''}" data-panel="ety">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5c0-1 .8-1.5 2-1.5h12c1.2 0 2 .5 2 1.5v11c0 1-.8 1.5-2 1.5H6c-1.2 0-2-.5-2-1.5Z"/><path d="M8 9h8M8 13h5"/></svg>
              由来
            </button>
            <button class="peek-btn ${S.panel === 'root' ? 'on' : ''}" data-panel="root">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21v-6"/><path d="M12 15c0-4-3-6-6-6 0 4 3 6 6 6Z"/><path d="M12 15c0-4 3-6 6-6 0 4-3 6-6 6Z"/></svg>
              词根
            </button>
          </div>
          ${S.panel ? renderPanel(cur.r, qExtra) : ''}
        </div>` : ''}
        ${footer}
      </div>`;
  }

  function viewQuizSummary() {
    const q = S.quiz;
    const s = q.sum;
    const weakN = s.weak.length;
    const goodN = s.total - weakN;
    const rows = s.weak.slice(0, 60).map((x) => {
      const r = recOf(x.w);
      return `<div class="qz-row">
        <div><div class="qw">${esc(x.w)}</div><div class="qm">${esc(r ? defText(r) : '')}</div></div>
        <span class="qz-err">错 ${x.err} 次</span>
      </div>`;
    }).join('');
    return `
      <div class="study-wrap">
        <div class="card done-card" style="margin-top:20px">
          <div class="done-emoji">${weakN ? '💪' : '🎉'}</div>
          <h2>${q.kind === 'drill' ? '这一轮背完了' : '复习完成'}</h2>
          <p>${s.total} 个词 · 一次就过 <b style="color:var(--green)">${goodN}</b> 个 · 需要再看 <b style="color:var(--red)">${weakN}</b> 个</p>
          <div class="done-grid">
            <div><b>${s.total}</b><span>本次词数</span></div>
            <div><b>${goodN}</b><span>全对</span></div>
            <div><b>${weakN}</b><span>不熟</span></div>
          </div>
        </div>

        ${weakN ? `<div class="card tight" style="margin-top:12px">
          <div class="rec-h">这些词还不熟</div>
          <div class="qz-sum">${rows}</div>
          ${weakN > 60 ? '<div class="qz-note">只列出错得最多的 60 个</div>' : ''}
        </div>` : `<div class="card tight" style="margin-top:12px"><div class="empty" style="padding:16px 0">全部一次通过，去背下一组吧</div></div>`}

        ${weakN ? `<button class="btn btn-primary" data-act="qz-retry" style="margin-top:12px;width:100%">再练这 ${weakN} 个</button>` : ''}
        ${s.chain && s.chain.length ? `<button class="btn btn-primary ghost" data-act="qz-chain" style="margin-top:10px;width:100%">继续背 ${s.chain.length} 个新词</button>` : ''}
        <button class="btn btn-primary ghost" data-act="qz-done" style="margin-top:10px;width:100%">完成，回到今日</button>
        <div class="kbd-hint"><kbd>Enter</kbd> 完成</div>
      </div>`;
  }

  function viewDone() {
    const st = S.stat;
    const total = st.again + st.hard + st.good;
    const acc = total ? Math.round((st.good / total) * 100) : 0;
    const due = B.dueWordsAll().length;
    const tomorrow = countDueWithin(86400000);
    return `
      <div class="study-wrap">
        <div class="card done-card" style="margin-top:20px">
          <div class="done-emoji">🎉</div>
          <h2>这一组蹦完了</h2>
          <p>已排进复习计划，<b style="color:var(--ink)">明天要复习 ${tomorrow} 个词</b></p>
          <div class="done-stats">
            <div><div class="num">${st.fresh}</div><div class="lb">新学</div></div>
            <div><div class="num">${st.reviewed}</div><div class="lb">复习</div></div>
            <div><div class="num">${acc}%</div><div class="lb">认识率</div></div>
          </div>
          ${S.kind === 'quick' ? `<button class="btn btn-primary" data-quick="${S.quickN || 5}">再来 ${S.quickN || 5} 个</button>` : ''}
          <button class="btn btn-primary" data-act="home">回到今日</button>
          <button class="btn btn-primary ghost" style="width:100%;margin-top:10px" data-act="books">再选一组 List</button>
          ${due ? `<button class="btn btn-primary ghost" style="width:100%;margin-top:10px" data-act="only-review">继续复习 ${due} 个到期词</button>` : ''}
        </div>
      </div>`;
  }

  function countDueWithin(ms) {
    const now = Date.now();
    let n = 0;
    const WD = W();
    for (let i = 0; i < WD.length; i++) {
      const c = B.state.words[WD[i][0]];
      if (c && c.d > now && c.d <= now + ms) n++;
    }
    return n;
  }

  /* ---------------- 生词本 / 错题本 ---------------- */
  const NB = { tab: 'star', sort: 'wrong' };

  function viewNotebook() {
    const starred = B.starredWords();
    const wrong = B.wrongWords();
    let list = (NB.tab === 'star' ? starred : wrong).slice();
    const cw = B.state.words;
    if (NB.sort === 'wrong') {
      list.sort((a, b) => ((cw[b] && cw[b].x) || 0) - ((cw[a] && cw[a].x) || 0));
    } else if (NB.sort === 'recent') {
      list.sort((a, b) => ((cw[b] && cw[b].u) || 0) - ((cw[a] && cw[a].u) || 0));
    } else if (NB.sort === 'az') {
      list.sort((a, b) => (a < b ? -1 : a > b ? 1 : 0));
    }
    const tab = (k, label, n) => `<button class="nb-tab ${NB.tab === k ? 'on' : ''}" data-nb="${k}">${label}<i>${n}</i></button>`;

    const rows = list.slice(0, 400).map((w) => {
      const r = B.recOf(w);

  /* ---------------- 进度 ---------------- */
  function viewStats() {
    const c = B.counts();
    let learnedAll = 0, reviewSum = 0, reviewN = 0;
    const WD = W();
    for (let i = 0; i < WD.length; i++) {
      const cd = B.state.words[WD[i][0]];
      if (!cd || cd.st === 0) continue;
      learnedAll++;
      if (cd.i > 0) { reviewSum += cd.i; reviewN++; }
    }
    let ok = 0, bad = 0, days = 0;
    Object.keys(B.state.logs).forEach((k) => {
      const lg = B.state.logs[k];
      ok += lg.ok; bad += lg.bad;
      if (lg.n + lg.r > 0) days++;
    });
    const acc = ok + bad ? Math.round((ok / (ok + bad)) * 100) : 0;
    const avgI = reviewN ? reviewSum / reviewN : 0;

    const buckets = [0, 0, 0, 0, 0, 0, 0];
    const now = Date.now();
    for (let i = 0; i < WD.length; i++) {
      const cd = B.state.words[WD[i][0]];
      if (!cd || !cd.d) continue;
      const diff = Math.floor((cd.d - now) / 86400000);
      if (diff < 0) buckets[0]++;
      else if (diff < 7) buckets[diff]++;
    }
    const bmax = Math.max.apply(null, buckets.concat([1]));

    return `
      <div class="topbar">
        <div class="brand"><b>进度</b><span>记忆曲线调度</span></div>
        <span class="pill green">已学 ${learnedAll} / ${WD.length}</span>
      </div>

      <div class="stat-grid">
        <div class="stat-box"><div class="num">${learnedAll}</div><div class="lb">累计学词</div></div>
        <div class="stat-box"><div class="num">${c.due}</div><div class="lb">本词书待复习</div></div>
        <div class="stat-box"><div class="num">${acc}%</div><div class="lb">平均认识率</div></div>
      </div>

      <div class="sec-title"><h2>打卡热力图</h2><span class="link">已坚持 ${days} 天</span></div>
      <div class="card">
        ${heatmap()}
        <div style="display:flex;align-items:center;gap:6px;justify-content:flex-end;font-size:10.5px;color:var(--faint);margin-top:10px">
          少 <span style="display:flex;gap:3px"><i class="hcell"></i><i class="hcell l1"></i><i class="hcell l2"></i><i class="hcell l3"></i><i class="hcell l4"></i></span> 多
        </div>
      </div>

      <div class="sec-title"><h2>未来 7 天复习量</h2></div>

        <div style="display:flex;align-items:flex-end;gap:10px;height:112px">
          ${buckets.map((v, i) => `<div style="flex:1;text-align:center">
            <div style="height:${Math.max(4, (v / bmax) * 78)}px;background:${i === 0 ? 'var(--amber)' : 'var(--brand)'};opacity:${i === 0 ? 1 : 0.3 + 0.6 * (v / bmax)};border-radius:6px 6px 3px 3px;transition:height .5s var(--spring)"></div>
            <div style="font-size:10.5px;color:var(--faint);margin-top:6px">${i === 0 ? '今天' : '+' + i}</div>
            <div style="font-size:10.5px;color:var(--sub);font-variant-numeric:tabular-nums">${v}</div>
          </div>`).join('')}
        </div>
      </div>

      <div class="sec-title"><h2>记忆强度</h2><span class="link">平均间隔 ${avgI ? avgI.toFixed(1) : 0} 天</span></div>
      <div class="card">
        ${curveSvg()}
        <div style="font-size:12px;color:var(--sub);line-height:1.7;margin-top:10px">
          按 <b style="color:var(--ink)">SM-2</b> 调度：忘记 → 10 分钟后重现；模糊 → 间隔 ×1.25；认识 → 间隔 × 熟练度系数。
          下次复习多在 <b style="color:var(--ink)">第二天</b>，间隔超过 21 天视为「已掌握」，最长可到半年。
        </div>
      </div>

      const cc = B.counts(b2.code);

  function heatmap() {
    const weeks = 15;
    const cells = [];
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const start = new Date(today);
    start.setDate(start.getDate() - (weeks * 7 - 1));
    start.setDate(start.getDate() - start.getDay());
    for (let i = 0; i < weeks * 7 + 7; i++) {
      const d = new Date(start);
      d.setDate(d.getDate() + i);
      const k = B.dayKey(d.getTime());
      const lg = B.state.logs[k];
      const n = lg ? lg.n + lg.r : 0;
      const lv = n === 0 ? 0 : n < 5 ? 1 : n < 15 ? 2 : n < 35 ? 3 : 4;
      if (d > today) cells.push('<i style="visibility:hidden"></i>');
      else cells.push(`<i class="hcell ${lv ? 'l' + lv : ''}" title="${k} · ${n} 词"></i>`);
    }
    return `<div class="heat">${cells.join('')}</div>`;
  }

  /* ---------------- 设置 ---------------- */
  function seg(list, cur, attr) {
    return list.map((x) => {
      const k = Array.isArray(x) ? x[0] : x;
      const n = Array.isArray(x) ? x[1] : x;
      return `<button data-${attr}="${k}" class="${String(cur) === String(k) ? 'on' : ''}">${n}</button>`;
    }).join('');
  }

  function sw(act, on) {
    return `<div class="switch ${on ? 'on' : ''}" data-act="${act}"><i></i></div>`;
  }

  function learnedCount() {
    let n = 0;
    const w = B.state.words;
    for (const k in w) if (w[k] && w[k].st > 0) n++;
    return n;
  }

  function storeSize() {
    try {
      const raw = localStorage.getItem('bbb:state:v1') || '';
      const kb = raw.length / 1024;
      return kb < 1 ? '<1 KB' : Math.round(kb) + ' KB';
    } catch (e) { return '未知'; }
  }

    try { return (window.Notification && Notification.permission) || 'unsupported'; } catch (e) { return 'unsupported'; }

    const p = notiPerm();

    if (p === 'granted') return '已开启，到点会弹系统通知';
    if (p === 'denied') return '被浏览器拒绝过，需在站点设置里手动允许';
    return '还没授权，点右边开启';

  function notiStateBtn() {
    const p = notiPerm();
    if (p === 'granted') return '<span class="pill green" style="height:30px;padding:0 12px;display:grid;place-items:center">已开启</span>';
    if (p === 'unsupported') return '<span class="pill" style="height:30px;padding:0 12px;display:grid;place-items:center">不支持</span>';
    if (p === 'denied') return '<span class="pill red" style="height:30px;padding:0 12px;display:grid;place-items:center">已拒绝</span>';
    return '<button class="pill brand" data-act="ask-perm" style="height:30px;padding:0 12px">开启</button>';
  }
  function askPerm() {
    if (!(window.Notification && Notification.requestPermission)) { toast('这个浏览器不支持系统通知'); return; }
    try {
      Notification.requestPermission().then(() => render(), () => render());
    } catch (e) { render(); }
  }
  function remindKey() { return 'bbb:remind:' + B.dayKey(); }
  function updateTitle() {
    const d = B.dueWordsAll().length;
    document.title = d > 0 ? '(' + d + ') 绷绷绷单词' : 'bengbengbeng · 绷绷绷单词';
  }
  function checkRemind() {
    const st = B.state.settings;
    if (!st.remindOn) return;
    const now = new Date();
    const hm = String(st.remindTime || '20:00').split(':');
    const h = parseInt(hm[0], 10) || 0;
    const m = parseInt(hm[1], 10) || 0;
    const target = new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0, 0).getTime();
    if (now.getTime() < target) return;
    let seen = '';
    try { seen = localStorage.getItem(remindKey()) || ''; } catch (e) { }
    if (seen) return;
    const tc = B.todayCounts();
    const due = B.dueWordsAll().length;
    const fresh = Math.max(0, st.dailyNew - tc.newDone);
    if (!due && !fresh) return;
    const line = due ? '今天有 ' + due + ' 个词到期' : '今天还有 ' + fresh + ' 个新词没背';
    let ok = false;
    try {
      if (notiPerm() === 'granted') {
        new Notification('绷绷绷单词 · 该复习了', { body: line + '，按记忆曲线这会儿过一遍最划算。' });
        ok = true;
      }
    } catch (e) { ok = false; }
    if (!ok) { toast('该复习了：' + line); ok = true; }
    try { if (ok) localStorage.setItem(remindKey(), '1'); } catch (e) { }
  }

  function copyText(txt, msg) {
    const done = (ok) => toast(ok ? (msg || '链接已复制，粘贴到微信发给同学') : '复制失败，长按链接手动复制');
    const fallback = () => {
      try {
        const ta = document.createElement('textarea');
        ta.value = txt;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand ? document.execCommand('copy') : false;
        if (ta.remove) ta.remove(); else document.body.removeChild(ta);
        done(!!ok);
      } catch (e) { done(false); }
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(() => done(true), fallback);
        return;
      }
    } catch (e) { /* 剪贴板不可用，走兜底 */ }
    fallback();
  }

  /* ---------------- 搜索 ---------------- */
  function openSearch() {
    const mask = document.createElement('div');
    mask.className = 'sheet-mask';
    mask.innerHTML = `<div class="sheet" style="height:76vh;display:flex;flex-direction:column">
      <div class="grab"></div>
      <div class="search" style="flex:none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="sq" placeholder="搜单词或中文释义" autocomplete="off" />
      </div>
      <div id="sres" style="flex:1;overflow-y:auto"></div>
    </div>`;
    document.body.appendChild(mask);

    const input = mask.querySelector('#sq');
    const box = mask.querySelector('#sres');
    const WD = W();

    // 预建一次小写检索串，避免每次击键都把全库释义重新拼接
    let hay = null;
    function buildHay() {
      hay = new Array(WD.length);
      for (let i = 0; i < WD.length; i++) {
        const r = WD[i];
        hay[i] = (r[0] + ' ' + (r[3] || []).join(' ')).toLowerCase();
      }
    }

    function run() {
      const q = input.value.trim().toLowerCase();
      if (!q) { box.innerHTML = '<div class="empty">输入字母或中文开始搜索</div>'; return; }
      if (!hay) buildHay();
      const out = [];
      const limit = q.length <= 2 ? 30 : 50;
      // 先找词首匹配，再退回包含匹配
      for (let i = 0; i < WD.length && out.length < limit; i++) {
        if (WD[i][0].toLowerCase().indexOf(q) === 0) out.push(WD[i]);
      }
      if (out.length < limit) {
        for (let i = 0; i < WD.length && out.length < limit; i++) {
          if (hay[i].indexOf(q) >= 0 && out.indexOf(WD[i]) < 0) out.push(WD[i]);
        }
      }
      box.innerHTML = out.length ? out.map((r) => `<button class="witem" data-word="${esc(r[0])}" style="width:100%">
          <span class="dot s${B.statusOf(B.state.words[r[0]])}"></span>
          <span class="w-main">
            <span class="w-word">${esc(r[0])}<span class="w-ipa">${esc(r[1] || '')}</span></span>
            <span class="w-cn">${esc((splitDefs(r[3])[0] || {}).text || '')}</span>
          </span>
        </button>`).join('') : '<div class="empty">没有找到</div>';
    }

    let debounce = 0;
    input.addEventListener('input', () => {
      clearTimeout(debounce);
      debounce = setTimeout(run, 110);
    });
    run();
    setTimeout(() => input.focus(), 60);

    mask.addEventListener('click', (e) => {
      if (e.target === mask) { clearTimeout(debounce); mask.remove(); return; }
      const wi = e.target.closest('[data-word]');
      if (wi) { clearTimeout(debounce); const w = wi.getAttribute('data-word'); mask.remove(); openWord(w); }
    });
  }

  /* ---------------- 路由 ---------------- */
  function currentRoute() {

  // 渲染出错时别整页卡死，给一个能自救的出口
  function renderCrash(e) {
    app.innerHTML = `<div class="card" style="margin-top:48px;text-align:center;padding:22px 18px">
      <div style="font-size:15px;font-weight:700;color:var(--red)">页面出错了</div>
      <div style="font-size:12px;color:var(--sub);margin-top:8px;line-height:1.7;word-break:break-all">${esc(String((e && e.message) || e))}</div>

      <div style="font-size:11px;color:var(--faint);margin-top:10px;line-height:1.7">会清掉进度和自制词书。能打开的话先去「我的」导出一份备份</div>
    </div>`;
  }

  function renderSafe() {
    const r = currentRoute();
    if (r === 'study' && !S.active && !S.done) { location.hash = '#/home'; return; }
    let html = '';
    if (r === 'study') {
      if (S.quiz) html = S.quiz.sum ? viewQuizSummary() : viewQuiz();
      else html = viewStudy();
    }
    else if (r === 'books') html = viewBooks();
    else if (r === 'stats') html = viewStats();
    else if (r === 'me') html = viewMe();
    else if (r === 'notebook') html = viewNotebook();
    else if (r === 'settings') html = viewSettings();
    else html = viewHome();

    app.innerHTML = html;

    if (tabbar) {
      tabbar.hidden = (r === 'study');
      $$('.tab', tabbar).forEach((t) => t.classList.toggle('on', t.dataset.tab === r));
      updateBadges();
    }

    if (r === 'study') {
      const inp = $('#spell');
      if (inp && !inp.readOnly) {
        inp.focus();
        inp.addEventListener('input', (e) => { S.typed = e.target.value; });
        try { const n = inp.value.length; inp.setSelectionRange(n, n); } catch (e) { }
      }
      const qinp = $('#qzspell');
      if (qinp && !qinp.readOnly) {
        qinp.focus();
        qinp.addEventListener('input', (e) => { if (S.quiz) S.quiz.typed = e.target.value; });
        try { const n = qinp.value.length; qinp.setSelectionRange(n, n); } catch (e) { }
      }
    }
    if (r === 'settings') {
      const di = $('#examdate');
      if (di) {
        di.addEventListener('change', () => {
          B.state.settings.examDate = di.value || '';
          B.touch(); B.save(); render();

    updateTitle();
  }
